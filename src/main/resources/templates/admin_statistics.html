<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PIMTO - 매출 통계 대시보드</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 💡 퍼센트 표시를 위한 플러그인 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        :root {
            --bg: #faf8f4;
            --card-bg: #ffffff;
            --header-bg: #f2ede4;
            --primary-text: #3d2c1e;
            --sub-text: #9e8c7a;
            --accent: #c47d4a;
            --border: #e8dfd4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg);
            color: var(--primary-text);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 대시보드 네비게이션 프리미엄 스타일 */
        .dash-nav-link { position: relative; text-decoration: none; color: var(--sub-text); font-weight: 700; font-size: 16px; letter-spacing: -0.3px; padding: 5px 0; transition: color 0.3s ease; }
        .dash-nav-link:hover, .dash-nav-link.active { color: var(--primary-text); }
        .dash-nav-link::after { content: ''; position: absolute; bottom: -2px; left: 50%; width: 0; height: 2px; background: var(--accent); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-50%); border-radius: 2px; }
        .dash-nav-link:hover::after, .dash-nav-link.active::after { width: 100%; }
        
        .global-header { background: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 100; box-shadow: 0 1px 3px rgba(61,44,30,0.02); }
        .header-center { display: flex; justify-content: center; align-items: center; gap: 40px; flex: 2; }
        .header-right { display: flex; align-items: center; justify-content: flex-end; gap: 20px; flex: 1; }
        .admin-label { font-size: 18px; font-weight: 800; color: var(--primary-text); letter-spacing: -0.5px; }



        .dashboard {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        /* 헤더 섹션 */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .page-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .page-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-text);
            margin: 0;
        }
        .back-btn {
            text-decoration: none;
            color: var(--sub-text);
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }
        .back-btn:hover { color: var(--accent); }

        /* 요약 카드 섹션 */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .summary-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(61, 44, 30, 0.05);
            border: 1px solid var(--border);
        }
        .summary-card .label {
            font-size: 14px;
            color: var(--sub-text);
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }
        .summary-card .value {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary-text);
        }
        .summary-card .trend {
            font-size: 12px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .trend.up { color: #10b981; }

        /* 메인 콘텐츠 섹션 */
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            margin-bottom: 30px;
        }
        .content-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 15px -3px rgba(61, 44, 30, 0.03);
        }
        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 테이블 스타일 */
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }
        th {
            text-align: left;
            padding: 12px 16px;
            color: var(--sub-text);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        td {
            padding: 16px;
            background: var(--bg);
            font-size: 14px;
        }
        td:first-child { border-radius: 12px 0 0 12px; }
        td:last-child { border-radius: 0 12px 12px 0; }
        .badge {
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 700;
            background: var(--header-bg);
            color: var(--accent);
        }
        .count-badge {
            background: #fff7ed;
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 800;
        }

        @media (max-width: 1024px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 600px) {
            body { padding: 0; }
            .dashboard { padding: 15px; }
            .page-header { flex-direction: column; gap: 15px; align-items: flex-start; }
            .summary-card, .content-card { padding: 20px; }
            .card-title { font-size: 16px; }
            .summary-card .value { font-size: 26px; }
        }
    </style>
</head>
<body>

<div class="global-header">
    <div class="header-left" style="flex: 1;">
        <a href="/admin" style="display:flex; align-items:center; gap:8px; text-decoration:none;">
            <img src="/images/vending-logo.png" alt="PIMTO" style="height:38px;">
            <span class="admin-label">관리자</span>
        </a>
    </div>
    <div class="header-center">
        <a href="/admin" class="dash-nav-link">재고관리</a>
        <a href="/admin/statistics" class="dash-nav-link active">매출통계</a>
        <a href="/admin/member" class="dash-nav-link">회원관리</a>
        <a href="/admin/robot-control" class="dash-nav-link">로봇관리</a>
    </div>
    <div class="header-right" style="flex: 1; justify-content: flex-end;">
        <span style="font-size: 13px; font-weight: 600; color: var(--sub-text);">관리자 모드 활성됨</span>
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <button class="btn-secondary" style="padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; border: none; cursor: pointer; background: var(--border); color: var(--sub-text);">로그아웃</button>
        </form>
    </div>
</div>

<div class="dashboard">
    <div class="page-header">
        <div class="page-header-left">
            <h1>📊 Analytics</h1>
        </div>
        <a href="/admin" class="back-btn">← 관리자 메인으로</a>
    </div>

    <!-- 요약 카드 -->
    <div class="summary-grid">
        <div class="summary-card">
            <span class="label">총 주문 건수</span>
            <div class="value" id="stat-total-orders">0</div>
            <div class="trend up">▲ 실시간 집계 중</div>
        </div>
        <div class="summary-card">
            <span class="label">총 매출액</span>
            <div class="value" id="stat-total-revenue">0원</div>
            <div class="trend up">▲ 결제 완료 기준</div>
        </div>
        <div class="summary-card">
            <span class="label">인기 상품</span>
            <div class="value" id="stat-popular-item">-</div>
            <div class="trend">가장 많이 판매된 음료</div>
        </div>
    </div>

    <div class="content-grid">
        <!-- 매출 차트 -->
        <div class="content-card">
            <div class="card-title">📈 시간대별 판매 추이</div>
            <canvas id="salesChart" height="150"></canvas>
        </div>

        <!-- 상품별 비중 (Doughnut Chart) -->
        <div class="content-card">
            <div class="card-title">🥧 상품별 판매 비중</div>
            <canvas id="productChart"></canvas>
        </div>
    </div>

    <!-- 상세 내역 테이블 -->
    <div class="content-card">
        <div class="card-title">📋 실시간 구매 내역 (그룹화)</div>
        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>구매 시간</th>
                    <th>구매자 실명</th>
                    <th>연락처</th>
                    <th>상품명</th>
                    <th>수량</th>
                </tr>
                </thead>
                <tbody id="salesTableBody">
                    <!-- JS 렌더링 -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const rawHistories = [[${histories}]];
    const hourlySales = [[${hourlySales}]];

    // 상품별 가격 정보 (구매자 기준 상품명으로 통일)
    const productPrices = {
        '펩시 콜라': 1500,
        '레쓰비 마일드 커피': 1200
    };

    function processAndRender() {
        const grouped = {};
        let totalRevenue = 0;
        const productCounts = {};

        rawHistories.forEach(item => {
            if (!item.purchaseTime) return;

            let productName = item.productName;

            // 1. 그룹화 키 생성 (초 단위까지 정밀도 향상)
            // T를 공백으로 바꾸고 나노초를 제외한 초 단위(19자)까지만 자릅니다.
            const timeKey = item.purchaseTime.replace('T', ' ').substring(0, 19);
            const key = `${item.buyerName}_${productName}_${timeKey}`;

            if (!grouped[key]) {
                grouped[key] = {
                    ...item,
                    productName: productName,
                    displayTime: timeKey, // 초 단위까지 포함된 시간
                    count: 1
                };
            } else {
                grouped[key].count++;
            }

            // 2. 총 매출 및 상품별 집계
            const price = item.paidPrice !== null ? item.paidPrice : (productPrices[productName] || 0);
            totalRevenue += price;
            productCounts[productName] = (productCounts[productName] || 0) + 1;
        });

        const sortedData = Object.values(grouped).sort((a, b) => b.purchaseTime.localeCompare(a.purchaseTime));

        // UI 렌더링 - 요약
        document.getElementById('stat-total-orders').innerText = rawHistories.length + '건';
        document.getElementById('stat-total-revenue').innerText = totalRevenue.toLocaleString() + '원';

        const popular = Object.entries(productCounts).sort((a,b) => b[1] - a[1])[0];
        document.getElementById('stat-popular-item').innerText = popular ? popular[0] : '-';

        // UI 렌더링 - 테이블
        const tableBody = document.getElementById('salesTableBody');
        if (sortedData.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px; color: #9e8c7a;">데이터가 없습니다.</td></tr>';
        } else {
            tableBody.innerHTML = sortedData.map(h => `
                <tr>
                    <td><span class="badge">${h.displayTime}</span></td>
                    <td style="font-weight: 700;">${h.buyerName}</td>
                    <td style="color: var(--sub-text);">${h.phoneNumber || '-'}</td>
                    <td>${h.productName}</td>
                    <td><span class="count-badge">${h.count}개</span></td>
                </tr>
            `).join('');
        }

        return { productCounts };
    }

    const { productCounts } = processAndRender();

    // 💡 차트 플러그인 전역 등록 (안정성 확보)
    Chart.register(ChartDataLabels);

    // 차트 1: 선형 차트 (시간대별)
    const ctxLine = document.getElementById('salesChart').getContext('2d');
    new Chart(ctxLine, {
        type: 'line',
        data: {
            labels: Array.from({length: 24}, (_, i) => i + '시'),
            datasets: [{
                label: '구매 건수',
                data: hourlySales,
                borderColor: '#c47d4a',
                backgroundColor: 'rgba(196, 125, 74, 0.1)',
                borderWidth: 3,
                fill: true,
                tension: 0.4,
                pointRadius: 4,
                pointBackgroundColor: '#fff',
                pointBorderColor: '#c47d4a'
            }]
        },
        options: {
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, ticks: { stepSize: 1, color: '#9e8c7a' }, grid: { borderDash: [5, 5] } },
                x: { grid: { display: false }, ticks: { color: '#9e8c7a' } }
            }
        }
    });

    // 차트 2: 도넛 차트 (상품 비중)
    const ctxPie = document.getElementById('productChart').getContext('2d');

    // 💡 판매량이 많은 순으로 내림차순 정렬
    const sortedProducts = Object.entries(productCounts).sort((a, b) => b[1] - a[1]);
    const sortedLabels = sortedProducts.map(item => item[0]);
    const sortedDataValues = sortedProducts.map(item => item[1]);

    const totalCount = sortedDataValues.reduce((a, b) => a + b, 0);

    new Chart(ctxPie, {
        type: 'doughnut',
        data: {
            // 범례에 이름과 %를 함께 표시
            labels: sortedLabels.map((name, index) => {
                const count = sortedDataValues[index];
                const pct = totalCount > 0 ? ((count / totalCount) * 100).toFixed(1) : 0;
                return `${name} (${pct}%)`;
            }),
            datasets: [{
                data: sortedDataValues,
                backgroundColor: ['#c47d4a', '#e67e22', '#f1c40f', '#bdc3c7'],
                borderWidth: 4, // 💡 흰색 선을 더 두껍게
                borderColor: '#ffffff',
                hoverOffset: 8
            }]
        },
        options: {
            cutout: '60%', // 중앙 여백 (도넛 두께 증가)
            rotation: -90, // 💡 0은 위쪽(12시), -90은 왼쪽(9시)부터 시작
            layout: { padding: 15 },
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: {
                        usePointStyle: true,
                        padding: 25,
                        font: { family: "'Pretendard', sans-serif", size: 14, weight: '600' },
                        color: '#3d2c1e'
                    }
                },
                datalabels: {
                    color: '#ffffff',
                    font: { family: "'Pretendard', sans-serif", weight: '800', size: 18 }, // 💡 폰트 더 크고 뚜렷하게
                    formatter: (value) => {
                        if(totalCount === 0 || value === 0) return "";
                        return Math.round((value / totalCount) * 100) + "%";
                    }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const label = context.label.split(' (')[0];
                            const value = context.raw;
                            return ` ${label}: ${value}개`;
                        }
                    }
                }
            }
        }
    });
</script>

</body>
</html>

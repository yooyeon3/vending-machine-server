<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PIMTO Analytics - 실시간 데이터 통계</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #fdfcfb;
            --surface: #ffffff;
            --primary-text: #2a2118;
            --sub-text: #7c7267;
            --accent: #bc6c25;
            --border: #e9e3d8;
            --card-shadow: 0 10px 40px rgba(42, 33, 24, 0.04);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg); color: var(--primary-text); padding: 60px 40px; line-height: 1.6; }

        .dashboard { max-width: 1400px; margin: 0 auto; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 48px; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .header-left img { height: 60px; filter: contrast(1.1); }
        .header h1 { font-size: 32px; font-weight: 900; letter-spacing: -1.5px; color: var(--primary-text); }
        
        .back-btn { text-decoration: none; color: var(--sub-text); font-weight: 800; font-size: 15px; background: #fff; padding: 12px 24px; border-radius: 14px; border: 1.5px solid var(--border); transition: all 0.2s; }
        .back-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateX(-5px); }

        /* 통계 카드 그리드 */
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-bottom: 40px; }
        .summary-card { background: white; padding: 32px; border-radius: 32px; border: 1px solid var(--border); box-shadow: var(--card-shadow); }
        .summary-card .label { font-size: 13px; color: var(--sub-text); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: block; }
        .summary-card .value { font-size: 40px; font-weight: 900; color: var(--primary-text); letter-spacing: -1px; }
        .summary-card .sub-value { font-size: 14px; margin-top: 8px; font-weight: 700; color: var(--accent); }

        /* 메인 차트 섹션 */
        .content-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; margin-bottom: 40px; }
        .content-card { background: white; padding: 40px; border-radius: 36px; border: 1px solid var(--border); box-shadow: var(--card-shadow); }
        .card-title { font-size: 20px; font-weight: 800; margin-bottom: 32px; color: var(--primary-text); display: flex; align-items: center; gap: 12px; }

        /* 테이블 고도화 */
        .table-container { width: 100%; border-collapse: separate; border-spacing: 0 12px; }
        th { text-align: left; padding: 0 20px 10px; color: var(--sub-text); font-size: 12px; font-weight: 800; text-transform: uppercase; }
        td { padding: 20px; background: #faf9f6; font-size: 15px; font-weight: 600; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        td:first-child { border-left: 1px solid var(--border); border-radius: 16px 0 0 16px; }
        td:last-child { border-right: 1px solid var(--border); border-radius: 0 16px 16px 0; }
        
        .badge-time { background: #fff; padding: 6px 12px; border-radius: 8px; border: 1.5px solid var(--border); font-family: monospace; font-size: 13px; color: var(--primary-text); }
        .price-text { color: var(--accent-dark); font-weight: 900; }

        @media (max-width: 1100px) { .content-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <div class="header-left">
            <a href="/admin"><img src="/images/vending-logo.png" alt="PIMTO"></a>
            <h1>SYSTEM ANALYTICS</h1>
        </div>
        <a href="/admin" class="back-btn">← DASHBOARD</a>
    </div>

    <!-- 핵심 요약 데이터 -->
    <div class="summary-grid">
        <div class="summary-card">
            <span class="label">Total Transactions</span>
            <div class="value" id="stat-total-orders">0</div>
            <div class="sub-value">● Real-time sync active</div>
        </div>
        <div class="summary-card">
            <span class="label">Total Revenue</span>
            <div class="value" id="stat-total-revenue">0 ₩</div>
            <div class="sub-value" style="color: var(--accent-dark);">● Accumulated payment total</div>
        </div>
        <div class="summary-card">
            <span class="label">Top Item</span>
            <div class="value" style="font-size: 32px;" id="stat-popular-item">-</div>
            <div class="sub-value">● Most requested item data</div>
        </div>
    </div>

    <div class="content-grid">
        <div class="content-card">
            <div class="card-title">📈 시간대별 오퍼레이션 추이</div>
            <canvas id="salesChart" height="140"></canvas>
        </div>
        <div class="content-card">
            <div class="card-title">🥧 아이템별 데이터 점유율</div>
            <canvas id="productChart"></canvas>
        </div>
    </div>

    <div class="content-card">
        <div class="card-title">📋 실시간 시스템 트랜잭션 로그</div>
        <table class="table-container">
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Operator</th>
                    <th>Item ID</th>
                    <th>Expenditure</th>
                </tr>
            </thead>
            <tbody id="salesTableBody">
                <!-- JS Data Rendering -->
            </tbody>
        </table>
    </div>
</div>

<script th:inline="javascript">
    const rawHistories = [[${histories}]], hourlySales = [[${hourlySales}]];

    function processAnalytics() {
        let revenue = 0; const counts = {};
        const tbody = document.getElementById('salesTableBody');
        
        tbody.innerHTML = rawHistories.sort((a,b) => b.purchaseTime.localeCompare(a.purchaseTime)).map(h => {
            revenue += (h.paidPrice || 0);
            counts[h.productName] = (counts[h.productName] || 0) + 1;
            return `<tr>
                <td><span class="badge-time">${h.purchaseTime.replace('T',' ').substring(0,19)}</span></td>
                <td style="font-weight:800;">${h.buyerName}</td>
                <td>${h.productName}</td>
                <td class="price-text">${(h.paidPrice || 0).toLocaleString()} ₩</td>
            </tr>`;
        }).join('');

        document.getElementById('stat-total-orders').innerText = rawHistories.length;
        document.getElementById('stat-total-revenue').innerText = revenue.toLocaleString() + ' ₩';
        
        const popular = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
        document.getElementById('stat-popular-item').innerText = popular ? popular[0] : 'N/A';

        renderCharts(counts);
    }

    function renderCharts(productCounts) {
        // Line Chart
        new Chart(document.getElementById('salesChart'), {
            type: 'line',
            data: {
                labels: Array.from({length: 24}, (_, i) => i + 'H'),
                datasets: [{
                    data: hourlySales, borderColor: '#bc6c25', backgroundColor: 'rgba(188, 108, 37, 0.08)',
                    borderWidth: 4, fill: true, tension: 0.4, pointRadius: 0
                }]
            },
            options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } }
        });

        // Doughnut Chart
        const labels = Object.keys(productCounts);
        new Chart(document.getElementById('productChart'), {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: Object.values(productCounts),
                    backgroundColor: ['#2a2118', '#bc6c25', '#d4a373', '#e9e3d8'],
                    borderWidth: 0, hoverOffset: 15
                }]
            },
            options: { cutout: '75%', plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, font: { weight: '700' } } } } }
        });
    }

    window.onload = processAnalytics;
</script>
</body>
</html>

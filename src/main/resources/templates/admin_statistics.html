<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>매출 통계 관리자 페이지</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #FF5E5E; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 자판기 매출 통계 및 내역</h2>

    <table>
        <thead>
        <tr>
            <th>구매 시간</th>
            <th>구매자 이름</th>
            <th>전화번호</th>
            <th>구매 상품</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="history : ${histories}">
            <td th:text="${#temporals.format(history.purchaseTime, 'yyyy-MM-dd HH:mm')}">시간</td>
            <td th:text="${history.buyerName}">이름</td>
            <td th:text="${history.phoneNumber}">전화번호</td>
            <td th:text="${history.productName}">상품명</td>
        </tr>
        </tbody>
    </table>

    <canvas id="salesChart" width="400" height="150"></canvas>
</div>

<script th:inline="javascript">
    // 타임리프를 통해 서버에서 받아온 구매 내역 데이터를 자바스크립트 배열로 변환
    const histories = [[${histories}]];

    // 0시부터 23시까지 시간대별로 구매 횟수를 저장할 배열 (초기값 0)
    let hourlySales = new Array(24).fill(0);

    // 구매 내역을 하나씩 돌면서 어느 시간대(hour)에 샀는지 카운트 증가
    histories.forEach(h => {
        if(h.purchaseTime) {
            // "2026-06-15T14:11:00" 형식에서 시간("14")만 추출
            const hour = new Date(h.purchaseTime).getHours();
            hourlySales[hour]++;
        }
    });

    // Chart.js를 이용해 선 그래프(Line Chart) 그리기
    const ctx = document.getElementById('salesChart').getContext('2d');
    new Chart(ctx, {
        type: 'line', // 점선/선 그래프 타입
        data: {
            labels: Array.from({length: 24}, (_, i) => i + '시'), // x축: 0시 ~ 23시
            datasets: [{
                label: '시간대별 구매 건수',
                data: hourlySales, // y축: 방금 계산한 시간대별 카운트
                borderColor: '#FF5E5E', // 선 색상 (PIMTO 스타일 레드)
                backgroundColor: 'rgba(255, 94, 94, 0.2)', // 선 아래쪽 배경색
                borderWidth: 2,
                pointBackgroundColor: '#FF5E5E', // 꺾이는 점의 색상
                tension: 0.3 // 선을 살짝 부드러운 곡선으로
            }]
        },
        options: {
            scales: {
                y: { beginAtZero: true, ticks: { stepSize: 1 } }
            }
        }
    });
</script>

</body>
</html>

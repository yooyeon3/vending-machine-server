<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PIMTO - 매출 통계 대시보드</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 💡 퍼센트 표시를 위한 플러그인 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        :root {
            --primary: #6e8efb;
            --secondary: #a777e3;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 40px;
            line-height: 1.6;
        }

        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 헤더 섹션 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }
        .back-btn {
            text-decoration: none;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }
        .back-btn:hover { color: var(--primary); }

        /* 요약 카드 섹션 */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .summary-card {
            background: var(--card);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }
        .summary-card .label {
            font-size: 14px;
            color: var(--text-sub);
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }
        .summary-card .value {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-main);
        }
        .summary-card .trend {
            font-size: 12px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .trend.up { color: #10b981; }

        /* 메인 콘텐츠 섹션 */
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            margin-bottom: 30px;
        }
        .content-card {
            background: var(--card);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }
        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 테이블 스타일 */
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }
        th {
            text-align: left;
            padding: 12px 16px;
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        td {
            padding: 16px;
            background: #f8fafc;
            font-size: 14px;
        }
        td:first-child { border-radius: 12px 0 0 12px; }
        td:last-child { border-radius: 0 12px 12px 0; }
        .badge {
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 700;
            background: #e0e7ff;
            color: var(--primary);
        }
        .count-badge {
            background: #fef3c7;
            color: #d97706;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 800;
        }

        @media (max-width: 1024px) {
            .content-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <div class="header-left">
            <!-- 💡 로고 크기를 키우고 클릭 시 관리자 메인으로 이동하도록 링크 적용 -->
            <a href="/admin" style="display: flex; align-items: center; text-decoration: none;">
                <img src="/images/vending-logo.png" alt="PIMTO 로고" style="height: 55px; object-fit: contain; transition: transform 0.2s; cursor: pointer;" onmouseover="this.style.transform='scale(1.08)'" onmouseout="this.style.transform='scale(1)'">
            </a>
            <h1>Analytics</h1>
        </div>
        <a href="/admin" class="back-btn">← 관리자 메인으로</a>
    </div>

    <!-- 요약 카드 -->
    <div class="summary-grid">
        <div class="summary-card">
            <span class="label">총 주문 건수</span>
            <div class="value" id="stat-total-orders">0</div>
            <div class="trend up">▲ 실시간 집계 중</div>
        </div>
        <div class="summary-card">
            <span class="label">총 매출액</span>
            <div class="value" id="stat-total-revenue">0원</div>
            <div class="trend up">▲ 결제 완료 기준</div>
        </div>
        <div class="summary-card">
            <span class="label">인기 상품</span>
            <div class="value" id="stat-popular-item">-</div>
            <div class="trend">가장 많이 판매된 음료</div>
        </div>
    </div>

    <div class="content-grid">
        <!-- 매출 차트 -->
        <div class="content-card">
            <div class="card-title">📈 시간대별 판매 추이</div>
            <canvas id="salesChart" height="150"></canvas>
        </div>

        <!-- 상품별 비중 (Doughnut Chart) -->
        <div class="content-card">
            <div class="card-title">🥧 상품별 판매 비중</div>
            <canvas id="productChart"></canvas>
        </div>
    </div>

    <!-- 상세 내역 테이블 -->
    <div class="content-card">
        <div class="card-title">📋 실시간 구매 내역 (그룹화)</div>
        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>구매 시간</th>
                    <th>구매자 실명</th>
                    <th>연락처</th>
                    <th>상품명</th>
                    <th>수량</th>
                </tr>
                </thead>
                <tbody id="salesTableBody">
                    <!-- JS 렌더링 -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const rawHistories = [[${histories}]];
    const hourlySales = [[${hourlySales}]];

    // 상품별 가격 정보 (구매자 기준 상품명으로 통일)
    const productPrices = {
        '펩시 콜라': 1500,
        '레쓰비 마일드 커피': 1200
    };

    function processAndRender() {
        const grouped = {};
        let totalRevenue = 0;
        const productCounts = {};

        rawHistories.forEach(item => {
            if (!item.purchaseTime) return;

            // 💡 [추가] 데이터 보정: 옛날 이름(콜라, 사이다 등)이 들어와도 새 이름으로 매핑
            let productName = item.productName;
            if (productName === '콜라') productName = '펩시 콜라';
            if (productName === '사이다') productName = '레쓰비 마일드 커피';

            // 1. 그룹화 키 생성 (초 단위까지 정밀도 향상)
            // T를 공백으로 바꾸고 나노초를 제외한 초 단위(19자)까지만 자릅니다.
            const timeKey = item.purchaseTime.replace('T', ' ').substring(0, 19);
            const key = `${item.buyerName}_${productName}_${timeKey}`;

            if (!grouped[key]) {
                grouped[key] = {
                    ...item,
                    productName: productName,
                    displayTime: timeKey, // 초 단위까지 포함된 시간
                    count: 1
                };
            } else {
                grouped[key].count++;
            }

            // 2. 총 매출 및 상품별 집계
            const price = item.paidPrice !== null ? item.paidPrice : (productPrices[productName] || 0);
            totalRevenue += price;
            productCounts[productName] = (productCounts[productName] || 0) + 1;
        });

        const sortedData = Object.values(grouped).sort((a, b) => b.purchaseTime.localeCompare(a.purchaseTime));

        // UI 렌더링 - 요약
        document.getElementById('stat-total-orders').innerText = rawHistories.length + '건';
        document.getElementById('stat-total-revenue').innerText = totalRevenue.toLocaleString() + '원';
        
        const popular = Object.entries(productCounts).sort((a,b) => b[1] - a[1])[0];
        document.getElementById('stat-popular-item').innerText = popular ? popular[0] : '-';

        // UI 렌더링 - 테이블
        const tableBody = document.getElementById('salesTableBody');
        if (sortedData.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px; color: #94a3b8;">데이터가 없습니다.</td></tr>';
        } else {
            tableBody.innerHTML = sortedData.map(h => `
                <tr>
                    <td><span class="badge">${h.displayTime}</span></td>
                    <td style="font-weight: 700;">${h.buyerName}</td>
                    <td style="color: var(--text-sub);">${h.phoneNumber || '-'}</td>
                    <td>${h.productName}</td>
                    <td><span class="count-badge">${h.count}개</span></td>
                </tr>
            `).join('');
        }

        return { productCounts };
    }

    const { productCounts } = processAndRender();

    // 💡 차트 플러그인 전역 등록 (안정성 확보)
    Chart.register(ChartDataLabels);

    // 차트 1: 선형 차트 (시간대별)
    const ctxLine = document.getElementById('salesChart').getContext('2d');
    new Chart(ctxLine, {
        type: 'line',
        data: {
            labels: Array.from({length: 24}, (_, i) => i + '시'),
            datasets: [{
                label: '구매 건수',
                data: hourlySales,
                borderColor: '#6e8efb',
                backgroundColor: 'rgba(110, 142, 251, 0.1)',
                borderWidth: 3,
                fill: true,
                tension: 0.4,
                pointRadius: 4,
                pointBackgroundColor: '#fff',
                pointBorderColor: '#6e8efb'
            }]
        },
        options: {
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, ticks: { stepSize: 1, color: '#94a3b8' }, grid: { borderDash: [5, 5] } },
                x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
            }
        }
    });

    // 차트 2: 도넛 차트 (상품 비중)
    const ctxPie = document.getElementById('productChart').getContext('2d');
    
    // 💡 판매량이 많은 순으로 내림차순 정렬
    const sortedProducts = Object.entries(productCounts).sort((a, b) => b[1] - a[1]);
    const sortedLabels = sortedProducts.map(item => item[0]);
    const sortedDataValues = sortedProducts.map(item => item[1]);

    const totalCount = sortedDataValues.reduce((a, b) => a + b, 0);

    new Chart(ctxPie, {
        type: 'doughnut',
        data: {
            // 범례에 이름과 %를 함께 표시
            labels: sortedLabels.map((name, index) => {
                const count = sortedDataValues[index];
                const pct = totalCount > 0 ? ((count / totalCount) * 100).toFixed(1) : 0;
                return `${name} (${pct}%)`;
            }),
            datasets: [{
                data: sortedDataValues,
                backgroundColor: ['#6e8efb', '#a777e3', '#f472b6'],
                borderWidth: 4, // 💡 흰색 선을 더 두껍게
                borderColor: '#ffffff',
                hoverOffset: 8
            }]
        },
        options: {
            cutout: '60%', // 중앙 여백 (도넛 두께 증가)
            rotation: -90, // 💡 0은 위쪽(12시), -90은 왼쪽(9시)부터 시작
            layout: { padding: 15 },
            plugins: {
                legend: { 
                    position: 'bottom', 
                    labels: { 
                        usePointStyle: true, 
                        padding: 25,
                        font: { family: "'Pretendard', sans-serif", size: 14, weight: '600' },
                        color: '#1e293b'
                    } 
                },
                datalabels: {
                    color: '#ffffff',
                    font: { family: "'Pretendard', sans-serif", weight: '800', size: 18 }, // 💡 폰트 더 크고 뚜렷하게
                    formatter: (value) => {
                        if(totalCount === 0 || value === 0) return "";
                        return Math.round((value / totalCount) * 100) + "%";
                    }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const label = context.label.split(' (')[0];
                            const value = context.raw;
                            return ` ${label}: ${value}개`;
                        }
                    }
                }
            }
        }
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<div th:fragment="deliveryWidget" th:if="${session.loginMember != null}">

<style>
  @keyframes dwPulse {
    0%   { transform: translate(-50%,-50%) scale(1);   opacity: 0.35; }
    60%  { transform: translate(-50%,-50%) scale(2.2); opacity: 0; }
    100% { transform: translate(-50%,-50%) scale(1);   opacity: 0; }
  }
  #dw-widget {
    position: fixed; bottom: 20px; right: 20px; width: 276px;
    background: white; border-radius: 18px;
    box-shadow: 0 8px 32px rgba(61,44,30,0.18); z-index: 9000;
    font-family: 'Pretendard', sans-serif; overflow: hidden;
    border: 2px solid #c47d4a; display: none;
  }
  #dw-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 14px 9px;
    background: linear-gradient(135deg, #c47d4a, #3d2c1e); color: white;
    cursor: pointer;
  }
  #dw-header-left { display: flex; flex-direction: column; gap: 2px; }
  #dw-title { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
  #dw-product-label { font-size: 11px; opacity: 0.9; font-weight: 500; }
  #dw-toggle-btn {
    background: none; border: none; color: rgba(255,255,255,0.8);
    cursor: pointer; font-size: 18px; padding: 0 2px; line-height: 1;
    flex-shrink: 0;
  }
  #dw-toggle-btn:hover { color: white; }
  #dw-body {}
  #dw-map {
    position: relative; margin: 10px 12px 8px; height: 148px;
    background: #f8fafc; border-radius: 12px; overflow: hidden;
    border: 1px solid #cbd5e1;
  }
  #dw-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, #e2e8f0 1px, transparent 1px),
      linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
    background-size: 24px 24px;
  }
  #dw-map-label {
    position: absolute; top: 5px; left: 8px;
    font-size: 9px; font-weight: 700; color: #94a3b8; letter-spacing: 0.5px; z-index: 2;
  }
  #dw-path-svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
  }
  #dw-dest {
    position: absolute; font-size: 18px;
    transform: translate(-50%, -100%); z-index: 3; line-height: 1;
  }
  #dw-robot-wrap {
    position: absolute; transform: translate(-50%, -50%);
    z-index: 4; line-height: 1;
  }
  #dw-robot-pulse {
    position: absolute; width: 30px; height: 30px; border-radius: 50%;
    background: #c47d4a; transform: translate(-50%, -50%);
    top: 50%; left: 50%;
    animation: dwPulse 1.8s ease-out infinite;
  }
  #dw-robot-icon { position: relative; width: 26px; height: 26px; object-fit: contain; }
  #dw-arrived {
    display: none; text-align: center; padding: 22px 0 8px;
    font-size: 15px; font-weight: 700; color: #22c55e;
  }
  #dw-footer { padding: 0 12px 10px; }
  #dw-progress-bg {
    height: 6px; background: #f1f5f9; border-radius: 6px;
    overflow: hidden; margin-bottom: 7px;
  }
  #dw-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #c47d4a, #3d2c1e);
    border-radius: 6px; transition: width 2.8s linear; width: 0;
  }
  #dw-eta-row {
    display: flex; justify-content: space-between;
    font-size: 12px; color: #475569; font-weight: 600;
  }
  #dw-queue-info {
    display: none; margin-top: 7px; padding: 6px 10px;
    background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;
    font-size: 11px; color: #64748b; font-weight: 500;
    text-align: center;
  }
</style>

<div id="dw-widget">
  <div id="dw-header" onclick="dwToggle()">
    <div id="dw-header-left">
      <div id="dw-title">🤖 PIMTO 배달 현황</div>
      <div id="dw-product-label">로딩 중...</div>
    </div>
    <button id="dw-toggle-btn" onclick="event.stopPropagation(); dwToggle()">－</button>
  </div>
  <div id="dw-body">
    <div id="dw-map">
      <div id="dw-grid"></div>
      <div id="dw-map-label">실내 지도 (시뮬레이션)</div>
      <svg id="dw-path-svg">
        <line id="dw-path-line"
              stroke="#c47d4a" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.4"/>
      </svg>
      <div id="dw-dest">
        <svg width="18" height="22" viewBox="0 0 18 22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="2" y1="0" x2="2" y2="22" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
          <path d="M2 1 L16 6 L2 11 Z" fill="#ef4444"/>
        </svg>
      </div>
      <div id="dw-robot-wrap">
        <div id="dw-robot-pulse"></div>
        <img id="dw-robot-icon" th:src="@{/images/pimto.png}" src="/images/pimto.png" alt="PIMTO">
      </div>
    </div>
    <div id="dw-arrived"><img src="/images/pimto.png" style="width:32px;height:32px;object-fit:contain;vertical-align:middle;margin-right:6px;">도착했습니다!</div>
    <div id="dw-footer">
      <div id="dw-progress-bg">
        <div id="dw-progress-fill"></div>
      </div>
      <div id="dw-eta-row">
        <span id="dw-eta-text">대기 중...</span>
        <span id="dw-pct-text">0%</span>
      </div>
      <div id="dw-queue-info"></div>
    </div>
  </div>
</div>

<script>
(function () {
  var minimized = false;
  var firstUpdate = true;

  function dwToggle() {
    minimized = !minimized;
    document.getElementById('dw-body').style.display = minimized ? 'none' : '';
    document.getElementById('dw-toggle-btn').textContent = minimized ? '＋' : '－';
  }
  window.dwToggle = dwToggle;

  function setPos(rxPct, ryPct, dxPct, dyPct) {
    var map = document.getElementById('dw-map');
    var w = map.offsetWidth || 252;
    var h = map.offsetHeight || 148;
    var rx = w * rxPct / 100;
    var ry = h * ryPct / 100;
    var dx = w * dxPct / 100;
    var dy = h * dyPct / 100;

    var robot = document.getElementById('dw-robot-wrap');
    if (firstUpdate) {
      robot.style.transition = 'none';
      robot.style.left = rx + 'px';
      robot.style.top  = ry + 'px';
      setTimeout(function () {
        robot.style.transition = 'left 2.8s linear, top 2.8s linear';
      }, 50);
      firstUpdate = false;
    } else {
      robot.style.left = rx + 'px';
      robot.style.top  = ry + 'px';
    }

    var dest = document.getElementById('dw-dest');
    dest.style.left = dx + 'px';
    dest.style.top  = dy + 'px';

    var line = document.getElementById('dw-path-line');
    line.setAttribute('x1', rx); line.setAttribute('y1', ry);
    line.setAttribute('x2', dx); line.setAttribute('y2', dy);
  }

  function poll() {
    fetch('/api/delivery/status')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var widget = document.getElementById('dw-widget');
        if (!data.active) { widget.style.display = 'none'; return; }

        widget.style.display = 'block';

        // 헤더 레이블: 축소 시에도 품목+갯수+ETA 보임
        var label = data.productName;
        if (!data.arrived) label += ' · ' + data.eta;
        document.getElementById('dw-product-label').textContent = label;

        document.getElementById('dw-progress-fill').style.width = data.progress + '%';
        document.getElementById('dw-pct-text').textContent = data.progress + '%';

        if (data.arrived) {
          document.getElementById('dw-eta-text').textContent = '도착 완료!';
          document.getElementById('dw-map').style.display     = 'none';
          document.getElementById('dw-arrived').style.display = 'block';
          document.getElementById('dw-progress-fill').style.width = '100%';
        } else {
          document.getElementById('dw-eta-text').textContent  = '예상 도착: ' + data.eta;
          document.getElementById('dw-map').style.display     = '';
          document.getElementById('dw-arrived').style.display = 'none';
          setPos(data.robotX, data.robotY, data.destX, data.destY);
        }

        // 대기 큐 표시
        var queueEl = document.getElementById('dw-queue-info');
        if (data.queueCount > 0) {
          queueEl.textContent = '⏳ 다음 대기: ' + data.nextProductName
            + (data.queueCount > 1 ? ' 외 ' + (data.queueCount - 1) + '건' : '');
          queueEl.style.display = 'block';
        } else {
          queueEl.style.display = 'none';
        }
      })
      .catch(function () {});
  }

  setTimeout(function () {
    poll();
    setInterval(poll, 3000);
  }, 400);
})();
</script>

</div>
</body>
</html>

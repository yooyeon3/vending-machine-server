<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<div th:fragment="deliveryWidget" th:if="${session.loginMember != null}">

<style>
  #dw-ros-map canvas { width: 100% !important; height: 100% !important; object-fit: contain; }

  @keyframes dwPulse {
    0%   { transform: translate(-50%,-50%) scale(1);   opacity: 0.35; }
    60%  { transform: translate(-50%,-50%) scale(2.2); opacity: 0; }
    100% { transform: translate(-50%,-50%) scale(1);   opacity: 0; }
  }
  #dw-widget {
    position: fixed; bottom: 20px; right: 20px; width: 276px;
    background: white; border-radius: 18px;
    box-shadow: 0 8px 32px rgba(61,44,30,0.18); z-index: 9000;
    font-family: 'Pretendard', sans-serif; overflow: hidden;
    border: 2px solid #c47d4a; display: none;
  }
  #dw-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 14px 9px;
    background: linear-gradient(135deg, #c47d4a, #3d2c1e); color: white;
    cursor: pointer;
  }
  #dw-header-left { display: flex; flex-direction: column; gap: 2px; }
  #dw-title { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
  #dw-product-label { font-size: 11px; opacity: 0.9; font-weight: 500; }
  #dw-toggle-btn {
    background: none; border: none; color: rgba(255,255,255,0.8);
    cursor: pointer; font-size: 18px; padding: 0 2px; line-height: 1;
    flex-shrink: 0;
  }
  #dw-toggle-btn:hover { color: white; }
  #dw-body {}
  #dw-map {
    position: relative; margin: 10px 12px 8px; height: 148px;
    background: #f8fafc; border-radius: 12px; overflow: hidden;
    border: 1px solid #cbd5e1;
  }
  #dw-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, #e2e8f0 1px, transparent 1px),
      linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
    background-size: 24px 24px;
  }
  #dw-map-label {
    position: absolute; top: 5px; left: 8px;
    font-size: 9px; font-weight: 700; color: #94a3b8; letter-spacing: 0.5px; z-index: 2;
  }
  #dw-arrived {
    display: none; text-align: center; padding: 22px 0 8px;
    font-size: 15px; font-weight: 700; color: #22c55e;
  }
  #dw-footer { padding: 0 12px 10px; }
  #dw-progress-bg {
    height: 6px; background: #f1f5f9; border-radius: 6px;
    overflow: hidden; margin-bottom: 7px;
  }
  #dw-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #c47d4a, #3d2c1e);
    border-radius: 6px; transition: width 2.8s linear; width: 0;
  }
  #dw-eta-row {
    display: flex; justify-content: space-between;
    font-size: 12px; color: #475569; font-weight: 600;
  }
  #dw-queue-info {
    display: none; margin-top: 7px; padding: 6px 10px;
    background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;
    font-size: 11px; color: #64748b; font-weight: 500;
    text-align: center;
  }

  @media (max-width: 600px) {
    #dw-widget {
      bottom: 15px; right: 15px; left: 15px; width: auto; max-width: 400px; margin: 0 auto;
      z-index: 9998; /* 채팅 위젯보다 아래에 위치 */
    }
  }
</style>

<!-- 도착 시 전체화면 PIN 입력 모달 -->
<div id="dw-arrived-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:99999; align-items:center; justify-content:center; padding:20px;">
  <div style="background:white; border-radius:28px; padding:32px 20px; max-width:420px; width:100%; text-align:center; box-shadow:0 24px 64px rgba(0,0,0,0.25); animation:dwModalPop 0.4s cubic-bezier(0.165,0.84,0.44,1);">
    <img src="/images/pimto.png" alt="PIMTO" style="width:72px;height:72px;object-fit:contain;margin:0 auto 16px;display:block;" />
    <div style="font-size:24px;font-weight:900;color:#3d2c1e;margin-bottom:8px;">로봇이 도착했어요!</div>
    <div style="font-size:14px;color:#9e8c7a;margin-bottom:20px;">로봇 디스플레이의 PIN을 입력해주세요.</div>
    <div id="dw-modal-product" style="background:#f2ede4;border-radius:12px;padding:8px 16px;font-size:13px;font-weight:700;color:#c47d4a;margin-bottom:16px;display:inline-block;"></div>
    <div id="dw-countdown" style="font-size:13px;color:#ef4444;font-weight:600;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px 14px;margin-bottom:20px;">⏱ 30초 안에 수령하지 않으면 자동 취소됩니다</div>

    <!-- 8칸 개별 PIN 입력 -->
    <div style="display:flex;gap:6px;justify-content:center;margin-bottom:20px;">
      <input class="dw-pin-box" maxlength="1" autocomplete="off" style="width:38px;height:48px;border:2px solid #e8dfd4;border-radius:12px;font-size:18px;font-weight:800;text-align:center;font-family:'Monaco','Consolas',monospace;color:#3d2c1e;outline:none;text-transform:uppercase;transition:border-color 0.2s;" />
      <input class="dw-pin-box" maxlength="1" autocomplete="off" style="width:38px;height:48px;border:2px solid #e8dfd4;border-radius:12px;font-size:18px;font-weight:800;text-align:center;font-family:'Monaco','Consolas',monospace;color:#3d2c1e;outline:none;text-transform:uppercase;transition:border-color 0.2s;" />
      <input class="dw-pin-box" maxlength="1" autocomplete="off" style="width:38px;height:48px;border:2px solid #e8dfd4;border-radius:12px;font-size:18px;font-weight:800;text-align:center;font-family:'Monaco','Consolas',monospace;color:#3d2c1e;outline:none;text-transform:uppercase;transition:border-color 0.2s;" />
      <input class="dw-pin-box" maxlength="1" autocomplete="off" style="width:38px;height:48px;border:2px solid #e8dfd4;border-radius:12px;font-size:18px;font-weight:800;text-align:center;font-family:'Monaco','Consolas',monospace;color:#3d2c1e;outline:none;text-transform:uppercase;transition:border-color 0.2s;" />
      <div style="display:flex;align-items:center;font-size:18px;font-weight:800;color:#9e8c7a;">-</div>
      <input class="dw-pin-box" maxlength="1" autocomplete="off" style="width:38px;height:48px;border:2px solid #e8dfd4;border-radius:12px;font-size:18px;font-weight:800;text-align:center;font-family:'Monaco','Consolas',monospace;color:#3d2c1e;outline:none;text-transform:uppercase;transition:border-color 0.2s;" />
      <input class="dw-pin-box" maxlength="1" autocomplete="off" style="width:38px;height:48px;border:2px solid #e8dfd4;border-radius:12px;font-size:18px;font-weight:800;text-align:center;font-family:'Monaco','Consolas',monospace;color:#3d2c1e;outline:none;text-transform:uppercase;transition:border-color 0.2s;" />
      <input class="dw-pin-box" maxlength="1" autocomplete="off" style="width:38px;height:48px;border:2px solid #e8dfd4;border-radius:12px;font-size:18px;font-weight:800;text-align:center;font-family:'Monaco','Consolas',monospace;color:#3d2c1e;outline:none;text-transform:uppercase;transition:border-color 0.2s;" />
      <input class="dw-pin-box" maxlength="1" autocomplete="off" style="width:38px;height:48px;border:2px solid #e8dfd4;border-radius:12px;font-size:18px;font-weight:800;text-align:center;font-family:'Monaco','Consolas',monospace;color:#3d2c1e;outline:none;text-transform:uppercase;transition:border-color 0.2s;" />
    </div>

    <button id="dw-pin-btn" onclick="dwVerifyPin()"
      style="width:100%;padding:15px;background:#3d2c1e;color:white;border:none;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Pretendard',sans-serif;transition:background 0.2s;">
      확인
    </button>

    <div id="dw-pin-result" style="display:none;font-size:13px;font-weight:700;padding:10px 16px;border-radius:10px;margin-top:14px;"></div>
  </div>
</div>

<style>
@keyframes dwModalPop {
  from { opacity:0; transform:scale(0.85); }
  to   { opacity:1; transform:scale(1); }
}
.dw-pin-box:focus { border-color:#c47d4a; }
</style>

<div id="dw-widget">
  <div id="dw-header" onclick="dwToggle()">
    <div id="dw-header-left">
      <div id="dw-title">🤖 PIMTO 배달 현황</div>
      <div id="dw-product-label">로딩 중...</div>
    </div>
    <button id="dw-toggle-btn" onclick="event.stopPropagation(); dwToggle()">－</button>
  </div>
  <div id="dw-body">
    <div id="dw-map" style="display: flex; justify-content: center; align-items: center; background: #1e1814;">
      <div id="dw-ros-map" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;"></div>
      <div id="dw-map-label" style="color: white; z-index: 10;">연결 대기 중...</div>
    </div>
    <div id="dw-arrived"><img src="/images/pimto.png" style="width:32px;height:32px;object-fit:contain;vertical-align:middle;margin-right:6px;">도착했습니다!</div>
    <div id="dw-footer">
      <div id="dw-progress-bg">
        <div id="dw-progress-fill"></div>
      </div>
      <div id="dw-eta-row">
        <span id="dw-eta-text">대기 중...</span>
        <span id="dw-pct-text">0%</span>
      </div>
      <div id="dw-queue-info"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/easeljs@1.0.2/lib/easeljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/roslib@1.3.0/build/roslib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ros2d@0.10.0/build/ros2d.min.js"></script>

<script>
(function () {
  var minimized = false;
  var firstUpdate = true;
  var modalShown = false;
  var dwOrderId = null;
  window.dwRosConnected = false;
  
  // URL에서 전달된 정보 ( 더 이상 클라이언트에서 직접 큐를 관리하지 않음 )
  var urlParams = new URLSearchParams(window.location.search);
  var currentOrderId = urlParams.get('id');

  function dwToggle() {
    minimized = !minimized;
    document.getElementById('dw-body').style.display = minimized ? 'none' : '';
    document.getElementById('dw-toggle-btn').textContent = minimized ? '＋' : '－';
  }
  window.dwToggle = dwToggle;

  var dwRos = null;
  var dwViewer = null;
  var dwStage = null;
  var dwGridClient = null;
  var dwTfClient = null;
  var dwRobotMarker = null;
  var dwUserScale = 20.0;
  var dwUserX = 0;
  var dwUserY = 0;

  function dwApplyStageTransform() {
      if(!dwStage) return;
      dwStage.scaleX = dwUserScale;
      dwStage.scaleY = dwUserScale;
      dwStage.x = dwUserX;
      dwStage.y = dwUserY;
      dwStage.update();
  }

  function dwInitMap() {
      var mapDiv = document.getElementById('dw-ros-map');
      if(!mapDiv) return;
      mapDiv.innerHTML = '';
      
      var mapWrapper = document.getElementById('dw-map');
      var w = mapWrapper.clientWidth || 252;
      var h = mapWrapper.clientHeight || 148;

      dwViewer = new ROS2D.Viewer({ divID: 'dw-ros-map', width: w, height: h });
      dwStage = dwViewer.scene;
      
      dwUserX = dwViewer.width / 2;
      dwUserY = dwViewer.height / 2;
      
      dwApplyStageTransform();

      dwGridClient = new ROS2D.OccupancyGridClient({ ros: dwRos, rootObject: dwStage, continuous: true });

      dwGridClient.on('change', function() {
          if (dwGridClient.currentGrid && dwGridClient.currentGrid.width > 0) {
              dwViewer.scaleToDimensions(dwGridClient.currentGrid.width, dwGridClient.currentGrid.height);
              dwViewer.shift(dwGridClient.currentGrid.pose.position.x, dwGridClient.currentGrid.pose.position.y);
              // 로봇이 돌아다닐 수 있는 '실제 흰색 방(Free Space)'의 시각적 정중앙을 계산합니다.
              var mapListener = new ROSLIB.Topic({ ros: dwRos, name: '/map', messageType: 'nav_msgs/OccupancyGrid' });
              mapListener.subscribe(function(message) {
                  mapListener.unsubscribe(); 
                  var data = message.data;
                  var gw = message.info.width;
                  var gh = message.info.height;
                  var res = message.info.resolution;
                  var originX = message.info.origin.position.x;
                  var originY = message.info.origin.position.y;
                  
                  var minC = gw, maxC = 0, minR = gh, maxR = 0, found = false;
                  for (var r = 0; r < gh; r++) {
                      for (var c = 0; c < gw; c++) {
                          if (data[r * gw + c] === 0) {
                              if (c < minC) minC = c; if (c > maxC) maxC = c;
                              if (r < minR) minR = r; if (r > maxR) maxR = r;
                              found = true;
                          }
                      }
                  }
                  
                  var cx = originX + (gw / 2) * res;
                  var cy = originY + (gh / 2) * res;
                  if (found) {
                      cx = originX + ((minC + maxC) / 2) * res;
                      cy = originY + ((minR + maxR) / 2) * res;
                  }
                  
                  // 미니 위젯에 맞게 꽉 차도록 3.2배 확대
                  dwUserScale = Math.min(w / dwGridClient.currentGrid.width, h / dwGridClient.currentGrid.height) * 3.2;
                  dwUserX = (w / 2) - (cx * dwUserScale);
                  dwUserY = (h / 2) + (cy * dwUserScale);
                  dwApplyStageTransform();
              });
          }
      });

      dwRobotMarker = new createjs.Container();
      
      // 흰색 테두리 원형 배경 (앱 아바타 느낌)
      var robotBg = new createjs.Shape();
      robotBg.graphics.beginFill('#ffffff').drawCircle(0, 0, 0.45);
      var robotBorder = new createjs.Shape();
      robotBorder.graphics.setStrokeStyle(0.06).beginStroke('#c47d4a').drawCircle(0, 0, 0.45);
      dwRobotMarker.addChild(robotBg, robotBorder);
      
      var robotImage = new Image();
      robotImage.src = '/images/pimto.png';
      var bitmap = new createjs.Bitmap(robotImage);
      robotImage.onload = function() {
          var scale = 0.7 / robotImage.width;
          bitmap.scaleX = scale; bitmap.scaleY = scale;
          bitmap.regX = robotImage.width / 2; bitmap.regY = robotImage.height / 2;
          dwRobotMarker.addChild(bitmap);
      };
      dwRobotMarker.visible = false;
      dwStage.addChild(dwRobotMarker);

      dwTfClient = new ROSLIB.TFClient({ ros: dwRos, fixedFrame: 'map', angularThres: 0.01, transThres: 0.01, rate: 10.0 });
      dwTfClient.subscribe('base_link', function(tf) {
          if (dwRobotMarker && dwStage) {
              dwRobotMarker.x = tf.translation.x;
              dwRobotMarker.y = -tf.translation.y;
              var q = tf.rotation;
              var heading = Math.atan2(2 * (q.w * q.z + q.x * q.y), 1 - 2 * (q.y * q.y + q.z * q.z));
              dwRobotMarker.rotation = -(heading * 180.0 / Math.PI);
              dwRobotMarker.visible = true;
              dwStage.update();
          }
      });
  }

  function dwConnectROS() {
      if (typeof ROSLIB === 'undefined') {
          setTimeout(dwConnectROS, 500);
          return;
      }
      var ip = localStorage.getItem('ros_ip') || '192.168.0.186';
      var url = 'ws://' + ip + ':9090';
      dwRos = new ROSLIB.Ros({ url: url });
      dwRos.on('connection', function() {
          document.getElementById('dw-map-label').textContent = '실시간 위치 추적 중';
          document.getElementById('dw-map-label').style.color = '#10b981';
          dwInitMap();
      });
      dwRos.on('error', function() {
          document.getElementById('dw-map-label').textContent = '오프라인';
          document.getElementById('dw-map-label').style.color = '#ef4444';
      });
  }

  function poll() {
    var widget = document.getElementById('dw-widget');
    
    fetch('/api/delivery/status')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.active) { widget.style.display = 'none'; return; }
        if (data.orderId) dwOrderId = data.orderId;

        widget.style.display = 'block';
        if (!window.dwRosConnected) {
            window.dwRosConnected = true;
            dwConnectROS();
        }

        window.dwDestX = data.destX;
        window.dwDestY = data.destY;

        // 상단 타이틀 레이블: 축소 시에도 품목+갯수+ETA 보임
        var label = data.productName;
        if (window.dwPhysicalArrived || data.arrived) {
            label += ' · 도착 완료!';
        } else {
            if (window.dwHasPhysicalETA && window.dwPhysicalEtaStr) {
                label += ' · ' + window.dwPhysicalEtaStr;
            } else {
                label += ' · ' + data.eta;
            }
        }
        document.getElementById('dw-product-label').textContent = label;

        document.getElementById('dw-progress-fill').style.width = data.progress + '%';
        document.getElementById('dw-pct-text').textContent = data.progress + '%';

        if (window.dwPhysicalArrived || data.arrived) {
          document.getElementById('dw-eta-text').textContent = '도착 완료!';
          document.getElementById('dw-map').style.display     = 'none';
          document.getElementById('dw-arrived').style.display = 'block';
          document.getElementById('dw-progress-fill').style.width = '100%';
        } else {
          // 서버 ETA보다 신뢰할 수 있는 물리적(실제) ETA가 있으면 표시
          if (window.dwHasPhysicalETA && window.dwPhysicalEtaStr) {
            document.getElementById('dw-eta-text').textContent  = '도착 예상: ' + window.dwPhysicalEtaStr;
          } else {
            document.getElementById('dw-eta-text').textContent  = '도착 예상: ' + data.eta;
          }
          document.getElementById('dw-map').style.display     = 'flex';
          document.getElementById('dw-arrived').style.display = 'none';
        }

        // 대기 큐 표시
        var queueEl = document.getElementById('dw-queue-info');
        if (data.queueCount > 0) {
          queueEl.textContent = '⏳ 다음 대기: ' + data.nextProductName
            + (data.queueCount > 1 ? ' 외 ' + (data.queueCount - 1) + '건' : '');
          queueEl.style.display = 'block';
        } else {
          queueEl.style.display = 'none';
        }
      })
      .catch(function () {});
  }

  // 민호님의 Node.js 서버 웹소켓(Socket.IO)을 연결하여 실제 물리적 로봇 도착 및 실시간 위치를 감지합니다.
  if (typeof io !== 'undefined') {
      var nodeSocket = io('http://192.168.0.70:4000');
      nodeSocket.on('robot_position', function(pos) {
          
          // 로봇 마커 실시간 위치 업데이트 (Node.js 시뮬레이터 / 서버 좌표 동기화)
          if (dwRobotMarker && dwStage) {
              // Node.js 서버의 역방향 오프셋 공식 적용 (server.js의 OFFSET_X=190, OFFSET_Y=127 기준)
              var rosY = ((pos.x - 190) * 0.05) - 10.0;
              var rosX = ((384 - (pos.y - 127)) * 0.05) - 10.0;
              
              dwRobotMarker.x = rosX;
              dwRobotMarker.y = -rosY; // ros2d.js는 y축을 반전해서 렌더링함
              dwRobotMarker.rotation = -(pos.heading * 180.0 / Math.PI);
              dwRobotMarker.visible = true;
              
              // 마커가 지도(OccupancyGrid) 뒤에 가려지지 않도록 최상단으로 끌어올림
              if (dwStage.getChildIndex(dwRobotMarker) !== dwStage.getNumChildren() - 1) {
                  dwStage.setChildIndex(dwRobotMarker, dwStage.getNumChildren() - 1);
              }
              dwStage.update();
              
              console.log('[Widget] Robot updated:', pos.x, pos.y, '-> rosX:', rosX, 'rosY:', rosY);
          }

          // 실시간 예상 도착 시간(ETA) 계산 및 표시
          if (pos.status === 'MOVING' && String(pos.currentProductId) === String(dwOrderId)) {
              if (window.dwDestX !== undefined && window.dwDestY !== undefined) {
                  // 민호님 서버의 픽셀 좌표를 ROS 미터 좌표로 변환
                  var rosX = -10.0 + (pos.x * 0.05);
                  var rosY = -10.0 + ((384 - pos.y) * 0.05);
                  
                  // 직선 거리 계산 (미터)
                  var dx = window.dwDestX - rosX;
                  var dy = window.dwDestY - rosY;
                  var distance = Math.sqrt(dx * dx + dy * dy);
                  
                  // 남은 시간 계산 (로봇 평균 속도를 초당 0.15m로 가정)
                  var speed = 0.15;
                  var remainingSeconds = Math.max(0, Math.floor(distance / speed));
                  
                  var minutes = Math.floor(remainingSeconds / 60);
                  var seconds = remainingSeconds % 60;
                  var etaStr = (minutes > 0 ? minutes + "분 " : "") + seconds + "초";
                  
                  window.dwHasPhysicalETA = true; 
                  window.dwPhysicalEtaStr = etaStr; // poll()에서 사용하도록 저장
                  document.getElementById('dw-eta-text').textContent = '도착 예상: ' + etaStr;
              }
          }

          // 로봇이 물리적으로 도착했고, 그 배달 목적지가 현재 사용자의 주문(dwOrderId)인 경우에만 PIN 모달을 띄웁니다!
          if (pos.status === 'ARRIVED' && String(pos.currentProductId) === String(dwOrderId)) {
              window.dwPhysicalArrived = true; // poll()에서 도착 상태를 강제로 유지하도록 저장
              if (!modalShown) {
                  modalShown = true;
                  var modalProduct = document.getElementById('dw-modal-product');
                  if (modalProduct) modalProduct.textContent = document.getElementById('dw-product-label').textContent;
                  var modal = document.getElementById('dw-arrived-modal');
                  modal.style.display = 'flex';
                  document.getElementById('dw-eta-text').textContent = '도착 완료!';
                  document.getElementById('dw-map').style.display = 'none';
                  document.getElementById('dw-arrived').style.display = 'block';
                  document.getElementById('dw-progress-fill').style.width = '100%';
                  dwStartCountdown();
              }
          }
      });
  }

  setTimeout(function () {
    poll();
    setInterval(poll, 3000);
  }, 400);
})();

var dwCountdownTimer = null;
var dwCountdownSecs = 30;

function dwStartCountdown() {
  dwCountdownSecs = 30;
  dwUpdateCountdown();
  dwCountdownTimer = setInterval(function() {
    dwCountdownSecs--;
    dwUpdateCountdown();
    if (dwCountdownSecs <= 0) {
      clearInterval(dwCountdownTimer);
      fetch('/api/delivery/cancel', { method: 'POST' })
        .finally(function() {
          document.getElementById('dw-arrived-modal').style.display = 'none';
        });
    }
  }, 1000);
}

function dwUpdateCountdown() {
  var el = document.getElementById('dw-countdown');
  if (el) el.textContent = '⏱ ' + dwCountdownSecs + '초 안에 수령하지 않으면 자동 취소됩니다';
}

// 8칸 PIN 박스 자동 이동
document.addEventListener('DOMContentLoaded', function() {
  var boxes = document.querySelectorAll('.dw-pin-box');
  boxes.forEach(function(box, i) {
    box.addEventListener('input', function() {
      this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (this.value.length === 1 && i < boxes.length - 1) {
        boxes[i + 1].focus();
      }
    });
    box.addEventListener('keydown', function(e) {
      if (e.key === 'Backspace' && this.value === '' && i > 0) {
        boxes[i - 1].focus();
      }
      if (e.key === 'Enter') dwVerifyPin();
    });
    box.addEventListener('paste', function(e) {
      e.preventDefault();
      var text = (e.clipboardData || window.clipboardData).getData('text')
                  .toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
      boxes.forEach(function(b, j) { b.value = text[j] || ''; });
      if (text.length < 8) boxes[Math.min(text.length, 7)].focus();
    });
  });
});

function dwVerifyPin() {
  var boxes = document.querySelectorAll('.dw-pin-box');
  var parts = Array.from(boxes).map(function(b) { return b.value; });
  var pin = parts.slice(0, 4).join('') + '-' + parts.slice(4).join('');
  if (pin.replace('-', '').length < 8) return;

  var btn = document.getElementById('dw-pin-btn');
  var resultEl = document.getElementById('dw-pin-result');
  btn.disabled = true;
  btn.textContent = '확인 중...';

  fetch('/api/pin/verify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pinCode: pin })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.success) {
      if (dwCountdownTimer) clearInterval(dwCountdownTimer);
      resultEl.style.cssText = 'display:block;background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;font-size:13px;font-weight:700;padding:10px 16px;border-radius:10px;margin-top:14px;';
      resultEl.textContent = '배출 완료! 음료를 가져가세요.';
      boxes.forEach(function(b) { b.disabled = true; });
      btn.style.display = 'none';
      document.getElementById('dw-widget').style.display = 'none';
      setTimeout(function() {
        document.getElementById('dw-arrived-modal').style.display = 'none';
      }, 2500);
    } else {
      resultEl.style.cssText = 'display:block;background:#fef2f2;color:#dc2626;border:1px solid #fecaca;font-size:13px;font-weight:700;padding:10px 16px;border-radius:10px;margin-top:14px;';
      resultEl.textContent = data.message || 'PIN이 올바르지 않습니다.';
      boxes.forEach(function(b) { b.style.borderColor = '#ef4444'; });
      btn.disabled = false;
      btn.textContent = '확인';
      setTimeout(function() {
        boxes.forEach(function(b) { b.style.borderColor = '#e8dfd4'; });
      }, 1500);
    }
  })
  .catch(function() {
    btn.disabled = false;
    btn.textContent = '확인';
  });
}
</script>

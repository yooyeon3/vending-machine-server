<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PIMTO - 문의하기</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background: #f8fafc; min-height: 100vh; }
        .header { background: white; padding: 14px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e2e8f0; }
        .header img { height: 34px; object-fit: contain; }
        .header span { font-size: 17px; font-weight: 700; color: #1e293b; }
        .container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; border-radius: 16px; padding: 32px; border: 1px solid #e2e8f0; }
        .card-title { font-size: 20px; font-weight: 700; color: #1e293b; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #1e293b; margin-bottom: 8px; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Pretendard', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: #6e8efb; }
        .form-group textarea { height: 200px; resize: none; }
        .secret-group { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
        .secret-group input { width: auto; }
        .secret-group label { font-size: 14px; font-weight: 500; color: #64748b; margin: 0; }
        .btn-group { display: flex; gap: 12px; }
        .submit-btn {
            flex: 1;
            padding: 14px;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .submit-btn:hover { background: #334155; }
        .cancel-btn {
            flex: 1;
            padding: 14px;
            background: white;
            color: #64748b;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cancel-btn:hover { background: #f8fafc; }
    </style>
</head>
<body>

<div class="header" style="justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 12px;">
        <a href="/"><img th:src="@{/images/vending-logo.png}" alt="PIMTO 로고"></a>
        <span>문의하기</span>
    </div>
    <!-- 채팅 알림 아이콘 -->
    <div onclick="toggleChatPanel()" style="position:relative; display:flex; align-items:center; cursor:pointer;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span id="chatBadge"
              th:text="${unreadCount}"
              th:style="${unreadCount > 0} ? 'position:absolute;top:-6px;right:-6px;background:#ef4444;color:white;border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;' : 'display:none'">
        </span>
    </div>
</div>

<div class="container">
    <div class="card">
        <div class="card-title">✉️ 문의 작성</div>
        <form th:action="@{/inquiry/write}" method="post">
            <div class="form-group">
                <label>제목</label>
                <input type="text" name="title" placeholder="제목을 입력하세요" required>
            </div>
            <div class="form-group">
                <label>내용</label>
                <textarea name="content" placeholder="문의 내용을 입력하세요" required></textarea>
            </div>
            <div class="secret-group">
                <input type="checkbox" name="secret" id="secret">
                <label for="secret">🔒 비밀글로 등록</label>
            </div>
            <div class="btn-group">
                <button type="submit" class="submit-btn">등록하기</button>
                <a href="/inquiry/list" class="cancel-btn">취소</a>
            </div>
        </form>
    </div>
</div>

<!-- 채팅 위젯 통합 -->
<th:block th:replace="~{fragments/chat-widget :: chatWidget}"></th:block>

</body>
</html>

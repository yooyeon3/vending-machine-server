<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>PIMTO - 관리자</title>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root {
            --bg: #faf8f4;
            --card-bg: #ffffff;
            --header-bg: #f2ede4;
            --primary-text: #3d2c1e;
            --sub-text: #9e8c7a;
            --accent: #c47d4a;
            --border: #e8dfd4;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            color: var(--primary-text);
        }

        .header {
            background: var(--card-bg);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            position: relative;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left img {
            height: 34px;
            object-fit: contain;
        }

        .toss-admin-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #F2F4F6;
            padding: 5px 12px 5px 6px;
            border-radius: 12px;
            margin-left: 4px;
        }
        .toss-admin-badge .txt {
            font-size: 14px;
            font-weight: 700;
            color: #191F28;
            letter-spacing: -0.3px;
        }

        .logout-btn {
            padding: 8px 16px;
            background: var(--bg);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: var(--sub-text);
        }

        /* 대시보드 네비게이션 프리미엄 스타일 */
        .dash-nav-link {
            position: relative;
            text-decoration: none;
            color: var(--sub-text);
            font-weight: 700;
            font-size: 16px;
            letter-spacing: -0.3px;
            padding: 5px 0;
            transition: color 0.3s ease;
        }

        .dash-nav-link:hover,
        .dash-nav-link.active {
            color: var(--primary-text);
        }

        .dash-nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(-50%);
            border-radius: 2px;
        }

        .dash-nav-link:hover::after,
        .dash-nav-link.active::after {
            width: 100%;
        }

        .header-center {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            flex: 2;
        }

        .header-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 20px;
            flex: 1;
        }

        .inquiry-panel-item-link {
            display: block;
            text-decoration: none;
            color: inherit;
            transition: background 0.15s;
        }

        .inquiry-panel-item-link:hover .inquiry-panel-item {
            background: var(--bg);
        }

        .wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
            background: var(--border);
        }

        .content {
            flex: 1;
            display: flex;
            gap: 20px;
            padding: 20px 24px;
            overflow: hidden;
            background: var(--border);
        }

        .left-panel {
            width: 40%;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            overflow-y: auto;
            flex-shrink: 0;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow: hidden;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary-text);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 8px;
            background: var(--bg);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .menu-item img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .no-img {
            width: 100%;
            aspect-ratio: 1;
            background: var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--sub-text);
            font-size: 11px;
            text-align: center;
            margin-bottom: 8px;
            padding: 8px;
        }

        .menu-info {
            text-align: center;
            width: 100%;
        }

        .menu-info .name {
            font-weight: 600;
            font-size: 13px;
            color: var(--primary-text);
            margin-bottom: 6px;
        }

        /* DB 연동 폼 컨트롤 버튼 스타일 */
        .stock-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }

        .stock-btn {
            width: 24px;
            height: 24px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .stock-btn.btn-minus {
            color: var(--sub-text);
        }

        .stock-btn.btn-plus {
            color: var(--accent);
            border-color: var(--accent);
        }

        .stock-btn.btn-minus:hover:not(:disabled) {
            background: var(--bg);
        }

        .stock-btn.btn-plus:hover:not(:disabled) {
            background: var(--accent);
            color: white;
        }

        /* 비활성화 시 스타일 */
        .stock-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background-color: var(--bg);
            color: var(--sub-text);
            border-color: var(--border);
        }

        .stock-count {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary-text);
            min-width: 20px;
            text-align: center;
        }

        .stock-label {
            font-size: 11px;
            color: var(--sub-text);
            margin-top: 3px;
        }

        .manage-section {
            border-top: 1px solid var(--border);
            padding-top: 16px;
            margin-top: 4px;
        }

        .manage-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-text);
            margin-bottom: 10px;
        }

        /* 폼 스타일 */
        .add-product-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            gap: 8px;
        }

        .manage-input {
            flex: 1;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            font-family: 'Pretendard', sans-serif;
            background: var(--card-bg);
            color: var(--primary-text);
        }

        .manage-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .add-btn {
            width: 100%;
            padding: 10px 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .add-btn:hover {
            background: #b06538;
        }

        .remove-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .manage-select {
            flex: 1;
            padding: 9px 12px;
            border: 1.5px solid var(--accent);
            border-radius: 8px;
            font-size: 13px;
            font-family: 'Pretendard', sans-serif;
            background: white;
            color: var(--primary-text);
        }

        .remove-btn {
            padding: 9px 14px;
            background: white;
            color: var(--danger);
            border: 1.5px solid var(--accent);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }

        .remove-btn:hover {
            background: #fef2f2;
        }

        .map-panel {
            background: white;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            flex: 1;
            overflow: hidden;
        }

        #mapCanvas {
            width: 100%;
            height: calc(100% - 36px);
            border-radius: 10px;
            background: #111;
            display: block;
        }

        .emergency-btn {
            width: 100%;
            padding: 16px;
            background: #fef2f2;
            border: 2px solid #f8a0a0;
            border-radius: 12px;
            color: var(--danger);
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }

        .emergency-btn:hover {
            background: #fee2e2;
        }

        .emergency-btn.active {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        /* 문의 팝업 패널 */
        .inquiry-panel {
            position: fixed;
            top: 70px;
            right: 20px;
            width: 360px;
            background: white;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            z-index: 300;
            display: none;
            overflow: hidden;
            max-height: 500px;
            overflow-y: auto;
        }

        .inquiry-panel.show {
            display: block;
        }

        .inquiry-panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 15px;
            font-weight: 700;
            color: var(--primary-text);
            position: sticky;
            top: 0;
            background: white;
        }

        .inquiry-panel-item {
            padding: 16px 20px;
            border-bottom: 1px solid var(--bg);
        }

        .inquiry-panel-item:last-child {
            border-bottom: none;
        }

        .inquiry-panel-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-text);
            margin-bottom: 4px;
        }

        .inquiry-panel-content {
            font-size: 13px;
            color: var(--sub-text);
            margin-top: 6px;
            line-height: 1.5;
        }

        .inquiry-panel-meta {
            font-size: 12px;
            color: #9e8c7a;
            margin-top: 6px;
        }

        .inquiry-empty {
            padding: 30px;
            text-align: center;
            color: var(--sub-text);
            font-size: 14px;
        }

        .secret-badge {
            background: #fef2f2;
            color: var(--danger);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 4px;
        }


        @media (max-width: 900px) {
            .content {
                flex-direction: column;
                overflow-y: auto;
                padding: 15px;
            }

            .left-panel {
                width: 100%;
                flex-shrink: 0;
                min-height: auto;
            }

            .right-panel {
                width: 100%;
                flex-shrink: 0;
            }

            .menu-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            #mapCanvas {
                aspect-ratio: 1;
                height: auto;
            }
        }

        @media (max-width: 600px) {
            .header {
                padding: 12px 16px;
            }

            .admin-label {
                display: none;
            }

            .menu-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="header-left" style="flex: 1;">
            <a href="/admin" style="display:flex; align-items:center; gap:8px; text-decoration:none;">
                <img src="/images/vending-logo.png" alt="PIMTO 로고">
                <div class="toss-admin-badge">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="24" height="24" rx="8" fill="#E8F3FF"/>
                        <path d="M12 5.5L6.5 7.94V11.61C6.5 15.42 8.86 18.99 12 20C15.14 18.99 17.5 15.42 17.5 11.61V7.94L12 5.5Z" fill="#3182F6"/>
                        <path d="M10.82 14.5L8.02 11.7L9.15 10.57L10.82 12.24L14.84 8.22L15.97 9.35L10.82 14.5Z" fill="white"/>
                    </svg>
                    <span class="txt">관리자</span>
                </div>
            </a>
        </div>
        <div class="header-center">
            <a href="/admin" class="dash-nav-link active">재고관리</a>
            <a href="/admin/statistics" class="dash-nav-link">매출통계</a>
            <a href="/admin/member" class="dash-nav-link">회원관리</a>
            <a href="/admin/robot-control" class="dash-nav-link">로봇관리</a>
            <a href="#" class="dash-nav-link" onclick="toggleChatPanel(); return false;" style="position:relative;">
                1:1 문의
                <span id="chatBadge" th:text="${chatCount}"
                    th:style="${chatCount != null && chatCount > 0} ? 'position:absolute;top:-5px;right:-15px;background:var(--danger);color:white;border-radius:50%;width:16px;height:16px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;' : 'display:none'">
                </span>
            </a>
        </div>
        <div class="header-right">
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <button class="logout-btn" type="submit">로그아웃</button>
            </form>
        </div>
    </div>


    <div class="wrapper">
        <div class="content">

            <div class="left-panel">
                <div class="panel-title">🥤 음료 재고 (DB 연동)</div>

                <div class="menu-grid" id="menuGrid">
                    <div class="menu-item" th:each="product : ${products}" th:id="'item-' + ${product.id}">

                        <img th:if="${product.imageUrl != null and product.imageUrl != ''}" th:src="${product.imageUrl}"
                            alt="상품 이미지">
                        <div class="no-img" th:if="${product.imageUrl == null or product.imageUrl == ''}">No Image</div>

                        <div class="menu-info">
                            <div class="name" th:text="${product.name}">상품명</div>
                            <div class="stock-control">

                                <form th:action="@{/admin/stock/update}" method="post"
                                    style="margin: 0; display: flex;">
                                    <input type="hidden" name="productId" th:value="${product.id}">
                                    <input type="hidden" name="amount" value="-1">
                                    <button type="submit" class="stock-btn btn-minus"
                                        th:disabled="${product.stock <= 0}">−</button>
                                </form>

                                <span class="stock-count" th:text="${product.stock}">0</span>

                                <form th:action="@{/admin/stock/update}" method="post"
                                    style="margin: 0; display: flex;">
                                    <input type="hidden" name="productId" th:value="${product.id}">
                                    <input type="hidden" name="amount" value="1">
                                    <button type="submit" class="stock-btn btn-plus">+</button>
                                </form>

                            </div>
                            <div class="stock-label">개 남음</div>
                        </div>
                    </div>

                </div>

                <div class="manage-section">
                    <div class="manage-title">➕ 음료 추가 (DB 연동)</div>

                    <form action="/admin/product/add" method="POST" class="add-product-form">
                        <input class="manage-input" type="text" name="name" placeholder="상품명 (예: 콜라)" required>
                        <div class="form-row">
                            <input class="manage-input" type="number" name="price" placeholder="가격 (예: 1500)" required>
                            <input class="manage-input" type="number" name="stock" placeholder="초기 재고 (예: 10)" required>
                        </div>
                        <input class="manage-input" type="text" name="imageUrl"
                            placeholder="사진 경로 (예: /images/letsbe.jpg)">
                        <button class="add-btn" type="submit">상품 추가하기</button>
                    </form>

                    <div class="manage-title" style="margin-top: 14px;">➖ 음료 제거 (테스트용)</div>
                    <div class="remove-row">
                        <select class="manage-select" id="removeDrinkSelect">
                            <option th:each="product : ${products}" th:value="${product.name}"
                                th:text="${product.name}"></option>
                        </select>
                        <button class="remove-btn" onclick="removeDrink()">제거</button>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="map-panel">
                    <div class="panel-title">
                        <img src="/images/pimto.png" style="width:20px;height:20px;object-fit:contain;">
                        PIMTO 현재 위치
                    </div>
                    <canvas id="mapCanvas"></canvas>
                </div>
                <button class="emergency-btn" id="emergencyBtn" onclick="emergencyCall()">🚨 긴급 호출</button>
            </div>

        </div>
    </div>

    <div th:replace="~{fragments/admin-chat-panel :: adminChatPanel}"></div>
    <script>
        // 음료 제거 (UI 테스트용 - 실제 삭제는 DB API 필요)

        function removeDrink() {
            const select = document.getElementById('removeDrinkSelect');
            const name = select.value;
            if (!name) return;
            alert('이 버튼은 현재 UI 테스트용입니다. 실제 삭제는 DB 연결이 필요합니다.');
        }

        // 지도 캔버스 및 긴급 호출 로직
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const HOME = { x: 0.15, y: 0.5 };
        let robot = { x: 0.5, y: 0.5 };
        let isReturning = false;
        const robotImg = new Image();
        robotImg.src = '/images/pimto.png';

        function resizeCanvas() {
            canvas.width = canvas.width; // dummy write
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            drawMap();
        }

        function drawMap() {
            const W = canvas.width, H = canvas.height;
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = '#111827';
            ctx.fillRect(0, 0, W, H);

            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 1;
            for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
            for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.strokeRect(20, 20, W - 40, H - 40);
            ctx.beginPath();
            ctx.moveTo(W * 0.4, 20); ctx.lineTo(W * 0.4, H * 0.6);
            ctx.moveTo(W * 0.4, H * 0.6); ctx.lineTo(W * 0.7, H * 0.6);
            ctx.stroke();

            const hx = HOME.x * W, hy = HOME.y * H;
            ctx.fillStyle = 'rgba(196,125,74,0.2)';
            ctx.beginPath(); ctx.arc(hx, hy, 20, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#c47d4a'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(hx, hy, 20, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = '#c47d4a';
            ctx.font = 'bold 11px Pretendard';
            ctx.textAlign = 'center';
            ctx.fillText('원위치', hx, hy + 35);

            const rx = robot.x * W, ry = robot.y * H;
            if (isReturning) {
                ctx.strokeStyle = 'rgba(196,125,74,0.4)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([6, 4]);
                ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(hx, hy); ctx.stroke();
                ctx.setLineDash([]);
            }

            ctx.save();
            ctx.beginPath();
            ctx.arc(rx, ry, 20, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(robotImg, rx - 20, ry - 20, 40, 40);
            ctx.restore();

            ctx.fillStyle = isReturning ? '#f59e0b' : '#10b981';
            ctx.font = 'bold 11px Pretendard';
            ctx.textAlign = 'center';
            ctx.fillText(isReturning ? '복귀 중...' : '대기 중', rx, ry + 36);
        }

        function emergencyCall() {
            const btn = document.getElementById('emergencyBtn');
            if (isReturning) return;
            isReturning = true;
            btn.classList.add('active');
            btn.textContent = '🔄 원위치 복귀 중...';
            function animate() {
                const dx = HOME.x - robot.x, dy = HOME.y - robot.y;
                if (Math.sqrt(dx * dx + dy * dy) < 0.01) {
                    robot.x = HOME.x; robot.y = HOME.y;
                    isReturning = false;
                    btn.classList.remove('active');
                    btn.textContent = '🚨 긴급 호출';
                    drawMap(); return;
                }
                robot.x += dx * 0.02;
                robot.y += dy * 0.02;
                drawMap();
                requestAnimationFrame(animate);
            }
            animate();
        }

        robotImg.onload = () => drawMap();
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);
    </script>

    <div th:replace="~{fragments/admin-chat-panel :: adminChatPanel}"></div>
</body>

</html>

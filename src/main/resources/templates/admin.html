<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PIMTO - 관리자</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background: #d4d8dd; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .header {
            background: white;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #94a3b8;
            flex-shrink: 0;
            position: relative;
            z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-left img { height: 34px; object-fit: contain; }
        .header-left .admin-label { font-size: 17px; font-weight: 700; color: #1e293b; }
        .logout-btn {
            padding: 8px 16px;
            background: #f1f5f9;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #64748b;
        }

        .hamburger {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .hamburger:hover { background: #f1f5f9; }
        .hamburger span {
            display: block;
            width: 100%;
            height: 2px;
            background: #64748b;
            border-radius: 2px;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.2);
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }
        .sidebar-overlay.show { opacity: 1; pointer-events: all; }

        .sidebar {
            position: fixed;
            top: 0; left: 0;
            width: 220px;
            height: 100vh;
            background: white;
            border-right: 2px solid #e2e8f0;
            z-index: 200;
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            box-shadow: none;
        }
        .sidebar.open { transform: translateX(0); }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 18px 22px 14px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 8px;
        }
        .sidebar-logo img { height: 28px; object-fit: contain; }
        .sidebar-logo span { font-size: 15px; font-weight: 700; color: #1e293b; }

        .sidebar-menu { list-style: none; }
        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 22px;
            font-size: 14px;
            font-weight: 500;
            color: #64748b;
            text-decoration: none;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }
        .sidebar-menu li a:hover { background: #f8fafc; color: #6e8efb; border-left-color: #6e8efb; }
        .sidebar-menu li a.active { background: #f0f0ff; color: #6e8efb; border-left-color: #6e8efb; font-weight: 700; }
        .menu-badge {
            margin-left: auto;
            background: #ef4444; color: white;
            border-radius: 50%; min-width: 18px; height: 18px;
            font-size: 11px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            padding: 0 4px;
        }
        .inquiry-panel-item-link {
            display: block;
            text-decoration: none;
            color: inherit;
            transition: background 0.15s;
        }
        .inquiry-panel-item-link:hover .inquiry-panel-item { background: #f8fafc; }

        .wrapper { display: flex; flex: 1; overflow: hidden; background: #d4d8dd; }

        .content {
            flex: 1;
            display: flex;
            gap: 20px;
            padding: 20px 24px;
            overflow: hidden;
            background: #d4d8dd;
        }

        .left-panel {
            width: 40%;
            background: white;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #b0b8c4;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow: hidden;
        }

        .panel-title { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 8px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        .menu-item img { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 8px; margin-bottom: 8px; }
        .no-img {
            width: 100%; aspect-ratio: 1; background: #e2e8f0; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: #94a3b8; font-size: 11px; text-align: center; margin-bottom: 8px; padding: 8px;
        }
        .menu-info { text-align: center; width: 100%; }
        .menu-info .name { font-weight: 600; font-size: 13px; color: #1e293b; margin-bottom: 6px; }

        /* DB 연동 폼 컨트롤 버튼 스타일 */
        .stock-control { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px; }
        .stock-btn {
            width: 24px; height: 24px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        .stock-btn.btn-minus { color: #64748b; }
        .stock-btn.btn-plus { color: #6e8efb; border-color: #6e8efb; }
        .stock-btn.btn-minus:hover:not(:disabled) { background: #f1f5f9; }
        .stock-btn.btn-plus:hover:not(:disabled) { background: #6e8efb; color: white; }

        /* 비활성화 시 스타일 */
        .stock-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background-color: #f1f5f9;
            color: #94a3b8;
            border-color: #e2e8f0;
        }

        .stock-count { font-size: 16px; font-weight: 700; color: #1e293b; min-width: 20px; text-align: center; }
        .stock-label { font-size: 11px; color: #64748b; margin-top: 3px; }

        .manage-section { border-top: 1px solid #e2e8f0; padding-top: 16px; margin-top: 4px; }
        .manage-title { font-size: 13px; font-weight: 700; color: #1e293b; margin-bottom: 10px; }

        /* 폼 스타일 */
        .add-product-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .form-row { display: flex; gap: 8px; }
        .manage-input {
            flex: 1; padding: 9px 12px; border: 1px solid #e2e8f0;
            border-radius: 8px; font-size: 13px; font-family: 'Pretendard', sans-serif;
        }
        .manage-input:focus { outline: none; border-color: #6e8efb; }
        .add-btn {
            width: 100%;
            padding: 10px 14px;
            background: #6e8efb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .add-btn:hover { background: #5a7be0; }

        .remove-row { display: flex; gap: 8px; margin-top: 10px; }
        .manage-select {
            flex: 1; padding: 9px 12px; border: 1.5px solid #6e8efb;
            border-radius: 8px; font-size: 13px; font-family: 'Pretendard', sans-serif;
            background: white; color: #1e293b;
        }
        .remove-btn {
            padding: 9px 14px; background: white; color: #ef4444;
            border: 1.5px solid #6e8efb; border-radius: 8px; cursor: pointer;
            font-size: 13px; font-weight: 600; white-space: nowrap;
        }
        .remove-btn:hover { background: #fef2f2; }

        .map-panel {
            background: white; border-radius: 16px; padding: 20px;
            border: 1px solid #b0b8c4; flex: 1; overflow: hidden;
        }
        #mapCanvas {
            width: 100%; height: calc(100% - 36px);
            border-radius: 10px; background: #111; display: block;
        }

        .emergency-btn {
            width: 100%; padding: 16px; background: #fef2f2;
            border: 2px solid #f8a0a0; border-radius: 12px;
            color: #ef4444; font-size: 17px; font-weight: 700;
            cursor: pointer; flex-shrink: 0;
        }
        .emergency-btn:hover { background: #fee2e2; }
        .emergency-btn.active { background: #ef4444; color: white; border-color: #ef4444; }

        /* 문의 팝업 패널 */
        .inquiry-panel {
            position: fixed;
            top: 70px; right: 20px;
            width: 360px;
            background: white;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            z-index: 300;
            display: none;
            overflow: hidden;
            max-height: 500px;
            overflow-y: auto;
        }
        .inquiry-panel.show { display: block; }
        .inquiry-panel-header { padding: 16px 20px; border-bottom: 1px solid #e2e8f0; font-size: 15px; font-weight: 700; color: #1e293b; position: sticky; top: 0; background: white; }
        .inquiry-panel-item { padding: 16px 20px; border-bottom: 1px solid #f1f5f9; }
        .inquiry-panel-item:last-child { border-bottom: none; }
        .inquiry-panel-title { font-size: 14px; font-weight: 600; color: #1e293b; margin-bottom: 4px; }
        .inquiry-panel-content { font-size: 13px; color: #64748b; margin-top: 6px; line-height: 1.5; }
        .inquiry-panel-meta { font-size: 12px; color: #94a3b8; margin-top: 6px; }
        .inquiry-empty { padding: 30px; text-align: center; color: #94a3b8; font-size: 14px; }
        .secret-badge { background: #fef2f2; color: #ef4444; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-right: 4px; }

        /* 채팅 플로팅 패널 */
        .chat-panel { position:fixed; top:65px; right:16px; width:280px; height:465px; background:white; border-radius:16px; box-shadow:0 12px 48px rgba(0,0,0,0.22); z-index:500; display:none; flex-direction:column; overflow:hidden; border:1.5px solid #94a3b8; }
        .chat-panel.open { display:flex; }
        .cp-overlay { display:none; position:fixed; inset:0; z-index:499; }
        .cp-overlay.show { display:block; }
        .cp-screen { display:none; flex-direction:column; flex:1; overflow:hidden; }
        .cp-screen.active { display:flex; }
        .cp-header { background:#1e293b; color:white; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; gap:8px; }
        .cp-header-title { font-weight:700; font-size:14px; flex:1; }
        .cp-close { background:none; border:none; color:rgba(255,255,255,0.75); font-size:17px; cursor:pointer; padding:2px 6px; border-radius:4px; transition:background 0.2s; line-height:1; }
        .cp-close:hover { background:rgba(255,255,255,0.15); color:white; }
        .cp-back { background:none; border:none; color:rgba(255,255,255,0.75); font-size:17px; cursor:pointer; padding:2px 6px; border-radius:4px; transition:background 0.2s; line-height:1; }
        .cp-back:hover { background:rgba(255,255,255,0.15); color:white; }
        /* 목록 화면 */
        .cp-chat-list { flex:1; overflow-y:auto; }
        .cp-list-item { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid #f1f5f9; cursor:pointer; transition:background 0.15s; text-decoration:none; color:inherit; }
        .cp-list-item:hover { background:#f8fafc; }
        .cp-list-item.has-unread { background:#fff7ed; }
        .cp-list-avatar { width:36px; height:36px; border-radius:50%; background:#475569; color:white; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .cp-list-info { flex:1; min-width:0; }
        .cp-list-name { font-size:13px; font-weight:700; color:#1e293b; margin-bottom:3px; }
        .cp-list-last { font-size:11px; color:#64748b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .cp-list-meta { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
        .cp-list-time { font-size:10px; color:#94a3b8; }
        .cp-unread-badge { background:#ef4444; color:white; border-radius:50%; min-width:17px; height:17px; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0 3px; }
        .cp-empty-list { padding:36px 16px; text-align:center; color:#94a3b8; font-size:12px; line-height:1.8; }
        .cp-loading { text-align:center; color:#94a3b8; font-size:12px; padding:28px; }
        /* 채팅 화면 */
        .cp-messages { flex:1; overflow-y:auto; padding:12px 10px; display:flex; flex-direction:column; gap:7px; background:#f8fafc; }
        .cp-msg-row { display:flex; align-items:flex-end; gap:5px; }
        .cp-msg-row.mine { flex-direction:row-reverse; }
        .cp-avatar { width:27px; height:27px; border-radius:50%; background:#475569; color:white; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .cp-msg-content { display:flex; flex-direction:column; gap:2px; max-width:75%; }
        .cp-msg-row.mine .cp-msg-content { align-items:flex-end; }
        .cp-sender { font-size:10px; color:#64748b; font-weight:600; margin-bottom:1px; }
        .cp-bubble { padding:7px 11px; border-radius:14px; font-size:12px; line-height:1.5; word-break:break-word; box-shadow:0 1px 2px rgba(0,0,0,0.08); }
        .cp-bubble.user { background:white; border:1px solid #e2e8f0; border-top-left-radius:3px; color:#1e293b; }
        .cp-bubble.mine { background:#1e293b; border-top-right-radius:3px; color:white; }
        .cp-time { font-size:10px; color:#94a3b8; }
        .cp-footer { background:white; border-top:1px solid #e2e8f0; padding:8px 10px; display:flex; gap:7px; align-items:center; flex-shrink:0; }
        .cp-input { flex:1; padding:8px 12px; border:1.5px solid #e2e8f0; border-radius:20px; font-size:12px; font-family:'Pretendard',sans-serif; outline:none; }
        .cp-input:focus { border-color:#475569; }
        .cp-send { width:34px; height:34px; background:#1e293b; border:none; border-radius:50%; color:white; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.2s; flex-shrink:0; }
        .cp-send:hover { background:#334155; }
    </style>
</head>
<body>

<div class="sidebar-overlay" id="overlay"></div>

<div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
        <img src="/images/vending-logo.png" alt="PIMTO 로고">
        <span>관리자</span>
    </div>
    <ul class="sidebar-menu">
        <li><a href="/admin" class="active">📦 재고관리</a></li>
        <li><a href="/admin/statistics">📊 매출통계</a></li>
        <li><a href="/admin/member">👥 회원관리</a></li>
        <li><a href="#"><img src="/images/pimto.png" style="width:18px;height:18px;object-fit:contain;vertical-align:middle;"> 로봇관리</a></li>
    </ul>
</div>

<div class="header">
    <div class="header-left">
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <a href="/admin"><img src="/images/vending-logo.png" alt="PIMTO 로고"></a>
        <span class="admin-label">관리자</span>
    </div>
    <div style="display:flex; align-items:center; gap:16px;">
        <!-- 채팅 알림 아이콘 -->
        <div onclick="toggleChatPanel()" style="position:relative; display:flex; align-items:center; cursor:pointer;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span id="chatBadge"
                  th:text="${chatCount}"
                  th:style="${chatCount > 0} ? 'position:absolute;top:-6px;right:-6px;background:#ef4444;color:white;border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;' : 'display:none'">
            </span>
        </div>
        <form th:action="@{/logout}" method="post">
            <button class="logout-btn" type="submit">로그아웃</button>
        </form>
    </div>
</div>


<div class="wrapper">
    <div class="content">

        <div class="left-panel">
            <div class="panel-title">🥤 음료 재고 (DB 연동)</div>

            <div class="menu-grid" id="menuGrid">
                <div class="menu-item" th:each="product : ${products}" th:id="'item-' + ${product.id}">

                    <img th:if="${product.imageUrl != null and product.imageUrl != ''}" th:src="${product.imageUrl}" alt="상품 이미지">
                    <div class="no-img" th:if="${product.imageUrl == null or product.imageUrl == ''}">No Image</div>

                    <div class="menu-info">
                        <div class="name" th:text="${product.name}">상품명</div>
                        <div class="stock-control">

                            <form th:action="@{/admin/stock/update}" method="post" style="margin: 0; display: flex;">
                                <input type="hidden" name="productId" th:value="${product.id}">
                                <input type="hidden" name="amount" value="-1">
                                <button type="submit" class="stock-btn btn-minus" th:disabled="${product.stock <= 0}">−</button>
                            </form>

                            <span class="stock-count" th:text="${product.stock}">0</span>

                            <form th:action="@{/admin/stock/update}" method="post" style="margin: 0; display: flex;">
                                <input type="hidden" name="productId" th:value="${product.id}">
                                <input type="hidden" name="amount" value="1">
                                <button type="submit" class="stock-btn btn-plus">+</button>
                            </form>

                        </div>
                        <div class="stock-label">개 남음</div>
                    </div>
                </div>

            </div>

            <div class="manage-section">
                <div class="manage-title">➕ 음료 추가 (DB 연동)</div>

                <form action="/admin/product/add" method="POST" class="add-product-form">
                    <input class="manage-input" type="text" name="name" placeholder="상품명 (예: 콜라)" required>
                    <div class="form-row">
                        <input class="manage-input" type="number" name="price" placeholder="가격 (예: 1500)" required>
                        <input class="manage-input" type="number" name="stock" placeholder="초기 재고 (예: 10)" required>
                    </div>
                    <input class="manage-input" type="text" name="imageUrl" placeholder="사진 경로 (예: /images/letsbe.jpg)">
                    <button class="add-btn" type="submit">상품 추가하기</button>
                </form>

                <div class="manage-title" style="margin-top: 14px;">➖ 음료 제거 (테스트용)</div>
                <div class="remove-row">
                    <select class="manage-select" id="removeDrinkSelect">
                        <option th:each="product : ${products}" th:value="${product.name}" th:text="${product.name}"></option>
                    </select>
                    <button class="remove-btn" onclick="removeDrink()">제거</button>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="map-panel">
                <div class="panel-title">
                    <img src="/images/pimto.png" style="width:20px;height:20px;object-fit:contain;">
                    PIMTO 현재 위치
                </div>
                <canvas id="mapCanvas"></canvas>
            </div>
            <button class="emergency-btn" id="emergencyBtn" onclick="emergencyCall()">🚨 긴급 호출</button>
        </div>

    </div>
</div>

<!-- 관리자 채팅 플로팅 패널 -->
<div id="chatPanel" class="chat-panel">
    <!-- 화면1: 유저 목록 -->
    <div id="cpScreenList" class="cp-screen active">
        <div class="cp-header">
            <span class="cp-header-title">💬 고객 채팅</span>
            <button class="cp-close" onclick="toggleChatPanel()">✕</button>
        </div>
        <div class="cp-chat-list" id="cpChatList">
            <div class="cp-loading">불러오는 중...</div>
        </div>
    </div>
    <!-- 화면2: 특정 유저와 채팅 -->
    <div id="cpScreenChat" class="cp-screen">
        <div class="cp-header">
            <button class="cp-back" onclick="showListScreen()">←</button>
            <span class="cp-header-title" id="cpChatTargetName"></span>
            <button class="cp-close" onclick="toggleChatPanel()">✕</button>
        </div>
        <div class="cp-messages" id="cpMessages"></div>
        <div class="cp-footer">
            <input class="cp-input" id="cpInput" placeholder="메시지를 입력하세요..." autocomplete="off">
            <button class="cp-send" onclick="cpSendAdminMessage()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>
</div>
<div id="chatPanelOverlay" class="cp-overlay" onclick="toggleChatPanel()"></div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
    let cpStompClient = null;
    let cpPanelOpen = false;
    let cpListLoaded = false;
    let cpCurrentUser = null;

    function toggleChatPanel() {
        cpPanelOpen = !cpPanelOpen;
        document.getElementById('chatPanel').classList.toggle('open', cpPanelOpen);
        document.getElementById('chatPanelOverlay').classList.toggle('show', cpPanelOpen);
        if (cpPanelOpen) {
            showListScreen();
            if (!cpListLoaded) loadChatList();
        }
    }

    function showListScreen() {
        document.getElementById('cpScreenList').classList.add('active');
        document.getElementById('cpScreenChat').classList.remove('active');
        cpCurrentUser = null;
    }

    function showChatScreen(username) {
        cpCurrentUser = username;
        document.getElementById('cpScreenList').classList.remove('active');
        document.getElementById('cpScreenChat').classList.add('active');
        document.getElementById('cpChatTargetName').textContent = username + '님';
        document.getElementById('cpMessages').innerHTML = '<div class="cp-loading">불러오는 중...</div>';
        loadChatHistory(username);

        // 목록 뱃지 제거
        const item = document.getElementById('cp-list-' + username);
        if (item) {
            item.classList.remove('has-unread');
            const badge = item.querySelector('.cp-unread-badge');
            if (badge) badge.remove();
        }

        // 전체 뱃지 업데이트
        recalcAdminBadge();
    }

    function loadChatList() {
        fetch('/api/chat/list')
            .then(r => r.json())
            .then(list => {
                cpListLoaded = true;
                renderChatList(list);
            });
    }

    function renderChatList(list) {
        const container = document.getElementById('cpChatList');
        if (list.length === 0) {
            container.innerHTML = '<div class="cp-empty-list">아직 채팅을 시작한 고객이 없어요.</div>';
            return;
        }
        container.innerHTML = '';
        list.forEach(item => {
            const el = document.createElement('div');
            el.className = 'cp-list-item' + (item.unreadCount > 0 ? ' has-unread' : '');
            el.id = 'cp-list-' + item.username;
            el.onclick = () => showChatScreen(item.username);
            el.innerHTML = `
                <div class="cp-list-avatar">${item.username.charAt(0).toUpperCase()}</div>
                <div class="cp-list-info">
                    <div class="cp-list-name">${escHtml(item.username)}</div>
                    <div class="cp-list-last">${escHtml(item.lastMessage || '')}</div>
                </div>
                <div class="cp-list-meta">
                    <span class="cp-list-time">${item.lastTime || ''}</span>
                    ${item.unreadCount > 0 ? `<span class="cp-unread-badge">${item.unreadCount}</span>` : ''}
                </div>`;
            container.appendChild(el);
        });
    }

    function loadChatHistory(username) {
        fetch('/api/chat/history/' + username)
            .then(r => r.json())
            .then(messages => {
                const container = document.getElementById('cpMessages');
                container.innerHTML = '';
                if (messages.length === 0) {
                    container.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.75);font-size:13px;margin-top:40px;">아직 대화가 없어요.</div>';
                    return;
                }
                messages.forEach(msg => cpRenderMessage(msg, username, false));
                container.scrollTop = container.scrollHeight;
            });
    }

    function cpRenderMessage(msg, username, scroll) {
        const container = document.getElementById('cpMessages');
        const loadingEl = container.querySelector('.cp-loading');
        if (loadingEl) loadingEl.remove();

        const row = document.createElement('div');
        const isAdmin = msg.fromAdmin;
        row.className = isAdmin ? 'cp-msg-row mine' : 'cp-msg-row';
        const time = msg.time || new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', hour12:false});
        const name = username || msg.userUsername || '';

        if (isAdmin) {
            row.innerHTML = `<div class="cp-msg-content"><div class="cp-bubble mine">${escHtml(msg.content)}</div><span class="cp-time">${time}</span></div>`;
        } else {
            row.innerHTML = `<div class="cp-avatar">${name.charAt(0).toUpperCase()}</div><div class="cp-msg-content"><span class="cp-sender">${escHtml(name)}</span><div class="cp-bubble user">${escHtml(msg.content)}</div><span class="cp-time">${time}</span></div>`;
        }
        container.appendChild(row);
        if (scroll !== false) container.scrollTop = container.scrollHeight;
    }

    function cpSendAdminMessage() {
        const input = document.getElementById('cpInput');
        const content = input.value.trim();
        if (!content || !cpStompClient || !cpCurrentUser) return;
        cpStompClient.send('/app/chat/admin/send', {}, JSON.stringify({content, targetUsername: cpCurrentUser}));
        cpRenderMessage({content, fromAdmin: true}, cpCurrentUser);
        input.value = '';
    }

    function updateListItemWithNewMsg(msg) {
        const username = msg.userUsername;
        let item = document.getElementById('cp-list-' + username);

        if (!item) {
            // 새 유저
            item = document.createElement('div');
            item.className = 'cp-list-item has-unread';
            item.id = 'cp-list-' + username;
            item.onclick = () => showChatScreen(username);
            item.innerHTML = `
                <div class="cp-list-avatar">${username.charAt(0).toUpperCase()}</div>
                <div class="cp-list-info">
                    <div class="cp-list-name">${escHtml(username)}</div>
                    <div class="cp-list-last"></div>
                </div>
                <div class="cp-list-meta">
                    <span class="cp-list-time"></span>
                    <span class="cp-unread-badge">0</span>
                </div>`;
            const emptyEl = document.querySelector('.cp-empty-list');
            if (emptyEl) emptyEl.remove();
            const list = document.getElementById('cpChatList');
            list.insertBefore(item, list.firstChild);
        }

        item.querySelector('.cp-list-last').textContent = msg.content;
        item.querySelector('.cp-list-time').textContent = msg.time;

        if (cpCurrentUser !== username) {
            item.classList.add('has-unread');
            let badge = item.querySelector('.cp-unread-badge');
            if (!badge) {
                badge = document.createElement('span');
                badge.className = 'cp-unread-badge';
                badge.textContent = '0';
                item.querySelector('.cp-list-meta').appendChild(badge);
            }
            badge.textContent = (parseInt(badge.textContent) || 0) + 1;

            // 전체 배지
            const globalBadge = document.getElementById('chatBadge');
            if (globalBadge) {
                const cur = parseInt(globalBadge.textContent) || 0;
                globalBadge.textContent = cur + 1;
                globalBadge.style.display = 'flex';
            }
        }

        // 맨 위로
        const list = document.getElementById('cpChatList');
        list.insertBefore(item, list.firstChild);
    }

    function recalcAdminBadge() {
        const totalUnread = document.querySelectorAll('.cp-unread-badge').length;
        const badge = document.getElementById('chatBadge');
        if (!badge) return;
        if (totalUnread > 0) {
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
        }
    }

    function escHtml(t) { return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    document.getElementById('cpInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); cpSendAdminMessage(); }
    });

    (function connectWS() {
        const socket = new SockJS('/ws');
        cpStompClient = Stomp.over(socket);
        cpStompClient.debug = null;
        cpStompClient.connect({}, function() {
            cpStompClient.subscribe('/user/queue/chat', function(frame) {
                const msg = JSON.parse(frame.body);
                if (msg.fromAdmin) return;

                if (cpCurrentUser === msg.userUsername) {
                    cpRenderMessage(msg, msg.userUsername);
                } else {
                    if (cpListLoaded) updateListItemWithNewMsg(msg);
                }
            });
        });
    })();
</script>

<script>
    // 사이드바 hover 제어
    const hamburger = document.getElementById('hamburger');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    hamburger.addEventListener('mouseenter', () => {
        sidebar.classList.add('open');
        overlay.classList.add('show');
    });
    sidebar.addEventListener('mouseleave', () => {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
    });

    // 음료 제거 (UI 테스트용 - 실제 삭제는 DB API 필요)

    function removeDrink() {
        const select = document.getElementById('removeDrinkSelect');
        const name = select.value;
        if (!name) return;
        alert('이 버튼은 현재 UI 테스트용입니다. 실제 삭제는 DB 연결이 필요합니다.');
    }

    // 지도 캔버스 및 긴급 호출 로직
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    const HOME = { x: 0.15, y: 0.5 };
    let robot = { x: 0.5, y: 0.5 };
    let isReturning = false;
    const robotImg = new Image();
    robotImg.src = '/images/pimto.png';

    function resizeCanvas() {
        canvas.width = canvas.width; // dummy write
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        drawMap();
    }

    function drawMap() {
        const W = canvas.width, H = canvas.height;
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#111827';
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 1;
        for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
        for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 2;
        ctx.strokeRect(20, 20, W-40, H-40);
        ctx.beginPath();
        ctx.moveTo(W*0.4, 20); ctx.lineTo(W*0.4, H*0.6);
        ctx.moveTo(W*0.4, H*0.6); ctx.lineTo(W*0.7, H*0.6);
        ctx.stroke();

        const hx = HOME.x * W, hy = HOME.y * H;
        ctx.fillStyle = 'rgba(110,142,251,0.2)';
        ctx.beginPath(); ctx.arc(hx, hy, 20, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#6e8efb'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(hx, hy, 20, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = '#6e8efb';
        ctx.font = 'bold 11px Pretendard';
        ctx.textAlign = 'center';
        ctx.fillText('원위치', hx, hy+35);

        const rx = robot.x * W, ry = robot.y * H;
        if (isReturning) {
            ctx.strokeStyle = 'rgba(110,142,251,0.4)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([6,4]);
            ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(hx,hy); ctx.stroke();
            ctx.setLineDash([]);
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(rx, ry, 20, 0, Math.PI*2);
        ctx.clip();
        ctx.drawImage(robotImg, rx-20, ry-20, 40, 40);
        ctx.restore();

        ctx.fillStyle = isReturning ? '#f59e0b' : '#10b981';
        ctx.font = 'bold 11px Pretendard';
        ctx.textAlign = 'center';
        ctx.fillText(isReturning ? '복귀 중...' : '대기 중', rx, ry+36);
    }

    function emergencyCall() {
        const btn = document.getElementById('emergencyBtn');
        if (isReturning) return;
        isReturning = true;
        btn.classList.add('active');
        btn.textContent = '🔄 원위치 복귀 중...';
        function animate() {
            const dx = HOME.x - robot.x, dy = HOME.y - robot.y;
            if (Math.sqrt(dx*dx+dy*dy) < 0.01) {
                robot.x = HOME.x; robot.y = HOME.y;
                isReturning = false;
                btn.classList.remove('active');
                btn.textContent = '🚨 긴급 호출';
                drawMap(); return;
            }
            robot.x += dx * 0.02;
            robot.y += dy * 0.02;
            drawMap();
            requestAnimationFrame(animate);
        }
        animate();
    }

    robotImg.onload = () => drawMap();
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);
</script>

</body>

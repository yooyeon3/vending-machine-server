<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PIMTO - 관리자</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background: #d4d8dd; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .header {
            background: white;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #94a3b8;
            flex-shrink: 0;
            position: relative;
            z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-left img { height: 34px; object-fit: contain; }
        .header-left .admin-label { font-size: 17px; font-weight: 700; color: #1e293b; }
        .logout-btn {
            padding: 8px 16px;
            background: #f1f5f9;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #64748b;
        }

        .hamburger {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .hamburger:hover { background: #f1f5f9; }
        .hamburger span {
            display: block;
            width: 100%;
            height: 2px;
            background: #64748b;
            border-radius: 2px;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.2);
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }
        .sidebar-overlay.show { opacity: 1; pointer-events: all; }

        .sidebar {
            position: fixed;
            top: 0; left: 0;
            width: 220px;
            height: 100vh;
            background: white;
            border-right: 2px solid #e2e8f0;
            z-index: 200;
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            box-shadow: none;
        }
        .sidebar.open { transform: translateX(0); }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 18px 22px 14px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 8px;
        }
        .sidebar-logo img { height: 28px; object-fit: contain; }
        .sidebar-logo span { font-size: 15px; font-weight: 700; color: #1e293b; }

        .sidebar-menu { list-style: none; }
        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 22px;
            font-size: 14px;
            font-weight: 500;
            color: #64748b;
            text-decoration: none;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }
        .sidebar-menu li a:hover { background: #f8fafc; color: #6e8efb; border-left-color: #6e8efb; }
        .sidebar-menu li a.active { background: #f0f0ff; color: #6e8efb; border-left-color: #6e8efb; font-weight: 700; }
        .menu-badge {
            margin-left: auto;
            background: #ef4444; color: white;
            border-radius: 50%; min-width: 18px; height: 18px;
            font-size: 11px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            padding: 0 4px;
        }
        .inquiry-panel-item-link {
            display: block;
            text-decoration: none;
            color: inherit;
            transition: background 0.15s;
        }
        .inquiry-panel-item-link:hover .inquiry-panel-item { background: #f8fafc; }

        .wrapper { display: flex; flex: 1; overflow: hidden; background: #d4d8dd; }

        .content {
            flex: 1;
            display: flex;
            gap: 20px;
            padding: 20px 24px;
            overflow: hidden;
            background: #d4d8dd;
        }

        .left-panel {
            width: 40%;
            background: white;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #b0b8c4;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow: hidden;
        }

        .panel-title { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 8px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        .menu-item img { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 8px; margin-bottom: 8px; }
        .no-img {
            width: 100%; aspect-ratio: 1; background: #e2e8f0; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: #94a3b8; font-size: 11px; text-align: center; margin-bottom: 8px; padding: 8px;
        }
        .menu-info { text-align: center; width: 100%; }
        .menu-info .name { font-weight: 600; font-size: 13px; color: #1e293b; margin-bottom: 6px; }

        /* DB 연동 폼 컨트롤 버튼 스타일 */
        .stock-control { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px; }
        .stock-btn {
            width: 24px; height: 24px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        .stock-btn.btn-minus { color: #64748b; }
        .stock-btn.btn-plus { color: #6e8efb; border-color: #6e8efb; }
        .stock-btn.btn-minus:hover:not(:disabled) { background: #f1f5f9; }
        .stock-btn.btn-plus:hover:not(:disabled) { background: #6e8efb; color: white; }

        /* 비활성화 시 스타일 */
        .stock-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background-color: #f1f5f9;
            color: #94a3b8;
            border-color: #e2e8f0;
        }

        .stock-count { font-size: 16px; font-weight: 700; color: #1e293b; min-width: 20px; text-align: center; }
        .stock-label { font-size: 11px; color: #64748b; margin-top: 3px; }

        .manage-section { border-top: 1px solid #e2e8f0; padding-top: 16px; margin-top: 4px; }
        .manage-title { font-size: 13px; font-weight: 700; color: #1e293b; margin-bottom: 10px; }

        /* 폼 스타일 */
        .add-product-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .form-row { display: flex; gap: 8px; }
        .manage-input {
            flex: 1; padding: 9px 12px; border: 1px solid #e2e8f0;
            border-radius: 8px; font-size: 13px; font-family: 'Pretendard', sans-serif;
        }
        .manage-input:focus { outline: none; border-color: #6e8efb; }
        .add-btn {
            width: 100%;
            padding: 10px 14px;
            background: #6e8efb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .add-btn:hover { background: #5a7be0; }

        .remove-row { display: flex; gap: 8px; margin-top: 10px; }
        .manage-select {
            flex: 1; padding: 9px 12px; border: 1.5px solid #6e8efb;
            border-radius: 8px; font-size: 13px; font-family: 'Pretendard', sans-serif;
            background: white; color: #1e293b;
        }
        .remove-btn {
            padding: 9px 14px; background: white; color: #ef4444;
            border: 1.5px solid #6e8efb; border-radius: 8px; cursor: pointer;
            font-size: 13px; font-weight: 600; white-space: nowrap;
        }
        .remove-btn:hover { background: #fef2f2; }

        .map-panel {
            background: white; border-radius: 16px; padding: 20px;
            border: 1px solid #b0b8c4; flex: 1; overflow: hidden;
        }
        #mapCanvas {
            width: 100%; height: calc(100% - 36px);
            border-radius: 10px; background: #111; display: block;
        }

        .emergency-btn {
            width: 100%; padding: 16px; background: #fef2f2;
            border: 2px solid #f8a0a0; border-radius: 12px;
            color: #ef4444; font-size: 17px; font-weight: 700;
            cursor: pointer; flex-shrink: 0;
        }
        .emergency-btn:hover { background: #fee2e2; }
        .emergency-btn.active { background: #ef4444; color: white; border-color: #ef4444; }

        /* 문의 팝업 패널 */
        .inquiry-panel {
            position: fixed;
            top: 70px; right: 20px;
            width: 360px;
            background: white;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            z-index: 300;
            display: none;
            overflow: hidden;
            max-height: 500px;
            overflow-y: auto;
        }
        .inquiry-panel.show { display: block; }
        .inquiry-panel-header { padding: 16px 20px; border-bottom: 1px solid #e2e8f0; font-size: 15px; font-weight: 700; color: #1e293b; position: sticky; top: 0; background: white; }
        .inquiry-panel-item { padding: 16px 20px; border-bottom: 1px solid #f1f5f9; }
        .inquiry-panel-item:last-child { border-bottom: none; }
        .inquiry-panel-title { font-size: 14px; font-weight: 600; color: #1e293b; margin-bottom: 4px; }
        .inquiry-panel-content { font-size: 13px; color: #64748b; margin-top: 6px; line-height: 1.5; }
        .inquiry-panel-meta { font-size: 12px; color: #94a3b8; margin-top: 6px; }
        .inquiry-empty { padding: 30px; text-align: center; color: #94a3b8; font-size: 14px; }
        .secret-badge { background: #fef2f2; color: #ef4444; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-right: 4px; }
    </style>
</head>
<body>

<div class="sidebar-overlay" id="overlay"></div>

<div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
        <img src="/images/vending-logo.png" alt="PIMTO 로고">
        <span>관리자</span>
    </div>
    <ul class="sidebar-menu">
        <li><a href="#" class="active">📦 재고관리</a></li>
        <li><a href="/admin/statistics">📊 매출통계</a></li>
        <li><a href="#">👥 회원관리</a></li>
        <li><a href="#"><img src="/images/pimto.png" style="width:18px;height:18px;object-fit:contain;vertical-align:middle;"> 로봇관리</a></li>
        <li>
            <a href="/inquiry/list">
                💬 문의기능
                <span th:if="${inquiryCount > 0}" th:text="${inquiryCount}" class="menu-badge"></span>
            </a>
        </li>
    </ul>
</div>

<div class="header">
    <div class="header-left">
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <img src="/images/vending-logo.png" alt="PIMTO 로고">
        <span class="admin-label">관리자</span>
    </div>
    <div style="display:flex; align-items:center; gap:16px;">
        <!-- 문의 알림 아이콘 -->
        <div style="position:relative; cursor:pointer;" onclick="toggleInquiryPanel()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span th:if="${inquiryCount > 0}"
                  th:text="${inquiryCount}"
                  style="position:absolute; top:-6px; right:-6px; background:#ef4444; color:white; border-radius:50%; width:18px; height:18px; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;">
            </span>
        </div>
        <form th:action="@{/logout}" method="post">
            <button class="logout-btn" type="submit">로그아웃</button>
        </form>
    </div>
</div>

<!-- 문의 팝업 패널 -->
<div class="inquiry-panel" id="inquiryPanel">
    <div class="inquiry-panel-header">💬 문의 내역</div>
    <div th:if="${#lists.isEmpty(inquiries)}" class="inquiry-empty">문의 내역이 없어요.</div>
    <a th:each="inquiry : ${inquiries}" th:href="@{/inquiry/detail/{id}(id=${inquiry.id})}" class="inquiry-panel-item-link">
        <div class="inquiry-panel-item">
            <div class="inquiry-panel-title">
                <span th:if="${inquiry.secret}" class="secret-badge">🔒 비밀글</span>
                <span th:text="${inquiry.title}"></span>
            </div>
            <div class="inquiry-panel-content" th:text="${inquiry.content}"></div>
            <div class="inquiry-panel-meta">
                <span th:text="${inquiry.username}"></span> ·
                <span th:text="${#temporals.format(inquiry.createdAt, 'yyyy.MM.dd HH:mm')}"></span>
            </div>
        </div>
    </a>
</div>

<div class="wrapper">
    <div class="content">

        <div class="left-panel">
            <div class="panel-title">🥤 음료 재고 (DB 연동)</div>

            <div class="menu-grid" id="menuGrid">
                <div class="menu-item" th:each="product : ${products}" th:id="'item-' + ${product.id}">

                    <img th:if="${product.imageUrl != null and product.imageUrl != ''}" th:src="${product.imageUrl}" alt="상품 이미지">
                    <div class="no-img" th:if="${product.imageUrl == null or product.imageUrl == ''}">No Image</div>

                    <div class="menu-info">
                        <div class="name" th:text="${product.name}">상품명</div>
                        <div class="stock-control">

                            <form th:action="@{/admin/stock/update}" method="post" style="margin: 0; display: flex;">
                                <input type="hidden" name="productId" th:value="${product.id}">
                                <input type="hidden" name="amount" value="-1">
                                <button type="submit" class="stock-btn btn-minus" th:disabled="${product.stock <= 0}">−</button>
                            </form>

                            <span class="stock-count" th:text="${product.stock}">0</span>

                            <form th:action="@{/admin/stock/update}" method="post" style="margin: 0; display: flex;">
                                <input type="hidden" name="productId" th:value="${product.id}">
                                <input type="hidden" name="amount" value="1">
                                <button type="submit" class="stock-btn btn-plus" th:disabled="${product.stock >= 20}">+</button>
                            </form>

                        </div>
                        <div class="stock-label">개 남음</div>
                    </div>
                </div>

            </div>

            <div class="manage-section">
                <div class="manage-title">➕ 음료 추가 (DB 연동)</div>

                <form action="/admin/product/add" method="POST" class="add-product-form">
                    <input class="manage-input" type="text" name="name" placeholder="상품명 (예: 콜라)" required>
                    <div class="form-row">
                        <input class="manage-input" type="number" name="price" placeholder="가격 (예: 1500)" required>
                        <input class="manage-input" type="number" name="stock" placeholder="초기 재고 (예: 10)" required>
                    </div>
                    <input class="manage-input" type="text" name="imageUrl" placeholder="사진 경로 (예: /images/letsbe.jpg)">
                    <button class="add-btn" type="submit">상품 추가하기</button>
                </form>

                <div class="manage-title" style="margin-top: 14px;">➖ 음료 제거 (테스트용)</div>
                <div class="remove-row">
                    <select class="manage-select" id="removeDrinkSelect">
                        <option th:each="product : ${products}" th:value="${product.name}" th:text="${product.name}"></option>
                    </select>
                    <button class="remove-btn" onclick="removeDrink()">제거</button>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="map-panel">
                <div class="panel-title">
                    <img src="/images/pimto.png" style="width:20px;height:20px;object-fit:contain;">
                    PIMTO 현재 위치
                </div>
                <canvas id="mapCanvas"></canvas>
            </div>
            <button class="emergency-btn" id="emergencyBtn" onclick="emergencyCall()">🚨 긴급 호출</button>
        </div>

    </div>
</div>

<script>
    // 사이드바 hover 제어
    const hamburger = document.getElementById('hamburger');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    hamburger.addEventListener('mouseenter', () => {
        sidebar.classList.add('open');
        overlay.classList.add('show');
    });
    sidebar.addEventListener('mouseleave', () => {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
    });

    // 문의 패널 토글
    function toggleInquiryPanel() {
        document.getElementById('inquiryPanel').classList.toggle('show');
    }

    // 문의 패널 외부 클릭시 닫기
    document.addEventListener('click', (e) => {
        const panel = document.getElementById('inquiryPanel');
        if (!panel.contains(e.target) && !e.target.closest('[onclick="toggleInquiryPanel()"]')) {
            panel.classList.remove('show');
        }
    });

    // 음료 제거 (UI 테스트용 - 실제 삭제는 DB API 필요)

    function removeDrink() {
        const select = document.getElementById('removeDrinkSelect');
        const name = select.value;
        if (!name) return;
        alert('이 버튼은 현재 UI 테스트용입니다. 실제 삭제는 DB 연결이 필요합니다.');
    }

    // 지도 캔버스 및 긴급 호출 로직
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    const HOME = { x: 0.15, y: 0.5 };
    let robot = { x: 0.5, y: 0.5 };
    let isReturning = false;
    const robotImg = new Image();
    robotImg.src = '/images/pimto.png';

    function resizeCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        drawMap();
    }

    function drawMap() {
        const W = canvas.width, H = canvas.height;
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#111827';
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 1;
        for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
        for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 2;
        ctx.strokeRect(20, 20, W-40, H-40);
        ctx.beginPath();
        ctx.moveTo(W*0.4, 20); ctx.lineTo(W*0.4, H*0.6);
        ctx.moveTo(W*0.4, H*0.6); ctx.lineTo(W*0.7, H*0.6);
        ctx.stroke();

        const hx = HOME.x * W, hy = HOME.y * H;
        ctx.fillStyle = 'rgba(110,142,251,0.2)';
        ctx.beginPath(); ctx.arc(hx, hy, 20, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#6e8efb'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(hx, hy, 20, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = '#6e8efb';
        ctx.font = 'bold 11px Pretendard';
        ctx.textAlign = 'center';
        ctx.fillText('원위치', hx, hy+35);

        const rx = robot.x * W, ry = robot.y * H;
        if (isReturning) {
            ctx.strokeStyle = 'rgba(110,142,251,0.4)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([6,4]);
            ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(hx,hy); ctx.stroke();
            ctx.setLineDash([]);
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(rx, ry, 20, 0, Math.PI*2);
        ctx.clip();
        ctx.drawImage(robotImg, rx-20, ry-20, 40, 40);
        ctx.restore();

        ctx.fillStyle = isReturning ? '#f59e0b' : '#10b981';
        ctx.font = 'bold 11px Pretendard';
        ctx.textAlign = 'center';
        ctx.fillText(isReturning ? '복귀 중...' : '대기 중', rx, ry+36);
    }

    function emergencyCall() {
        const btn = document.getElementById('emergencyBtn');
        if (isReturning) return;
        isReturning = true;
        btn.classList.add('active');
        btn.textContent = '🔄 원위치 복귀 중...';
        function animate() {
            const dx = HOME.x - robot.x, dy = HOME.y - robot.y;
            if (Math.sqrt(dx*dx+dy*dy) < 0.01) {
                robot.x = HOME.x; robot.y = HOME.y;
                isReturning = false;
                btn.classList.remove('active');
                btn.textContent = '🚨 긴급 호출';
                drawMap(); return;
            }
            robot.x += dx * 0.02;
            robot.y += dy * 0.02;
            drawMap();
            requestAnimationFrame(animate);
        }
        animate();
    }

    robotImg.onload = () => drawMap();
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);
</script>

</body>
</html>

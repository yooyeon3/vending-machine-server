<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PIMTO - 관리자</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root {
            --bg: #faf8f4;
            --card-bg: #ffffff;
            --header-bg: #f2ede4;
            --primary-text: #3d2c1e;
            --sub-text: #5c4d40;
            --accent: #c47d4a;
            --border: #e8dfd4;
            --diamond: #3498db;
            --gold: #f1c40f;
            --silver: #bdc3c7;
            --bronze: #e67e22;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background: #e8dfd4; display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: var(--primary-text); }

        .header { background: var(--header-bg); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); flex-shrink: 0; position: relative; z-index: 100; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-left img { height: 34px; object-fit: contain; }
        .header-left .admin-label { font-size: 17px; font-weight: 700; color: var(--primary-text); }
        
        .logout-btn { padding: 8px 16px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--primary-text); font-weight: 700; }
        .logout-btn:hover { background: var(--border); }

        .hamburger { display: flex; flex-direction: column; justify-content: center; gap: 5px; width: 32px; height: 32px; cursor: pointer; padding: 4px; border-radius: 6px; transition: background 0.2s; }
        .hamburger span { display: block; width: 100%; height: 2px; background: var(--primary-text); border-radius: 2px; }

        .sidebar-overlay { position: fixed; inset: 0; background: rgba(61, 44, 30, 0.3); z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
        .sidebar-overlay.show { opacity: 1; pointer-events: all; }

        .sidebar { position: fixed; top: 0; left: 0; width: 220px; height: 100vh; background: #fff; border-right: 2px solid var(--border); z-index: 200; display: flex; flex-direction: column; transform: translateX(-100%); transition: transform 0.25s ease; box-shadow: 10px 0 30px rgba(0,0,0,0.05); }
        .sidebar.open { transform: translateX(0); }
        .sidebar-logo { display: flex; align-items: center; gap: 8px; padding: 20px; border-bottom: 1px solid var(--border); }
        .sidebar-logo span { font-size: 16px; font-weight: 800; color: var(--primary-text); }
        .sidebar-menu { list-style: none; padding: 10px 0; }
        .sidebar-menu a { display: flex; align-items: center; gap: 10px; padding: 14px 24px; font-size: 14px; font-weight: 600; color: var(--sub-text); text-decoration: none; border-left: 4px solid transparent; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background: var(--bg); color: var(--accent); border-left-color: var(--accent); }

        .wrapper { display: flex; flex: 1; overflow: hidden; background: #e8dfd4; }
        .content { flex: 1; display: flex; gap: 20px; padding: 20px 24px; overflow: hidden; }

        .left-panel { width: 40%; background: white; border-radius: 20px; padding: 25px; border: 1px solid var(--border); overflow-y: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .panel-title { font-size: 15px; font-weight: 800; color: var(--primary-text); margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }

        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 25px; }
        .menu-item { display: flex; flex-direction: column; align-items: center; padding: 15px; background: var(--bg); border-radius: 16px; border: 1.5px solid var(--border); }
        .menu-item img { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 10px; margin-bottom: 10px; background: white; padding: 8px; }
        
        .stock-btn { width: 28px; height: 28px; border: 1.5px solid var(--border); border-radius: 8px; background: white; cursor: pointer; font-size: 16px; font-weight: 800; color: var(--primary-text); }
        .stock-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
        .stock-count { font-size: 18px; font-weight: 800; min-width: 25px; text-align: center; }

        .manage-section { border-top: 2px solid var(--border); padding-top: 20px; margin-top: 10px; }
        .manage-input { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 13px; background: var(--bg); color: var(--primary-text); font-weight: 600; margin-bottom: 8px; }
        .add-btn { width: 100%; padding: 14px; background: var(--primary-text); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; }

        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .map-panel { background: white; border-radius: 20px; padding: 25px; border: 1px solid var(--border); flex: 1; display: flex; flex-direction: column; }
        #mapCanvas { flex: 1; border-radius: 15px; background: #2c3e50; border: 4px solid var(--border); }

        .emergency-btn { width: 100%; padding: 18px; background: #fff1f2; border: 2.5px solid #fca5a5; border-radius: 16px; color: #b91c1c; font-size: 18px; font-weight: 800; cursor: pointer; }
        .emergency-btn.active { background: #ef4444; color: white; border-color: #b91c1c; }

        .chat-panel { position:fixed; top:70px; right:20px; width:300px; height:500px; background:white; border-radius:20px; box-shadow:0 15px 50px rgba(61,44,30,0.15); z-index:500; display:none; flex-direction:column; overflow:hidden; border:2px solid var(--border); }
        .cp-header { background: var(--primary-text); color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; font-weight: 800; }
        .cp-chat-list { flex:1; overflow-y:auto; padding: 10px; }
        .cp-list-item { padding: 15px; border-bottom: 1px solid var(--bg); cursor: pointer; border-radius: 12px; transition: 0.2s; }
        .cp-list-item:hover { background: var(--bg); }
        .cp-messages { flex:1; overflow-y:auto; padding:15px; background: var(--bg); display: flex; flex-direction: column; gap: 10px; }
        .cp-bubble { padding: 10px 14px; border-radius: 15px; font-size: 13px; max-width: 85%; font-weight: 500; }
        .cp-bubble.mine { background: var(--primary-text); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .cp-bubble.user { background: white; color: var(--primary-text); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid var(--border); }
    </style>
</head>
<body>

<div class="sidebar-overlay" id="overlay"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-logo"><img src="/images/vending-logo.png" style="height:30px;"> <span>PIMTO ADMIN</span></div>
    <ul class="sidebar-menu">
        <li><a href="/admin" class="active">📦 재고관리</a></li>
        <li><a href="/admin/statistics">📊 매출통계</a></li>
        <li><a href="/admin/member">👥 회원관리</a></li>
        <li><a href="#">🤖 로봇관리</a></li>
    </ul>
</div>

<div class="header">
    <div class="header-left">
        <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
        <a href="/admin"><img src="/images/vending-logo.png" alt="PIMTO"></a>
        <span class="admin-label">관리자 대시보드</span>
    </div>
    <div style="display:flex; align-items:center; gap:20px;">
        <div onclick="toggleChatPanel()" style="position:relative; cursor:pointer;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--primary-text)" stroke-width="2.5">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span id="chatBadge" th:text="${chatCount}" th:style="${chatCount > 0} ? 'position:absolute;top:-6px;right:-6px;background:#ef4444;color:white;border-radius:50%;width:20px;height:20px;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;' : 'display:none'"></span>
        </div>
        <form th:action="@{/logout}" method="post"><button class="logout-btn" type="submit">LOGOUT</button></form>
    </div>
</div>

<div class="wrapper">
    <div class="content">
        <div class="left-panel">
            <div class="panel-title">🥤 실시간 상품 재고</div>
            <div class="menu-grid">
                <div class="menu-item" th:each="product : ${products}" th:id="'item-' + ${product.id}">
                    <img th:if="${product.imageUrl != null and product.imageUrl != ''}" th:src="${product.imageUrl}">
                    <div th:if="${product.imageUrl == null or product.imageUrl == ''}" style="width:100%; aspect-ratio:1; background:var(--border); border-radius:10px; display:flex; align-items:center; justify-content:center; color:var(--sub-text); font-size:12px;">NO_IMAGE</div>
                    <div style="text-align:center; width:100%; margin-top:10px;">
                        <div style="font-weight:700; margin-bottom:8px;" th:text="${product.name}">상품명</div>
                        <div style="display:flex; align-items:center; justify-content:center; gap:12px;">
                            <form th:action="@{/admin/stock/update}" method="post" style="display:inline;"><input type="hidden" name="productId" th:value="${product.id}"><input type="hidden" name="amount" value="-1"><button class="stock-btn" th:disabled="${product.stock <= 0}">−</button></form>
                            <span class="stock-count" th:text="${product.stock}">0</span>
                            <form th:action="@{/admin/stock/update}" method="post" style="display:inline;"><input type="hidden" name="productId" th:value="${product.id}"><input type="hidden" name="amount" value="1"><button class="stock-btn" style="color:var(--accent); border-color:var(--accent);">+</button></form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="manage-section">
                <div class="panel-title">➕ 새 상품 데이터 추가</div>
                <form action="/admin/product/add" method="POST">
                    <input class="manage-input" type="text" name="name" placeholder="상품명" required>
                    <div style="display:flex; gap:10px;"><input class="manage-input" type="number" name="price" placeholder="가격" required><input class="manage-input" type="number" name="stock" placeholder="초기 재고" required></div>
                    <input class="manage-input" type="text" name="imageUrl" placeholder="이미지 경로 (/images/...)">
                    <button class="add-btn" type="submit">시스템 데이터 등록</button>
                </form>
            </div>
        </div>

        <div class="right-panel">
            <div class="map-panel">
                <div class="panel-title">📍 PIMTO UNIT-01 실시간 위치</div>
                <canvas id="mapCanvas"></canvas>
            </div>
            <button class="emergency-btn" id="emergencyBtn" onclick="emergencyCall()">🚨 EMERGENCY_RECALL (원위치 복귀)</button>
        </div>
    </div>
</div>

<div id="chatPanel" class="chat-panel">
    <div id="cpScreenList" style="display:flex; flex-direction:column; height:100%;">
        <div class="cp-header"><span>고객 대화 목록</span><button onclick="toggleChatPanel()" style="background:none; border:none; color:#fff; cursor:pointer; font-size:20px;">✕</button></div>
        <div id="cpChatList" class="cp-chat-list"></div>
    </div>
    <div id="cpScreenChat" style="display:none; flex-direction:column; height:100%;">
        <div class="cp-header"><button onclick="showListScreen()" style="background:none; border:none; color:#fff; cursor:pointer; font-size:18px;">←</button><span id="cpChatTargetName"></span></div>
        <div id="cpMessages" class="cp-messages"></div>
        <div style="padding:15px; display:flex; gap:10px; border-top:1.5px solid var(--border); background:#fff;"><input id="cpInput" style="flex:1; padding:12px; border:1.5px solid var(--border); border-radius:25px; outline:none; font-size:13px;"><button onclick="cpSendAdminMessage()" style="padding:10px 20px; background:var(--primary-text); color:#fff; border:none; border-radius:20px; font-weight:700; cursor:pointer;">전송</button></div>
    </div>
</div>
<div id="chatPanelOverlay" style="position:fixed; inset:0; background:rgba(0,0,0,0.3); display:none; z-index:499;" onclick="toggleChatPanel()"></div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:inline="javascript">
    let cpStompClient = null, cpPanelOpen = false, cpCurrentUser = null;
    function toggleChatPanel() {
        cpPanelOpen = !cpPanelOpen;
        document.getElementById('chatPanel').style.display = cpPanelOpen ? 'flex' : 'none';
        document.getElementById('chatPanelOverlay').style.display = cpPanelOpen ? 'block' : 'none';
        if (cpPanelOpen) { showListScreen(); loadChatList(); }
    }
    function showListScreen() { document.getElementById('cpScreenList').style.display = 'flex'; document.getElementById('cpScreenChat').style.display = 'none'; cpCurrentUser = null; }
    function loadChatList() {
        fetch('/api/chat/list').then(r => r.json()).then(list => {
            const container = document.getElementById('cpChatList');
            container.innerHTML = list.length === 0 ? '<div style="padding:40px; text-align:center; color:var(--sub-text);">진행 중인 채팅이 없습니다.</div>' : 
                list.map(item => `<div onclick="showChatScreen('${item.username}')" class="cp-list-item"><strong>${item.username} 오퍼레이터</strong><div style="font-size:12px; color:var(--sub-text); margin-top:5px;">${item.lastMessage || '대화 없음'}</div></div>`).join('');
        });
    }
    function showChatScreen(username) {
        cpCurrentUser = username;
        document.getElementById('cpScreenList').style.display = 'none';
        document.getElementById('cpScreenChat').style.display = 'flex';
        document.getElementById('cpChatTargetName').textContent = username + '님과 대화';
        loadChatHistory(username);
    }
    function loadChatHistory(username) {
        fetch('/api/chat/history/' + username).then(r => r.json()).then(msgs => {
            const container = document.getElementById('cpMessages');
            container.innerHTML = msgs.map(msg => `<div class="cp-bubble ${msg.fromAdmin ? 'mine' : 'user'}">${msg.content}</div>`).join('');
            container.scrollTop = container.scrollHeight;
        });
    }
    function cpSendAdminMessage() {
        const input = document.getElementById('cpInput'), content = input.value.trim();
        if (!content || !cpCurrentUser) return;
        cpStompClient.send('/app/chat/admin/send', {}, JSON.stringify({content, targetUsername: cpCurrentUser}));
        loadChatHistory(cpCurrentUser);
        input.value = '';
    }
    (function connectWS() {
        const socket = new SockJS('/ws'); cpStompClient = Stomp.over(socket); cpStompClient.debug = null;
        cpStompClient.connect({}, () => {
            cpStompClient.subscribe('/user/queue/chat', frame => {
                const msg = JSON.parse(frame.body);
                if (cpCurrentUser === msg.userUsername) loadChatHistory(cpCurrentUser);
                else loadChatList();
            });
        });
    })();

    const hamburger = document.getElementById('hamburger'), sidebar = document.getElementById('sidebar'), overlay = document.getElementById('overlay');
    hamburger.addEventListener('click', () => { sidebar.classList.add('open'); overlay.classList.add('show'); });
    overlay.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.classList.remove('show'); });

    const canvas = document.getElementById('mapCanvas'), ctx = canvas.getContext('2d');
    const HOME = { x: 0.15, y: 0.5 }; let robot = { x: 0.5, y: 0.5 }, isReturning = false;
    function draw() {
        const W = canvas.width = canvas.offsetWidth, H = canvas.height = canvas.offsetHeight;
        ctx.fillStyle = '#1e293b'; ctx.fillRect(0,0,W,H);
        ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1;
        for(let i=0; i<W; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
        ctx.fillStyle = '#c47d4a'; ctx.beginPath(); ctx.arc(robot.x*W, robot.y*H, 15, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Pretendard'; ctx.textAlign = 'center'; ctx.fillText('PIMTO', robot.x*W, robot.y*H + 30);
    }
    function emergencyCall() {
        if(isReturning) return; isReturning = true; document.getElementById('emergencyBtn').classList.add('active');
        function anim() {
            const dx = HOME.x - robot.x, dy = HOME.y - robot.y;
            if(Math.sqrt(dx*dx+dy*dy) < 0.01) { isReturning = false; document.getElementById('emergencyBtn').classList.remove('active'); return; }
            robot.x += dx * 0.05; robot.y += dy * 0.05; draw(); requestAnimationFrame(anim);
        }
        anim();
    }
    window.addEventListener('resize', draw); draw();
</script>
</body>
</html>

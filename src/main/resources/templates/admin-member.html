<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PIMTO CRM - 회원 고도화 관리</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root {
            --bg: #faf8f4;
            --card-bg: #ffffff;
            --header-bg: #f2ede4;
            --primary-text: #3d2c1e;
            --sub-text: #9e8c7a;
            --accent: #c47d4a;
            --border: #e8dfd4;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --diamond: #3498db;
            --gold: #f1c40f;
            --silver: #bdc3c7;
            --bronze: #e67e22;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--primary-text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .header { background: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 100; box-shadow: 0 1px 3px rgba(61,44,30,0.02); }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .header-left img { height: 38px; }
        .admin-label { font-size: 18px; font-weight: 800; color: var(--primary-text); letter-spacing: -0.5px; }

        .wrapper { display: flex; flex: 1; overflow: hidden; }

        /* 대시보드 네비게이션 프리미엄 스타일 */
        .dash-nav-link { position: relative; text-decoration: none; color: var(--sub-text); font-weight: 700; font-size: 16px; letter-spacing: -0.3px; padding: 5px 0; transition: color 0.3s ease; }
        .dash-nav-link:hover, .dash-nav-link.active { color: var(--primary-text); }
        .dash-nav-link::after { content: ''; position: absolute; bottom: -2px; left: 50%; width: 0; height: 2px; background: var(--accent); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-50%); border-radius: 2px; }
        .dash-nav-link:hover::after, .dash-nav-link.active::after { width: 100%; }
        
        .header-center { display: flex; justify-content: center; align-items: center; gap: 40px; flex: 2; }
        .header-right { display: flex; align-items: center; justify-content: flex-end; gap: 20px; flex: 1; }

        .content { flex: 1; padding: 32px; overflow-y: auto; display: flex; flex-direction: column; gap: 32px; }

        /* 통계 섹션 */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
        .stat-card { background: white; padding: 24px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(61,44,30,0.03); position: relative; overflow: hidden; }
        .stat-card::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent); opacity: 0.8; }
        .stat-label { font-size: 13px; color: var(--sub-text); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; display: block; }
        .stat-value { font-size: 28px; font-weight: 800; color: var(--primary-text); }
        .stat-sub { font-size: 12px; color: var(--success); margin-top: 6px; font-weight: 600; }

        /* 메인 테이블 구역 */
        .member-container { background: white; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 10px 25px -5px rgba(61,44,30,0.05); overflow: hidden; display: flex; flex-direction: column; }
        .table-header { padding: 24px 32px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .search-wrapper { position: relative; width: 400px; }
        .search-input { width: 100%; padding: 14px 16px 14px 44px; border: 1px solid var(--border); border-radius: 14px; font-size: 14px; outline: none; transition: 0.2s; background: var(--bg); }
        .search-input:focus { border-color: var(--accent); background: white; box-shadow: 0 0 0 4px rgba(196, 125, 74, 0.1); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--sub-text); }

        .filter-group { display: flex; gap: 8px; }
        .filter-btn { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border); background: white; font-size: 13px; font-weight: 600; color: var(--sub-text); cursor: pointer; transition: 0.2s; }
        .filter-btn:hover { background: var(--bg); color: var(--primary-text); }
        .filter-btn.active { background: var(--primary-text); color: white; border-color: var(--primary-text); }

        table { width: 100%; border-collapse: collapse; }
        th { background: var(--bg); padding: 18px 32px; font-size: 12px; font-weight: 700; color: var(--sub-text); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); text-align: left; }
        td { padding: 20px 32px; border-bottom: 1px solid #f2ede4; font-size: 14px; vertical-align: middle; transition: background 0.2s; }  
        tr:hover td { background: var(--header-bg); }

        /* 회원 정보 셀 */
        .user-cell { display: flex; align-items: center; gap: 16px; }
        .avatar { width: 44px; height: 44px; border-radius: 14px; background: var(--header-bg); border: 1px solid var(--border); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; }
        .user-meta { display: flex; flex-direction: column; gap: 2px; }
        .name { font-weight: 700; color: var(--primary-text); font-size: 15px; }
        .username { font-size: 12px; color: var(--sub-text); }

        /* 등급 배지 */
        .grade-badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; color: white; }
        .grade-diamond { background: var(--diamond); }
        .grade-gold { background: var(--gold); }
        .grade-silver { background: var(--silver); }
        .grade-bronze { background: var(--bronze); }

        /* 활동 지수 */
        .score-info { display: flex; flex-direction: column; gap: 6px; width: 120px; }
        .score-label { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--sub-text); }
        .score-bar-bg { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
        .score-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 1s ease-out; }

        .spent-val { font-weight: 800; color: var(--primary-text); font-family: 'Monaco', monospace; }
        .date-val { font-size: 12px; color: var(--sub-text); }

        .memo-indicator { color: var(--warning); font-size: 16px; cursor: help; margin-left: 4px; }

        .actions { display: flex; gap: 8px; }
        .action-icon { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: white; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; color: var(--sub-text); }
        .action-icon:hover { background: var(--bg); color: var(--accent); border-color: var(--accent); }
        .action-icon.delete:hover { color: var(--danger); border-color: var(--danger); background: #fef2f2; }

        /* 고도화된 모달 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(61, 44, 30, 0.4); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal { background: white; width: 100%; max-width: 500px; border-radius: 32px; box-shadow: 0 25px 50px -12px rgba(61,44,30,0.25); overflow: hidden; animation: modalSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes modalSlide { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-header { padding: 32px 32px 20px; display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 22px; font-weight: 800; color: var(--primary-text); }
        .modal-body { padding: 0 32px 32px; display: flex; flex-direction: column; gap: 20px; }

        .form-field { display: flex; flex-direction: column; gap: 8px; }
        .form-field label { font-size: 13px; font-weight: 700; color: var(--sub-text); }
        .form-input { padding: 14px; border: 1.5px solid var(--border); border-radius: 14px; font-size: 14px; font-family: inherit; transition: 0.2s; outline: none; background: var(--bg); }
        .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(196, 125, 74, 0.1); background: white; }
        .form-textarea { height: 120px; resize: none; }

        .modal-footer { padding: 20px 32px 32px; display: flex; gap: 12px; }
        .btn { flex: 1; padding: 16px; border-radius: 16px; font-weight: 700; font-size: 15px; cursor: pointer; border: none; transition: 0.2s; }
        .btn-secondary { background: var(--border); color: var(--sub-text); }
        .btn-secondary:hover { background: #dcd4c9; color: var(--primary-text); }
        .btn-primary { background: var(--primary-text); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(61,44,30,0.1); }

        .text-diamond { color: var(--diamond); }
        .text-gold { color: var(--gold); }
        .text-silver { color: var(--silver); }
        .text-bronze { color: var(--bronze); }

        .table-responsive { width: 100%; overflow-x: auto; }

        @media (max-width: 900px) {
            .wrapper { flex-direction: column; overflow-y: auto; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .content { overflow-y: visible; }
        }

        @media (max-width: 600px) {
            .header { padding: 12px 16px; flex-direction: column; align-items: flex-start; gap: 10px; }
            .admin-label { display: none; }
            .content { padding: 16px; gap: 20px; }
            .stats-grid { grid-template-columns: 1fr; }
            .table-header { flex-direction: column; gap: 15px; align-items: flex-start; padding: 16px; }
            .search-wrapper { width: 100%; }
            .filter-group { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left" style="flex: 1;">
        <a href="/admin" style="display:flex; align-items:center; gap:8px; text-decoration:none;">
            <img src="/images/vending-logo.png" alt="PIMTO">
            <span class="admin-label">관리자</span>
        </a>
    </div>
    <div class="header-center">
        <a href="/admin" class="dash-nav-link">재고관리</a>
        <a href="/admin/statistics" class="dash-nav-link">매출통계</a>
        <a href="/admin/member" class="dash-nav-link active">회원관리</a>
        <a href="/admin/robot-control" class="dash-nav-link">로봇관리</a>
    </div>
    <div class="header-right" style="flex: 1; justify-content: flex-end;">
        <span style="font-size: 13px; font-weight: 600; color: var(--sub-text);">관리자 모드 활성됨</span>
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <button class="btn-secondary" style="padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; border: none; cursor: pointer; background: var(--border); color: var(--sub-text);">로그아웃</button>
        </form>
    </div>
</div>

<div class="wrapper">

    <div class="content">
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">전체 가입 고객</span>
                <div class="stat-value" th:text="${totalCount} + '명'">0명</div>
                <div class="stat-sub">현재 등록된 총 회원 수</div>
            </div>
            <div class="stat-card">
                <span class="stat-label">다이아몬드 고객</span>
                <div class="stat-value" th:text="${diamondCount} + '명'">0명</div>
                <div class="stat-sub" style="color: var(--diamond)">PIMTO 최우수 고객</div>
            </div>
            <div class="stat-card">
                <span class="stat-label">고객 총 결제액</span>
                <div class="stat-value" th:text="${#numbers.formatInteger(totalRevenue, 0, 'COMMA')} + '원'">0원</div>
                <div class="stat-sub">회원들이 구매한 전체 합계</div>
            </div>
            <div class="stat-card">
                <span class="stat-label">이번 주 이용 비중</span>
                <div class="stat-value">94.2%</div>
                <div class="stat-sub">최근 활발히 이용 중인 고객</div>
            </div>
        </div>

        <div class="member-container">
            <div class="table-header">
                <div class="search-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="memberSearch" placeholder="고객명, 아이디, 연락처로 찾기..." onkeyup="filterMembers()">
                </div>
                <div class="filter-group">
                    <button class="filter-btn active" onclick="filterByGrade('ALL')">전체보기</button>
                    <button class="filter-btn" onclick="filterByGrade('DIAMOND')">다이아몬드</button>
                    <button class="filter-btn" onclick="filterByGrade('GOLD')">골드</button>
                    <button class="filter-btn" onclick="filterByGrade('SILVER')">실버</button>
                    <button class="filter-btn" onclick="filterByGrade('BRONZE')">브론즈</button>
                </div>
            </div>
            <div class="table-responsive">
                <table id="memberTable">
                    <thead>
                        <tr>
                            <th>고객 정보</th>
                            <th>현재 등급</th>
                            <th>단골 점수 (활동)</th>
                            <th>누적 이용 금액</th>
                            <th>첫 가입일</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="stat : ${members}" th:data-grade="${stat.grade}">
                            <td>
                                <div class="user-cell">
                                    <div class="avatar" th:text="${stat.info.name != null and !stat.info.name.isEmpty() ? #strings.substring(stat.info.name, 0, 1) : '?'}">홍</div>
                                    <div class="user-meta">
                                        <div class="name">
                                            <span th:text="${stat.info.name}">홍길동</span>
                                            <span th:if="${stat.info.adminMemo != null and !stat.info.adminMemo.isEmpty()}"
                                                  class="memo-indicator" th:title="${stat.info.adminMemo}">📝</span>
                                        </div>
                                        <div class="username" th:text="${stat.info.username}">user123</div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span th:class="'grade-badge grade-' + ${stat.grade.toLowerCase()}" th:text="${stat.grade == 'DIAMOND' ? '다이아몬드' : (stat.grade == 'GOLD' ? '골드' : (stat.grade == 'SILVER' ? '실버' : '브론즈'))}">일반</span>
                            </td>
                            <td>
                                <div class="score-info">
                                    <div class="score-label">
                                        <span>활동 지수</span>
                                        <span th:text="${stat.activityScore} + '점'">0점</span>
                                    </div>
                                    <div class="score-bar-bg">
                                        <div class="score-bar-fill" th:style="'width: ' + ${stat.activityScore > 100 ? 100 : stat.activityScore} + '%'"></div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="spent-val" th:text="${#numbers.formatInteger(stat.totalSpent, 0, 'COMMA')} + '원'">0원</div>        
                                <div style="font-size: 11px; color: var(--text-sub);" th:text="'총 ' + ${stat.purchaseCount} + '회 주문'">0회 주문</div>
                            </td>
                            <td>
                                <div class="date-val" th:text="${stat.info.createdAt != null ? #temporals.format(stat.info.createdAt, 'yyyy.MM.dd') : '-'}">2026.06.16</div>
                            </td>
                            <td>
                                <div class="actions">
                                    <div class="action-icon" 
                                         th:data-id="${stat.info.id}"
                                         th:data-name="${stat.info.name}"
                                         th:data-phone="${stat.info.phoneNumber}"
                                         th:data-memo="${stat.info.adminMemo != null ? stat.info.adminMemo : ''}"
                                         onclick="openRichModal(this.getAttribute('data-id'), this.getAttribute('data-name'), this.getAttribute('data-phone'), this.getAttribute('data-memo'))" 
                                         title="정보 수정">
                                        ⚙️
                                    </div>
                                    <div class="action-icon delete" 
                                         th:if="${stat.info.username != 'admin'}" 
                                         th:data-id="${stat.info.id}"
                                         onclick="deleteMember(this.getAttribute('data-id'))" 
                                         title="회원 탈퇴">
                                        🗑️
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 고도화된 회원 정보 모달 -->
<div class="modal-overlay" id="richModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">고객 상세 관리</div>
            <div style="cursor: pointer; font-size: 20px; color: var(--sub-text);" onclick="closeRichModal()">✕</div>
        </div>
        <form id="editForm" action="/admin/member/update" method="post">
            <div class="modal-body">
                <input type="hidden" name="id" id="editId">
                <div class="form-field">
                    <label>고객 성함</label>
                    <input type="text" name="name" id="editName" class="form-input" placeholder="이름 입력" required>
                </div>
                <div class="form-field">
                    <label>휴대폰 번호</label>
                    <input type="text" name="phoneNumber" id="editPhone" class="form-input" placeholder="010-0000-0000" required>
                </div>
                <div class="form-field">
                    <label>관리자 비공개 메모 (중요 사항)</label>
                    <textarea name="adminMemo" id="editMemo" class="form-input form-textarea" placeholder="고객에 대한 특이사항이나 관리 메모를 남겨주세요."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeRichModal()">창 닫기</button>
                <button type="submit" class="btn btn-primary">수정 내용 저장</button>
            </div>
        </form>
    </div>
</div>

<script>
    function filterMembers() {
        const input = document.getElementById('memberSearch');
        const filter = input.value.toLowerCase();
        const table = document.getElementById('memberTable');
        const tr = table.getElementsByTagName('tr');

        for (let i = 1; i < tr.length; i++) {
            const nameTd = tr[i].getElementsByClassName('name')[0];
            const idTd = tr[i].getElementsByClassName('username')[0];
            const phoneTd = tr[i].getElementsByTagName('td')[1];

            const text = tr[i].innerText.toLowerCase();
            if (text.indexOf(filter) > -1) {
                tr[i].style.display = "";
            } else {
                tr[i].style.display = "none";
            }
        }
    }

    function filterByGrade(grade) {
        const tr = document.getElementById('memberTable').getElementsByTagName('tr');
        const btns = document.querySelectorAll('.filter-btn');

        btns.forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');

        for (let i = 1; i < tr.length; i++) {
            if (grade === 'ALL' || tr[i].getAttribute('data-grade') === grade) {
                tr[i].style.display = "";
            } else {
                tr[i].style.display = "none";
            }
        }
    }

    function openRichModal(id, name, phone, memo) {
        document.getElementById('editId').value = id;
        document.getElementById('editName').value = name;
        document.getElementById('editPhone').value = phone;
        document.getElementById('editMemo').value = memo;
        document.getElementById('richModal').classList.add('show');
    }

    function closeRichModal() {
        document.getElementById('richModal').classList.remove('show');
    }

    function deleteMember(id) {
        if (confirm('🚨 경고: 해당 회원을 시스템에서 완전히 제거하시겠습니까?\n모든 활동 데이터가 삭제됩니다.')) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/admin/member/delete/' + id;
            document.body.appendChild(form);
            form.submit();
        }
    }

    window.onload = () => {
        const bars = document.querySelectorAll('.score-bar-fill');
        bars.forEach(bar => {
            const width = bar.style.width;
            bar.style.width = '0%';
            setTimeout(() => {
                bar.style.width = width;
            }, 100);
        });
    };
</script>

</body>
</html>

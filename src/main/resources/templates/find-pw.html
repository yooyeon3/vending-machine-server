<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIMTO - 비밀번호 찾기</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Pretendard', sans-serif;
            background-color: #faf8f4; /* 따뜻한 크림 배경 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 0;
            position: relative;
        }

        .top-left-logo {
            position: absolute;
            top: 30px;
            left: 40px;
            height: 45px;
        }

        .container {
            background-color: #ffffff;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(61, 44, 30, 0.05);
            width: 100%;
            max-width: 440px;
            text-align: center;
            border: 1px solid #e8dfd4;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: 2px;
            color: #3d2c1e;
        }

        .brand-subtitle {
            font-size: 15px;
            color: #9e8c7a;
            margin-bottom: 40px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #3d2c1e;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e8dfd4;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background-color: #faf8f4;
            color: #3d2c1e;
        }

        .input-group input:focus {
            border-color: #c47d4a;
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(196, 125, 74, 0.1);
        }

        .submit-button {
            width: 100%;
            padding: 15px;
            background: #3d2c1e;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.3s ease;
            margin-top: 10px;
        }

        .submit-button:hover {
            opacity: 0.9;
        }

        .extra-links {
            margin-top: 25px;
            font-size: 14px;
            color: #9e8c7a;
        }

        .extra-links a {
            color: #c47d4a;
            text-decoration: none;
            font-weight: 600;
            margin: 0 8px;
        }

        .error-message {
            color: #ef4444;
            background-color: #fef2f2;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            border: 1px solid #fecaca;
        }

        .info-box {
            background-color: #f2ede4;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid #e8dfd4;
            text-align: left;
            font-size: 14px;
            color: #3d2c1e;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .step-container { animation: fadeIn 0.5s ease; }
    </style>
</head>
<body>

<a href="/">
    <img th:src="@{/images/vending-logo.png}" alt="PIMTO Logo" class="top-left-logo">
</a>

<div class="container">
    <div class="brand-title">비밀번호 찾기</div>

    <!-- 1단계: 본인 확인 폼 -->
    <div th:if="${step == null}" class="step-container">
        <div class="brand-subtitle">계정 정보와 전화번호를 확인합니다.</div>
        <div th:if="${error}" class="error-message" th:text="${error}"></div>

        <form th:action="@{/find-pw/verify}" method="post">
            <div class="input-group">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required>
            </div>

            <div class="input-group">
                <label for="phoneNumber">전화번호</label>
                <input type="text" id="phoneNumber" name="phoneNumber" placeholder="010-0000-0000" required>
            </div>

            <button type="submit" class="submit-button">본인 확인하기</button>
        </form>
    </div>

    <!-- 2단계: 새 비밀번호 재설정 폼 -->
    <div th:if="${step == 2}" class="step-container">
        <div class="brand-subtitle">본인 확인 완료! 새로운 비밀번호를 설정하세요.</div>
        <div class="info-box">
            인증된 아이디: <strong th:text="${verifiedUsername}">아이디</strong>
        </div>

        <form th:action="@{/find-pw/reset}" method="post">
            <!-- 정보 유지를 위한 hidden 필드 -->
            <input type="hidden" name="username" th:value="${verifiedUsername}">
            <input type="hidden" name="phoneNumber" th:value="${verifiedPhone}">

            <div class="input-group">
                <label for="newPassword">새 비밀번호</label>
                <input type="password" id="newPassword" name="newPassword" placeholder="8~20자 영문+숫자 조합" required>
            </div>

            <div class="input-group">
                <label for="confirmPassword">비밀번호 확인</label>
                <input type="password" id="confirmPassword" placeholder="다시 한번 입력하세요" required>
            </div>

            <button type="submit" class="submit-button">비밀번호 변경하기</button>
        </form>
    </div>

    <div class="extra-links">
        <a href="/login">로그인으로 돌아가기</a>
    </div>
</div>

<script>
    // 전화번호 하이픈 자동 삽입
    const phoneInput = document.getElementById('phoneNumber');
    if (phoneInput) {
        phoneInput.addEventListener('input', (e) => {
            let val = e.target.value.replace(/[^0-9]/g, '');
            if (val.length > 3 && val.length <= 7) {
                val = val.slice(0, 3) + '-' + val.slice(3);
            } else if (val.length > 7) {
                val = val.slice(0, 3) + '-' + val.slice(3, 7) + '-' + val.slice(7, 11);
            }
            e.target.value = val;
        });
    }

    // 비밀번호 일치 확인 (2단계 폼이 있을 때만)
    const resetForm = document.querySelector('form[action$="/reset"]');
    if (resetForm) {
        resetForm.addEventListener('submit', (e) => {
            const pw = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (pw !== confirm) {
                e.preventDefault();
                alert('비밀번호가 일치하지 않습니다.');
            }
        });
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>PIMTO - 로그인</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        /* 전역 설정 */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Pretendard', sans-serif;
            background-color: #faf8f4; /* 따뜻한 크림 배경 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }

        /* 좌측 상단 로고 설정 */
        .top-left-logo {
            position: absolute;
            top: 30px;
            left: 40px;
            height: 45px;
            transition: opacity 0.3s ease;
        }

        .top-left-logo:hover {
            opacity: 0.8;
        }

        /* 로그인 컨테이너 */
        .login-container {
            background-color: #ffffff;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(61, 44, 30, 0.05);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #e8dfd4;
        }

        /* PIMTO 로고/타이틀 (Solid Color) */
        .brand-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: 2px;
            color: #3d2c1e; /* 커피 브라운 */
        }

        .brand-subtitle {
            font-size: 16px;
            color: #9e8c7a; /* 샌드 베이지 */
            margin-bottom: 40px;
        }

        /* 입력 그룹 */
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #3d2c1e;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e8dfd4;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background-color: #faf8f4;
            color: #3d2c1e;
        }

        .input-group input:focus {
            border-color: #c47d4a;
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(196, 125, 74, 0.1);
        }

        /* 로그인 버튼 */
        .login-button {
            width: 100%;
            padding: 15px;
            background: #3d2c1e;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.3s ease;
            margin-top: 10px;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        /* 하단 링크 */
        .extra-links {
            margin-top: 25px;
            font-size: 14px;
            color: #9e8c7a;
        }

        .extra-links a {
            color: #c47d4a;
            text-decoration: none;
            font-weight: 600;
            margin: 0 8px;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #ef4444;
            background-color: #fef2f2;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            border: 1px solid #fecaca;
        }

        @media (max-width: 500px) {
            .login-container { padding: 40px 25px; border-radius: 0; box-shadow: none; border: none; }
            body { background-color: #ffffff; padding: 0; }
            .top-left-logo { top: 20px; left: 20px; height: 35px; }
        }
    </style>
</head>
<body>

<a href="/">
    <img th:src="@{/images/vending-logo.png}" alt="PIMTO Logo" class="top-left-logo">
</a>

<div class="login-container">
    <div class="brand-title">PIMTO</div>
    <div class="brand-subtitle">나만의 스마트 자판기 플랫폼</div>

    <div th:if="${param.error}" class="error-message">
        아이디 또는 비밀번호가 올바르지 않습니다.
    </div>

    <div th:if="${param.resetSuccess}" class="error-message" style="color: #059669; background-color: #ecfdf5; border-color: #a7f3d0;">
        비밀번호가 성공적으로 변경되었습니다.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="input-group">
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required autofocus>
        </div>

        <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
        </div>

        <button type="submit" class="login-button">로그인</button>
    </form>
    <div class="extra-links">
        <a href="/find-id">아이디 찾기</a> |
        <a href="/find-pw">비밀번호 찾기</a> |
        <a href="/signup">회원가입</a>
    </div>
</div>

</body>
</html>

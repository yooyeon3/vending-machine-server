<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIMTO - 회원가입</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        /* 전역 설정 */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 0;
            position: relative;
        }

        /* 좌측 상단 로고 설정 */
        .top-left-logo {
            position: absolute;
            top: 30px;
            left: 40px;
            height: 45px;
            transition: opacity 0.3s ease;
        }

        .top-left-logo:hover {
            opacity: 0.8;
        }

        /* 회원가입 컨테이너 */
        .signup-container {
            background-color: #ffffff;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(148, 163, 184, 0.15);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 15px;
            color: #64748b;
            margin-bottom: 40px;
        }

        /* 입력 그룹 */
        .input-group {
            text-align: left;
            margin-bottom: 18px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }

        .input-group input:focus {
            border-color: #6e8efb;
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(110, 142, 251, 0.1);
        }

        .input-group input.invalid {
            border-color: #ef4444;
            background-color: #fffafb;
        }

        .input-group input.invalid:focus {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        /* 에러 메시지 */
        .error-msg {
            font-size: 12px;
            color: #ef4444;
            margin-top: 5px;
            padding-left: 4px;
            min-height: 18px;
            display: none;
        }

        /* 회원가입 버튼 */
        .signup-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .signup-button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .signup-button:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            transform: none;
            opacity: 1;
        }

        /* 하단 링크 */
        .extra-links {
            margin-top: 25px;
            font-size: 14px;
            color: #64748b;
        }

        .extra-links a {
            color: #6e8efb;
            text-decoration: none;
            font-weight: 600;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .signup-container {
                padding: 40px 25px;
                border-radius: 0;
                box-shadow: none;
            }
            body {
                background-color: #ffffff;
                padding: 0;
            }
            .top-left-logo {
                top: 20px;
                left: 20px;
                height: 35px;
            }
        }
    </style>
</head>
<body>

<a href="/">
    <img th:src="@{/images/vending-logo.png}" alt="PIMTO Logo" class="top-left-logo">
</a>

<div class="signup-container">
    <div class="brand-title">회원가입</div>
    <div class="brand-subtitle">PIMTO의 새로운 가족이 되어주세요!</div>

    <div th:if="${error}" class="error-msg" style="display: block; margin-bottom: 20px; padding: 12px; background-color: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; text-align: center;">
        <span th:text="${error}">에러 메시지</span>
    </div>

    <form id="signupForm" th:action="@{/signup}" method="post" th:object="${member}">
        <div class="input-group">
            <label for="username">아이디</label>
            <input type="text" id="username" th:field="*{username}" placeholder="4~20자 영문, 숫자 조합" required>
            <div id="usernameError" class="error-msg">아이디는 4~20자의 영문과 숫자만 가능합니다.</div>
        </div>

        <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" th:field="*{password}" placeholder="8~20자 영문+숫자 조합" required>
            <div id="passwordError" class="error-msg">비밀번호는 8~20자의 영문과 숫자를 포함해야 합니다.</div>
        </div>

        <div class="input-group">
            <label for="confirmPassword">비밀번호 확인</label>
            <input type="password" id="confirmPassword" placeholder="비밀번호를 한번 더 입력하세요" required>
            <div id="confirmPasswordError" class="error-msg">비밀번호가 일치하지 않습니다.</div>
        </div>

        <div class="input-group">
            <label for="name">이름</label>
            <input type="text" id="name" th:field="*{name}" placeholder="이름을 입력하세요" required>
            <div id="nameError" class="error-msg">이름을 입력해주세요.</div>
        </div>

        <div class="input-group">
            <label for="phoneNumber">전화번호</label>
            <input type="text" id="phoneNumber" th:field="*{phoneNumber}" placeholder="010-0000-0000" required>
            <div id="phoneNumberError" class="error-msg">올바른 전화번호 형식이 아닙니다.</div>
        </div>

        <button type="submit" id="submitBtn" class="signup-button">가입하기</button>
    </form>

    <div class="extra-links">
        이미 계정이 있으신가요? <a href="/login">로그인하기</a>
    </div>
</div>

<script>
    const signupForm = document.getElementById('signupForm');
    const submitBtn = document.getElementById('submitBtn');

    const fields = {
        username: {
            el: document.getElementById('username'),
            errorEl: document.getElementById('usernameError'),
            validate: (val) => /^[a-zA-Z0-9]{4,20}$/.test(val)
        },
        password: {
            el: document.getElementById('password'),
            errorEl: document.getElementById('passwordError'),
            validate: (val) => /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,20}$/.test(val)
        },
        confirmPassword: {
            el: document.getElementById('confirmPassword'),
            errorEl: document.getElementById('confirmPasswordError'),
            validate: (val) => val === document.getElementById('password').value
        },
        name: {
            el: document.getElementById('name'),
            errorEl: document.getElementById('nameError'),
            validate: (val) => val.trim().length > 0
        },
        phoneNumber: {
            el: document.getElementById('phoneNumber'),
            errorEl: document.getElementById('phoneNumberError'),
            validate: (val) => /^010-\d{3,4}-\d{4}$/.test(val)
        }
    };

    function validateField(fieldName) {
        const field = fields[fieldName];
        const isValid = field.validate(field.el.value);
        
        if (!isValid && field.el.value.length > 0) {
            field.el.classList.add('invalid');
            field.errorEl.style.display = 'block';
        } else {
            field.el.classList.remove('invalid');
            field.errorEl.style.display = 'none';
        }
        
        checkFormValidity();
    }

    function checkFormValidity() {
        let isAllValid = true;
        for (const key in fields) {
            if (!fields[key].validate(fields[key].el.value)) {
                isAllValid = false;
                break;
            }
        }
        submitBtn.disabled = !isAllValid;
    }

    // 초기 상태 체크
    checkFormValidity();

    // 이벤트 리스너 등록
    Object.keys(fields).forEach(key => {
        fields[key].el.addEventListener('input', () => validateField(key));
        fields[key].el.addEventListener('blur', () => validateField(key));
    });

    // 비밀번호가 바뀌면 확인 비밀번호도 다시 체크
    fields.password.el.addEventListener('input', () => {
        if (fields.confirmPassword.el.value.length > 0) {
            validateField('confirmPassword');
        }
    });

    // 폼 제출 시 최종 체크
    signupForm.addEventListener('submit', (e) => {
        let isAllValid = true;
        for (const key in fields) {
            if (!fields[key].validate(fields[key].el.value)) {
                validateField(key);
                isAllValid = false;
            }
        }
        
        if (!isAllValid) {
            e.preventDefault();
            alert('입력 양식을 다시 확인해주세요.');
        }
    });

    // 전화번호 자동 하이픈 기능 (선택사항이지만 편의를 위해 추가)
    fields.phoneNumber.el.addEventListener('input', (e) => {
        let val = e.target.value.replace(/[^0-9]/g, '');
        if (val.length > 3 && val.length <= 7) {
            val = val.slice(0, 3) + '-' + val.slice(3);
        } else if (val.length > 7) {
            val = val.slice(0, 3) + '-' + val.slice(3, 7) + '-' + val.slice(7, 11);
        }
        e.target.value = val;
    });
</script>

</body>
</html>

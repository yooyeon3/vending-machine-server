<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PIMTO - 문의 상세</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background: #f8fafc; min-height: 100vh; }

        .header { background: white; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-left img { height: 34px; object-fit: contain; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .back-btn { padding: 8px 16px; background: #f1f5f9; color: #64748b; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }
        .edit-btn { padding: 8px 16px; background: #6e8efb; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }

        .container { max-width: 700px; margin: 40px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 16px; }

        .inquiry-card { background: white; border-radius: 16px; border: 1px solid #e2e8f0; padding: 24px; }
        .secret-badge { background: #fef2f2; color: #ef4444; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-right: 8px; }
        .inquiry-title { font-size: 20px; font-weight: 700; color: #1e293b; margin-bottom: 8px; }
        .inquiry-meta { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }
        .inquiry-content { font-size: 15px; color: #475569; line-height: 1.7; }

        .reply-list { display: flex; flex-direction: column; gap: 8px; }
        .admin-reply { background: #f0f0ff; border-radius: 12px; border: 1px solid #c4b5fd; padding: 16px 20px; }
        .admin-badge { background: #6e8efb; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-right: 6px; }
        .reply-username { font-size: 13px; font-weight: 600; color: #1e293b; }
        .reply-time { font-size: 12px; color: #94a3b8; margin-left: 8px; }
        .reply-content { font-size: 14px; color: #475569; line-height: 1.6; margin-top: 8px; }

        .user-reply { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 16px 20px; margin-left: 24px; position: relative; }
        .user-reply::before { content: '↳'; position: absolute; left: -20px; top: 16px; color: #94a3b8; font-size: 16px; }

        .reply-form { background: white; border-radius: 16px; border: 1px solid #e2e8f0; padding: 20px; }
        .reply-form-title { font-size: 14px; font-weight: 600; color: #1e293b; margin-bottom: 10px; }
        .reply-form textarea { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: 'Pretendard', sans-serif; height: 100px; resize: none; outline: none; }
        .reply-form textarea:focus { border-color: #6e8efb; }
        .reply-submit { margin-top: 10px; padding: 10px 20px; background: #1e293b; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; float: right; }

        .user-reply-form { margin-left: 24px; background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 16px; position: relative; }
        .user-reply-form::before { content: '↳'; position: absolute; left: -20px; top: 16px; color: #94a3b8; font-size: 16px; }
        .user-reply-form textarea { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 13px; font-family: 'Pretendard', sans-serif; height: 80px; resize: none; outline: none; }
        .user-reply-form textarea:focus { border-color: #6e8efb; }
        .user-reply-submit { margin-top: 8px; padding: 8px 16px; background: #6e8efb; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; float: right; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <a href="/"><img th:src="@{/images/vending-logo.png}" alt="PIMTO 로고"></a>
    </div>
    <div class="header-right">
        <!-- 본인 글이면 수정 버튼 표시 -->
        <a th:if="${inquiry.username == currentUser}"
           th:href="@{/inquiry/edit/{id}(id=${inquiry.id})}"
           class="edit-btn">✏️ 수정</a>
        <a href="/inquiry/list" class="back-btn">← 목록으로</a>
    </div>
</div>

<div class="container">

    <!-- 원글 -->
    <div class="inquiry-card">
        <div class="inquiry-title">
            <span th:if="${inquiry.secret}" class="secret-badge">🔒 비밀글</span>
            <span th:text="${inquiry.title}"></span>
        </div>
        <div class="inquiry-meta">
            <span th:text="${inquiry.username}"></span> ·
            <span th:text="${#temporals.format(inquiry.createdAt, 'yyyy.MM.dd HH:mm')}"></span>
        </div>
        <div class="inquiry-content" th:text="${inquiry.content}"></div>
    </div>

    <!-- 답글 목록 -->
    <div class="reply-list">
        <div th:each="reply : ${replies}">
            <!-- 관리자 답글 -->
            <div th:if="${reply.adminReply}" class="admin-reply">
                <div>
                    <span class="admin-badge">관리자</span>
                    <span class="reply-username" th:text="${reply.username}"></span>
                    <span class="reply-time" th:text="${#temporals.format(reply.createdAt, 'yyyy.MM.dd HH:mm')}"></span>
                </div>
                <div class="reply-content" th:text="${reply.content}"></div>
            </div>

            <!-- 사용자 재답글 (ㄴ자) -->
            <div th:unless="${reply.adminReply}" class="user-reply">
                <div>
                    <span class="reply-username" th:text="${reply.username}"></span>
                    <span class="reply-time" th:text="${#temporals.format(reply.createdAt, 'yyyy.MM.dd HH:mm')}"></span>
                </div>
                <div class="reply-content" th:text="${reply.content}"></div>
            </div>
        </div>
    </div>

    <!-- 관리자 답글 폼 -->
    <div class="reply-form" th:if="${currentUser == 'admin'}">
        <div class="reply-form-title">💬 답글 작성</div>
        <form th:action="@{/inquiry/reply/{id}(id=${inquiry.id})}" method="post">
            <textarea name="content" placeholder="답글을 입력하세요" required></textarea>
            <button type="submit" class="reply-submit">답글 등록</button>
        </form>
    </div>

    <!-- 사용자 재답글 폼 (ㄴ자) - 관리자 답글 있을 때만 -->
    <div th:if="${inquiry.username == currentUser and !#lists.isEmpty(replies)}" class="user-reply-form">
        <form th:action="@{/inquiry/reply/{id}(id=${inquiry.id})}" method="post">
            <textarea name="content" placeholder="관리자 답글에 재답글을 입력하세요" required></textarea>
            <button type="submit" class="user-reply-submit">재답글 등록</button>
        </form>
    </div>

</div>

</body>
</html>

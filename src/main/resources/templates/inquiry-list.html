<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PIMTO - 문의 목록</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background: #f8fafc; min-height: 100vh; }

        .header { background: white; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-left img { height: 34px; object-fit: contain; }
        .hamburger { display: flex; flex-direction: column; justify-content: center; gap: 5px; width: 32px; height: 32px; cursor: pointer; padding: 4px; border-radius: 6px; transition: background 0.2s; }
        .hamburger:hover { background: #f1f5f9; }
        .hamburger span { display: block; width: 100%; height: 2px; background: #64748b; border-radius: 2px; }
        .write-btn { padding: 8px 16px; background: #1e293b; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }

        /* 사이드바 */
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.2); z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
        .sidebar-overlay.show { opacity: 1; pointer-events: all; }
        .sidebar { position: fixed; top: 0; left: 0; width: 220px; height: 100vh; background: white; border-right: 2px solid #e2e8f0; z-index: 200; display: flex; flex-direction: column; transform: translateX(-100%); transition: transform 0.25s ease; box-shadow: 4px 0 20px rgba(0,0,0,0.15); }
        .sidebar.open { transform: translateX(0); }
        .sidebar-logo { display: flex; align-items: center; gap: 8px; padding: 18px 22px 14px; border-bottom: 1px solid #e2e8f0; }
        .sidebar-logo img { height: 28px; object-fit: contain; }
        .sidebar-logo span { font-size: 15px; font-weight: 700; color: #1e293b; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu li a { display: flex; align-items: center; gap: 10px; padding: 13px 22px; font-size: 14px; font-weight: 500; color: #64748b; text-decoration: none; border-left: 3px solid transparent; transition: all 0.2s; }
        .sidebar-menu li a:hover { background: #f8fafc; color: #6e8efb; border-left-color: #6e8efb; }
        .sidebar-menu li a.active { background: #f0f0ff; color: #6e8efb; border-left-color: #6e8efb; font-weight: 700; }

        .container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        .tab-group { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab { padding: 8px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; border: 1.5px solid #e2e8f0; color: #64748b; }
        .tab.active { background: #1e293b; color: white; border-color: #1e293b; }
        .card { background: white; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; }
        .card-title { font-size: 16px; font-weight: 700; color: #1e293b; padding: 20px 24px; border-bottom: 1px solid #e2e8f0; }
        .inquiry-item { padding: 20px 24px; border-bottom: 1px solid #f1f5f9; cursor: pointer; text-decoration: none; display: block; }
        .inquiry-item:last-child { border-bottom: none; }
        .inquiry-item:hover { background: #f8fafc; }
        .inquiry-title { font-size: 15px; font-weight: 600; color: #1e293b; margin-bottom: 6px; }
        .inquiry-meta { font-size: 12px; color: #94a3b8; display: flex; gap: 12px; }
        .secret-badge { background: #fef2f2; color: #ef4444; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .empty { padding: 40px; text-align: center; color: #94a3b8; font-size: 14px; }
        .unread-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; display: inline-block; margin-left: 8px; flex-shrink: 0; vertical-align: middle; }
        .inquiry-title { display: flex; align-items: center; }
    </style>
</head>
<body>

<div class="sidebar-overlay" id="overlay"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
        <a href="/"><img th:src="@{/images/vending-logo.png}" alt="PIMTO 로고"></a>
        <span>PIMTO</span>
    </div>
    <ul class="sidebar-menu">
        <li><a href="/">🏠 홈</a></li>
        <li><a href="#">🛒 메뉴판</a></li>
        <li><a href="#">🗺️ 지도</a></li>
        <li><a href="#">📋 주문내역</a></li>
        <li><a href="/inquiry/list" class="active">💬 문의</a></li>
    </ul>
</div>

<div class="header">
    <div class="header-left">
        <div class="hamburger" id="hamburger">
            <span></span><span></span><span></span>
        </div>
        <a href="/"><img th:src="@{/images/vending-logo.png}" alt="PIMTO 로고"></a>
    </div>
    <div style="display: flex; align-items: center; gap: 20px;">
        <!-- 채팅 알림 아이콘 -->
        <div onclick="toggleChatPanel()" style="position:relative; display:flex; align-items:center; cursor:pointer;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span id="chatBadge"
                  th:text="${unreadCount}"
                  th:style="${unreadCount > 0} ? 'position:absolute;top:-6px;right:-6px;background:#ef4444;color:white;border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;' : 'display:none'">
            </span>
        </div>
        <a href="/inquiry/write" class="write-btn">✏️ 문의하기</a>
    </div>
</div>

<div class="container">
    <div class="tab-group">
        <a href="/inquiry/list" class="tab active">전체 문의</a>
        <a href="/inquiry/my" class="tab">내 문의</a>
    </div>
    <div class="card">
        <div class="card-title">💬 전체 문의 목록</div>
        <div th:if="${#lists.isEmpty(inquiries)}" class="empty">아직 문의 내역이 없어요.</div>
        <a th:each="inquiry : ${inquiries}"
           th:href="@{/inquiry/detail/{id}(id=${inquiry.id})}"
           class="inquiry-item">
            <div class="inquiry-title">
                <span th:if="${inquiry.secret and !inquiry.username.equals(currentUser) and !'admin'.equals(currentUser)}"
                      class="secret-badge">🔒 비밀글입니다.</span>
                <span th:unless="${inquiry.secret and !inquiry.username.equals(currentUser) and !'admin'.equals(currentUser)}"
                      th:text="${inquiry.title}"></span>
                <span th:if="${unreadInquiryIds != null and unreadInquiryIds.contains(inquiry.id)}" class="unread-dot"></span>
            </div>
            <div class="inquiry-meta">
                <span th:text="${inquiry.username}"></span>
                <span th:text="${#temporals.format(inquiry.createdAt, 'yyyy.MM.dd HH:mm')}"></span>
            </div>
        </a>
    </div>
</div>

<script>
    const hamburger = document.getElementById('hamburger');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    hamburger.addEventListener('mouseenter', () => { sidebar.classList.add('open'); overlay.classList.add('show'); });
    sidebar.addEventListener('mouseleave', () => { sidebar.classList.remove('open'); overlay.classList.remove('show'); });
</script>

<!-- 채팅 위젯 통합 -->
<th:block th:replace="~{fragments/chat-widget :: chatWidget}"></th:block>

</body>
</html>

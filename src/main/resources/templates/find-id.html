<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIMTO - 아이디 찾기</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Pretendard', sans-serif;
            background-color: #faf8f4; /* 따뜻한 크림 배경 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 0;
            position: relative;
        }

        .top-left-logo {
            position: absolute;
            top: 30px;
            left: 40px;
            height: 45px;
            transition: opacity 0.3s ease;
        }

        .container {
            background-color: #ffffff;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(61, 44, 30, 0.05);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #e8dfd4;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: 2px;
            color: #3d2c1e; /* 커피 브라운 */
        }

        .brand-subtitle {
            font-size: 15px;
            color: #9e8c7a; /* 샌드 베이지 */
            margin-bottom: 40px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #3d2c1e;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e8dfd4;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background-color: #faf8f4;
            color: #3d2c1e;
        }

        .input-group input:focus {
            border-color: #c47d4a;
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(196, 125, 74, 0.1);
        }

        .submit-button {
            width: 100%;
            padding: 15px;
            background: #3d2c1e;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.3s ease;
            margin-top: 10px;
        }

        .submit-button:hover {
            opacity: 0.9;
        }

        .extra-links {
            margin-top: 25px;
            font-size: 14px;
            color: #9e8c7a;
        }

        .extra-links a {
            color: #c47d4a;
            text-decoration: none;
            font-weight: 600;
            margin: 0 8px;
        }

        .error-message {
            color: #ef4444;
            background-color: #fef2f2;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            border: 1px solid #fecaca;
        }

        /* 결과 박스 스타일 */
        .result-box {
            background-color: #f2ede4;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid #e8dfd4;
            animation: fadeIn 0.5s ease;
        }

        .username-label {
            font-size: 14px;
            color: #9e8c7a;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .username-value {
            font-size: 26px;
            font-weight: 800;
            color: #3d2c1e;
            letter-spacing: 1px;
        }

        .action-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-link {
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.3s;
            text-align: center;
        }

        .btn-login {
            background: #3d2c1e;
            color: white;
        }

        .btn-pw {
            background: #ffffff;
            color: #9e8c7a;
            border: 1px solid #e8dfd4;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 500px) {
            .container { padding: 40px 25px; border-radius: 0; box-shadow: none; border: none; }
            body { background-color: #ffffff; padding: 0; }
            .top-left-logo { top: 20px; left: 20px; height: 35px; }
        }
    </style>
</head>
<body>

<a href="/">
    <img th:src="@{/images/vending-logo.png}" alt="PIMTO Logo" class="top-left-logo">
</a>

<div class="container">
    <div class="brand-title">아이디 찾기</div>
    <div class="brand-subtitle" th:if="${username == null}">가입 시 등록한 정보를 입력해주세요.</div>

    <!-- 결과 화면 (아이디를 찾았을 때) -->
    <div th:if="${username != null}">
        <div class="result-box">
            <div class="username-label">회원님의 아이디를 찾았습니다!</div>
            <div class="username-value" th:text="${username}">아이디</div>
        </div>
        <div class="action-links">
            <a href="/login" class="btn-link btn-login">로그인하러 가기</a>
            <a href="/find-pw" class="btn-link btn-pw">비밀번호 찾기</a>
        </div>
    </div>

    <!-- 입력 폼 (아이디를 찾기 전 또는 에러 발생 시) -->
    <div th:if="${username == null}">
        <div th:if="${error}" class="error-message" th:text="${error}"></div>

        <form th:action="@{/find-id}" method="post">
            <div class="input-group">
                <label for="name">이름</label>
                <input type="text" id="name" name="name" placeholder="이름을 입력하세요" required th:value="${param.name}">        
            </div>

            <div class="input-group">
                <label for="phoneNumber">전화번호</label>
                <input type="text" id="phoneNumber" name="phoneNumber" placeholder="010-0000-0000" required th:value="${param.phoneNumber}">
            </div>

            <button type="submit" class="submit-button">아이디 찾기</button>
        </form>
    </div>

    <div class="extra-links">
        <a href="/login">로그인으로 돌아가기</a>
    </div>
</div>

<script>
    const phoneInput = document.getElementById('phoneNumber');
    if (phoneInput) {
        phoneInput.addEventListener('input', (e) => {
            let val = e.target.value.replace(/[^0-9]/g, '');
            if (val.length > 3 && val.length <= 7) {
                val = val.slice(0, 3) + '-' + val.slice(3);
            } else if (val.length > 7) {
                val = val.slice(0, 3) + '-' + val.slice(3, 7) + '-' + val.slice(7, 11);
            }
            e.target.value = val;
        });
    }
</script>

</body>
</html>

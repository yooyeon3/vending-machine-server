<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PIMTO - 내 주문 내역</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root {
            --primary: #6e8efb;
            --secondary: #a777e3;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --diamond: #0369a1;
            --gold: #92400e;
            --silver: #475569;
            --bronze: #9a3412;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text-main); line-height: 1.6; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .logo img { height: 40px; }
        .nav a { margin-left: 20px; text-decoration: none; color: var(--text-sub); font-weight: 600; font-size: 15px; }

        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        
        .page-title { font-size: 28px; font-weight: 800; margin-bottom: 30px; display: flex; align-items: center; gap: 12px; }
        .page-title i { font-style: normal; }

        /* 요약 카드 */
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .summary-card { background: white; padding: 24px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
        .summary-label { font-size: 13px; color: var(--text-sub); font-weight: 700; margin-bottom: 8px; display: block; }
        .summary-value { font-size: 20px; font-weight: 800; color: var(--text-main); }
        .summary-value span { color: var(--primary); font-size: 14px; margin-left: 4px; }

        /* 주문 목록 */
        .order-list { display: flex; flex-direction: column; gap: 16px; }
        .order-item { background: white; border-radius: 24px; padding: 24px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; transition: transform 0.2s, box-shadow 0.2s; }
        .order-item:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(0,0,0,0.05); }

        .order-info { display: flex; align-items: center; gap: 20px; }
        .order-icon { width: 56px; height: 56px; background: #f1f5f9; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .order-details { display: flex; flex-direction: column; gap: 4px; }
        .order-name { font-size: 17px; font-weight: 700; color: var(--text-main); }
        .order-date { font-size: 13px; color: var(--text-sub); font-weight: 500; }

        .order-meta { text-align: right; display: flex; flex-direction: column; gap: 6px; }
        .order-price { font-size: 18px; font-weight: 800; color: var(--text-main); }
        .order-points { font-size: 12px; color: var(--primary); font-weight: 700; background: #eff6ff; padding: 2px 8px; border-radius: 6px; display: inline-block; }

        /* 등급 뱃지 */
        .grade-badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .grade-badge.diamond { background: #e0f2fe; color: var(--diamond); border: 1px solid #bae6fd; }
        .grade-badge.gold { background: #fef3c7; color: var(--gold); border: 1px solid #fde68a; }
        .grade-badge.silver { background: #f1f5f9; color: var(--silver); border: 1px solid #e2e8f0; }
        .grade-badge.bronze { background: #ffedd5; color: var(--bronze); border: 1px solid #fed7aa; }

        .empty-state { text-align: center; padding: 80px 0; color: var(--text-sub); }
        .empty-icon { font-size: 64px; margin-bottom: 20px; display: block; opacity: 0.3; }
        .empty-text { font-size: 18px; font-weight: 600; }

        .back-btn { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; color: var(--text-sub); text-decoration: none; font-size: 14px; font-weight: 600; transition: color 0.2s; }
        .back-btn:hover { color: var(--primary); }

        /* PIN 번호 표시 */
        .order-pin-box { margin-top: 12px; padding: 10px 15px; background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .pin-info { display: flex; align-items: center; gap: 10px; }
        .pin-label-mini { font-size: 11px; color: var(--text-sub); font-weight: 700; text-transform: uppercase; }
        .pin-text { font-family: 'Monaco', 'Consolas', monospace; font-weight: 700; color: var(--text-main); font-size: 14px; letter-spacing: 0.5px; }
        .pin-status { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
        .status-valid { background: #dcfce7; color: #15803d; }
        .status-expired { background: #fee2e2; color: #b91c1c; }
        .status-used { background: #f1f5f9; color: #64748b; }
        .copy-btn { background: var(--primary); color: white; border: none; font-size: 11px; font-weight: 700; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: opacity 0.2s; }
        .copy-btn:hover { opacity: 0.8; }

        #toast { visibility: hidden; min-width: 200px; background-color: #333; color: #fff; text-align: center; border-radius: 10px; padding: 12px; position: fixed; z-index: 1000; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 13px; }
        #toast.show { visibility: visible; animation: fadeInOut 2s; }
        @keyframes fadeInOut {
            0% { opacity: 0; bottom: 0; }
            20% { opacity: 1; bottom: 30px; }
            80% { opacity: 1; bottom: 30px; }
            100% { opacity: 0; bottom: 20px; }
        }

        @media (max-width: 640px) {
            .summary-grid { grid-template-columns: 1fr; }
            .order-item { flex-direction: column; align-items: flex-start; gap: 20px; }
            .order-meta { text-align: left; align-items: flex-start; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">
        <a href="/"><img th:src="@{/images/vending-logo.png}" alt="PIMTO"></a>
    </div>
    <div class="nav">
        <a href="/">홈으로</a>
        <a href="/logout" style="color: #ef4444;">로그아웃</a>
    </div>
</div>

<div class="container">
    <a href="/" class="back-btn">← 돌아가기</a>
    
    <h1 class="page-title">📋 내 주문 내역</h1>

    <div class="summary-grid">
        <div class="summary-card">
            <span class="summary-label">현재 내 등급</span>
            <div class="summary-value">
                <span th:class="'grade-badge ' + ${grade.toLowerCase()}" 
                      th:text="${grade == 'DIAMOND' ? '다이아몬드' : (grade == 'GOLD' ? '골드' : (grade == 'SILVER' ? '실버' : '브론즈'))}"
                      style="margin-left: 0; font-size: 15px; padding: 4px 12px;">등급</span>
            </div>
        </div>
        <div class="summary-card">
            <span class="summary-label">총 주문 횟수</span>
            <div class="summary-value" th:text="${orderCount} + '회'">0회</div>
        </div>
        <div class="summary-card">
            <span class="summary-label">누적 결제 금액</span>
            <div class="summary-value" th:text="${#numbers.formatInteger(totalSpent, 0, 'COMMA')} + '원'">0원</div>
        </div>
    </div>

    <div class="order-list" th:if="${not #lists.isEmpty(orders)}">
        <div style="display: flex; flex-direction: column; gap: 16px;" th:each="order : ${orders}">
            <div class="order-item">
                <div class="order-info">
                    <div class="order-icon" th:text="${order.productName.contains('커피') ? '☕' : '🥤'}">🥤</div>
                    <div class="order-details">
                        <div class="order-name" th:text="${order.productName}">상품명</div>
                        <div class="order-date" th:text="${#temporals.format(order.purchaseTime, 'yyyy.MM.dd HH:mm:ss')}">2026.06.16 12:00:00</div>
                    </div>
                </div>
                <div class="order-meta">
                    <div class="order-price" th:text="${#numbers.formatInteger(order.paidPrice ?: 0, 0, 'COMMA')} + '원'">0원</div>
                    <div class="order-points" th:if="${order.earnedPoints > 0}" th:text="'+ ' + ${order.earnedPoints} + 'P 적립'">+0P 적립</div>
                </div>
            </div>
            <!-- PIN 번호 및 상태 표시 (구매 내역 바로 아래) -->
            <div class="order-pin-box" th:if="${order.pinCode != null}">
                <div class="pin-info">
                    <span class="pin-label-mini">PIN</span>
                    <span class="pin-text" th:id="'pin-' + ${order.id}" th:text="${order.pinCode}">A4B9-8K2L</span>
                    
                    <!-- 상태 표시 로직 -->
                    <th:block th:if="${order.used}">
                        <span class="pin-status status-used">사용됨</span>
                    </th:block>
                    <th:block th:if="${!order.used}">
                        <span th:if="${now.isBefore(order.expiryDate)}" class="pin-status status-valid">유효함</span>
                        <span th:if="${now.isAfter(order.expiryDate)}" class="pin-status status-expired">만료됨</span>
                    </th:block>
                </div>
                <button class="copy-btn" th:onclick="|copyPin('${order.id}')|">복사</button>
            </div>
        </div>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(orders)}">
        <span class="empty-icon">📦</span>
        <p class="empty-text">아직 주문한 내역이 없습니다.</p>
        <p style="margin-top: 10px;">PIMTO의 맛있는 음료를 주문해 보세요!</p>
        <a href="/" class="btn-primary" style="display: inline-block; margin-top: 20px; padding: 12px 24px; background: var(--text-main); color: white; border-radius: 12px; text-decoration: none; font-weight: 700;">쇼핑하러 가기</a>
    </div>
</div>

<div id="toast">PIN 번호가 복사되었습니다!</div>

<script th:inline="javascript">
    function copyPin(id) {
        const pinText = document.getElementById('pin-' + id).innerText;
        navigator.clipboard.writeText(pinText).then(() => {
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(() => { toast.className = ""; }, 2000);
        });
    }
</script>

<div style="height: 60px;"></div>

</body>
</html>

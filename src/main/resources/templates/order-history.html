<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=1280">
    <meta charset="UTF-8">
    <title>내 주문 & 혜택 정보</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root {
            --primary: #c47d4a;
            --primary-light: #f2ede4;
            --secondary: #3d2c1e;
            --bg: #faf8f4;
            --card-bg: #ffffff;
            --text-main: #3d2c1e;
            --text-sub: #9e8c7a;
            --border: #e8dfd4;
            --diamond: #3498db;
            --gold: #f1c40f;
            --silver: #bdc3c7;
            --bronze: #e67e22;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text-main); line-height: 1.6; }

        .header { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 15px 40px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .header-left { display: flex; align-items: center; flex: 1; }
        .header-center { display: flex; justify-content: center; align-items: center; gap: 40px; flex: 2; }
        .header-right { font-size: 16px; font-weight: 600; color: #3d2c1e; display: flex; align-items: center; justify-content: flex-end; gap: 25px; flex: 1; }
        
        .dash-nav-link { position: relative; text-decoration: none; color: #9e8c7a; font-weight: 700; font-size: 16px; letter-spacing: -0.3px; padding: 5px 0; transition: color 0.3s ease; }
        .dash-nav-link:hover, .dash-nav-link.active { color: #3d2c1e; }
        .dash-nav-link::after { content: ''; position: absolute; bottom: -2px; left: 50%; width: 0; height: 2px; background: #c47d4a; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-50%); border-radius: 2px; }
        .dash-nav-link:hover::after, .dash-nav-link.active::after { width: 100%; }

        /* 메인 레이아웃 */
        .page-wrapper { display: flex; min-height: calc(100vh - 71px); justify-content: center; }

        .container { flex: 1; max-width: 860px; padding: 30px 32px; animation: fadeIn 0.6s ease-out; padding-bottom: 60px; margin: 0 auto; width: 100%; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .page-title { font-size: 24px; font-weight: 800; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; color: var(--text-main); }
        .back-btn { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; color: var(--text-sub); text-decoration: none; font-size: 14px; font-weight: 600; transition: color 0.2s; }
        .back-btn:hover { color: var(--primary); }

        /* 대시보드 레이아웃 */
        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 30px; }

        /* 등급 카드 */
        .grade-card { background: white; border-radius: 24px; padding: 30px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.03); display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
        .grade-card::before { content: ''; position: absolute; top: -50px; right: -50px; width: 150px; height: 150px; background: var(--primary-light); border-radius: 50%; z-index: 0; opacity: 0.5; }

        .grade-info { position: relative; z-index: 1; }
        .grade-label { font-size: 13px; color: var(--text-sub); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; display: block; }
        .grade-name-big { font-size: 32px; font-weight: 900; color: var(--primary); margin-bottom: 15px; }

        /* 프로그레스 바 */
        .progress-container { margin-top: 20px; position: relative; z-index: 1; }
        .progress-labels { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 8px; }
        .progress-bar-bg { height: 12px; background: #f2ede4; border-radius: 10px; overflow: hidden; position: relative; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #d4a373); border-radius: 10px; transition: width 1.5s cubic-bezier(0.19, 1, 0.22, 1); width: 0; }
        .progress-hint { font-size: 13px; color: var(--text-sub); margin-top: 12px; font-weight: 500; }
        .points-needed { color: var(--primary); font-weight: 700; }

        /* 통계 카드 */
        .stats-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .stat-card { background: white; border-radius: 20px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.02); display: flex; align-items: center; gap: 15px; }
        .stat-icon { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .icon-blue { background: #eff6ff; color: #3b82f6; }
        .icon-green { background: #f0fdf4; color: #22c55e; }
        .icon-purple { background: #f5f3ff; color: #8b5cf6; }
        .stat-content { display: flex; flex-direction: column; }
        .stat-label { font-size: 12px; color: var(--text-sub); font-weight: 600; }
        .stat-value { font-size: 18px; font-weight: 800; color: var(--text-main); }

        /* 최애 음료 섹션 */
        .favorites-section { background: white; border-radius: 24px; padding: 25px; border: 1px solid var(--border); margin-bottom: 30px; } 
        .favorites-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .favorites-list { display: flex; gap: 15px; flex-wrap: wrap; }
        .favorite-item { flex: 1; min-width: 150px; background: #faf8f4; border-radius: 16px; padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 8px; border: 1px solid transparent; transition: all 0.2s; }
        .favorite-item:hover { border-color: var(--primary); background: white; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .fav-rank { width: 24px; height: 24px; border-radius: 50%; background: var(--primary); color: white; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
        .fav-name { font-size: 14px; font-weight: 700; text-align: center; color: var(--text-main); }
        .fav-count { font-size: 12px; font-weight: 600; color: var(--text-sub); background: white; padding: 2px 8px; border-radius: 6px; }  

        /* 주문 내역 리스트 */
        .history-section { background: white; border-radius: 24px; padding: 25px; border: 1px solid var(--border); }
        .history-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; }
        .order-list { display: flex; flex-direction: column; gap: 15px; }
        .order-group { display: flex; flex-direction: column; gap: 8px; }
        .order-item { background: #fff; border-radius: 16px; padding: 18px; border: 1px solid #f2ede4; display: flex; justify-content: space-between; align-items: center; }
        .order-info { display: flex; align-items: center; gap: 15px; }
        .order-icon { width: 44px; height: 44px; background: #faf8f4; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .order-details { display: flex; flex-direction: column; }
        .order-name { font-size: 15px; font-weight: 700; }
        .order-date { font-size: 12px; color: var(--text-sub); }
        .order-meta { text-align: right; }
        .order-price { font-size: 16px; font-weight: 800; }
        .order-points { font-size: 11px; color: var(--primary); font-weight: 700; }

        /* PIN 박스 */
        .order-pin-box { padding: 10px 15px; background: #faf8f4; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-left: 20px; border: 1px dashed #e8dfd4; }
        .pin-text { font-family: 'Monaco', monospace; font-weight: 700; font-size: 13px; color: var(--text-main); }
        .pin-status { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        .status-valid { background: #ecfdf5; color: #15803d; }
        .status-expired { background: #fef2f2; color: #b91c1c; }
        .status-used { background: #f2ede4; color: #9e8c7a; }
        .copy-btn { background: var(--text-main); color: white; border: none; font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 6px; cursor: pointer; }

        /* 등급 뱃지 */
        .grade-badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; color: #fff; }
        .grade-badge.diamond { background: var(--diamond); }
        .grade-badge.gold { background: var(--gold); }
        .grade-badge.silver { background: var(--silver); }
        .grade-badge.bronze { background: var(--bronze); }

        .empty-state { text-align: center; padding: 50px 0; color: var(--text-sub); }

        #toast { visibility: hidden; min-width: 200px; background-color: #3d2c1e; color: #fff; text-align: center; border-radius: 10px; padding: 12px; position: fixed; z-index: 1000; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 13px; }
        #toast.show { visibility: visible; animation: fadeInOut 2s; }
        @keyframes fadeInOut { 0% { opacity: 0; bottom: 0; } 20% { opacity: 1; bottom: 30px; } 80% { opacity: 1; bottom: 30px; } 100% { opacity: 0; bottom: 20px; } }

        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .favorite-item { min-width: 100%; }
        }

        @media (max-width: 600px) {
            .header { padding: 15px 20px; flex-direction: column; gap: 15px; }
            .nav { justify-content: center; flex-wrap: wrap; gap: 10px; }
            .nav a { margin-left: 10px; font-size: 14px; }
            .container { margin: 20px auto; }
            .grade-card::before { display: none; }
            .grade-name-big { font-size: 26px; }
            .order-item { flex-direction: column; align-items: flex-start; gap: 15px; }
            .order-meta { text-align: left; }
            .order-pin-box { margin-left: 0; flex-direction: column; gap: 10px; align-items: flex-start; }
            .copy-btn { width: 100%; padding: 8px; font-size: 12px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <a href="/" style="display: flex; align-items: center;">
            <img th:src="@{/images/vending-logo.png}" style="height: 35px;" alt="PIMTO 로고">
        </a>
    </div>
    <div class="header-center">
        <a href="/" class="dash-nav-link">메뉴판</a>
        <a href="/mypage" class="dash-nav-link">마이페이지</a>
        <a href="/robot" class="dash-nav-link">PIMTO 소개</a>
        <a href="/orders/my" class="dash-nav-link active">주문내역</a>
        <a href="#" onclick="toggleChatPanel(); return false;" class="dash-nav-link" style="position:relative;">
            1:1 문의
            <span id="chatBadge"
                  th:text="${unreadCount}"
                  th:style="${unreadCount > 0} ? 'position:absolute;top:-5px;right:-15px;background:#ef4444;color:white;border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;' : 'display:none'">
            </span>
        </a>
    </div>
    <div class="header-right">
        <a href="/logout" style="color: #ef4444; text-decoration: none; font-size: 14px; transition: opacity 0.2s;">로그아웃</a>
    </div>
</div>

<div class="page-wrapper">

<div class="container">
    <h1 class="page-title">✨ 내 주문 & 혜택 정보</h1>

    <div class="dashboard-grid">
        <!-- 등급 현황 카드 -->
        <div class="grade-card">
            <div class="grade-info">
                <span class="grade-label">현재 멤버십 등급</span>
                <div class="grade-name-big">
                    <span th:text="${progress.currentGrade == 'DIAMOND' ? '다이아몬드' : (progress.currentGrade == 'GOLD' ? '골드' : (progress.currentGrade == 'SILVER' ? '실버' : '브론즈'))}">등급</span>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-labels">
                    <span th:text="${progress.currentGrade}">BRONZE</span>
                    <span th:text="${progress.nextGrade}">SILVER</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" th:id="progressBar" th:data-width="${progress.progressPercentage}"></div>
                </div>
                <div class="progress-hint" th:if="${progress.currentGrade != 'DIAMOND'}">
                    다음 등급까지 <span class="points-needed" th:text="${progress.pointsToNext}">0</span>점이 더 필요해요!
                </div>
                <div class="progress-hint" th:if="${progress.currentGrade == 'DIAMOND'}">
                    축하합니다! 최고 등급인 <span class="points-needed">DIAMOND</span> 등급입니다.
                </div>
            </div>
        </div>

        <!-- 간편 통계 카드 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon icon-blue">🛒</div>
                <div class="stat-content">
                    <span class="stat-label">총 주문 횟수</span>
                    <span class="stat-value" th:text="${orderCount} + '회'">0회</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-green">💰</div>
                <div class="stat-content">
                    <span class="stat-label">누적 결제 금액</span>
                    <span class="stat-value" th:text="${#numbers.formatInteger(totalSpent, 0, 'COMMA')} + '원'">0원</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-purple">🎁</div>
                <div class="stat-content">
                    <span class="stat-label">누적 적립 포인트</span>
                    <span class="stat-value" th:text="${#numbers.formatInteger(totalEarnedPoints, 0, 'COMMA')} + 'P'">0P</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 최애 음료 분석 섹션 -->
    <div class="favorites-section" th:if="${not #lists.isEmpty(topProducts)}">
        <h2 class="favorites-title">🥤 나의 최애 음료 TOP 3</h2>
        <div class="favorites-list">
            <div class="favorite-item" th:each="prod, iter : ${topProducts}">
                <div class="fav-rank" th:text="${iter.count}">1</div>
                <div class="fav-name" th:text="${prod.name}">음료명</div>
                <div class="fav-count" th:text="${prod.count} + '회 구매'">0회</div>
            </div>
        </div>
    </div>

    <!-- 최근 주문 내역 섹션 -->
    <div class="history-section">
        <h2 class="history-title">📋 최근 주문 내역</h2>

        <div class="order-list" th:if="${not #lists.isEmpty(orders)}">
            <div class="order-group" th:each="order : ${orders}">
                <div class="order-item">
                    <div class="order-info">
                        <div class="order-icon" th:text="${order.productName.contains('커피') ? '☕' : '🥤'}">🥤</div>
                        <div class="order-details">
                            <div class="order-name" th:text="${order.productName}">상품명</div>
                            <div class="order-date" th:text="${#temporals.format(order.purchaseTime, 'yyyy.MM.dd HH:mm')}">2026.06.16 12:00</div>
                        </div>
                    </div>
                    <div class="order-meta">
                        <div class="order-price" th:text="${#numbers.formatInteger(order.paidPrice ?: 0, 0, 'COMMA')} + '원'">0원</div>     
                        <div class="order-points" th:if="${order.earnedPoints > 0}" th:text="'+' + ${order.earnedPoints} + 'P'">+0P</div>   
                    </div>
                </div>

                <!-- 배달 현황 링크 -->
                <div class="order-pin-box" th:if="${order.pinCode != null}">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <th:block th:if="${order.used}">
                            <span class="pin-status status-used">배달 완료</span>
                        </th:block>
                        <th:block th:if="${!order.used}">
                            <span th:if="${now.isBefore(order.expiryDate)}" class="pin-status status-valid">배달 중</span>
                            <span th:if="${now.isAfter(order.expiryDate)}" class="pin-status status-expired">만료</span>
                        </th:block>
                    </div>
                    <a th:if="${!order.used and now.isBefore(order.expiryDate)}"
                       th:href="@{/orders/delivery/{id}(id=${order.id})}"
                       class="copy-btn" style="text-decoration:none;">현황 확인</a>
                </div>
            </div>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(orders)}">
            <p>아직 주문한 내역이 없습니다. 첫 주문을 시작해 보세요!</p>
        </div>
    </div>
</div>

</div><!-- /page-wrapper -->

<th:block th:replace="~{fragments/delivery-widget :: deliveryWidget}"></th:block>
<th:block th:replace="~{fragments/chat-panel :: chatPanel}"></th:block>

<script th:inline="javascript">
    // 프로그레스 바 애니메이션 및 상품명 통합
    window.onload = () => {
        const bar = document.getElementById('progressBar');
        if (bar) {
            const width = bar.getAttribute('data-width');
            setTimeout(() => {
                bar.style.width = width + '%';
            }, 100);
        }

        // 주문 내역 파싱 및 통합 (예: 펩시콜라x2 -> 펩시콜라 2개)
        const orderItems = document.querySelectorAll('.order-item');
        orderItems.forEach(item => {
            const nameEl = item.querySelector('.order-name');
            if (nameEl) {
                const text = nameEl.textContent;
                const match = text.match(/^(.*?)\s*[xX]\s*(\d+)$/);
                if (match) {
                    const baseName = match[1].trim();
                    const qty = parseInt(match[2], 10);
                    
                    nameEl.textContent = baseName;
                    
                    const badge = document.createElement('span');
                    badge.style.cssText = 'background: var(--primary-light); color: var(--primary); padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; margin-left: 8px; vertical-align: middle; display: inline-block;';
                    badge.textContent = qty + '개';
                    nameEl.appendChild(badge);
                }
            }
        });

        // 최애 음료 파싱
        const favItems = document.querySelectorAll('.favorite-item');
        favItems.forEach(item => {
            const nameEl = item.querySelector('.fav-name');
            if (nameEl) {
                const text = nameEl.textContent;
                const match = text.match(/^(.*?)\s*[xX]\s*(\d+)$/);
                if (match) {
                    nameEl.textContent = match[1].trim();
                }
            }
        });
    };
</script>

<!-- 채팅 위젯 통합 -->
<th:block th:replace="~{fragments/chat-widget :: chatWidget}"></th:block>

</body>
</html>

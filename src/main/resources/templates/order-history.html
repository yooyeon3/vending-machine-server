<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 주문 & 혜택 정보</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root {
            --primary: #6e8efb;
            --primary-light: #eff6ff;
            --secondary: #a777e3;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --diamond: #0369a1;
            --gold: #92400e;
            --silver: #475569;
            --bronze: #9a3412;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text-main); line-height: 1.6; padding-bottom: 60px; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .logo img { height: 40px; }
        .nav a { margin-left: 20px; text-decoration: none; color: var(--text-sub); font-weight: 600; font-size: 15px; }

        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .page-title { font-size: 24px; font-weight: 800; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; color: var(--text-main); }
        .back-btn { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; color: var(--text-sub); text-decoration: none; font-size: 14px; font-weight: 600; transition: color 0.2s; }
        .back-btn:hover { color: var(--primary); }

        /* 대시보드 레이아웃 */
        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 30px; }

        /* 등급 카드 */
        .grade-card { background: white; border-radius: 24px; padding: 30px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.03); display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
        .grade-card::before { content: ''; position: absolute; top: -50px; right: -50px; width: 150px; height: 150px; background: var(--primary-light); border-radius: 50%; z-index: 0; opacity: 0.5; }
        
        .grade-info { position: relative; z-index: 1; }
        .grade-label { font-size: 13px; color: var(--text-sub); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; display: block; }
        .grade-name-big { font-size: 32px; font-weight: 900; color: var(--primary); margin-bottom: 15px; }
        
        /* 프로그레스 바 */
        .progress-container { margin-top: 20px; position: relative; z-index: 1; }
        .progress-labels { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 8px; }
        .progress-bar-bg { height: 12px; background: #f1f5f9; border-radius: 10px; overflow: hidden; position: relative; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 10px; transition: width 1.5s cubic-bezier(0.19, 1, 0.22, 1); width: 0; }
        .progress-hint { font-size: 13px; color: var(--text-sub); margin-top: 12px; font-weight: 500; }
        .points-needed { color: var(--primary); font-weight: 700; }

        /* 통계 카드 */
        .stats-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .stat-card { background: white; border-radius: 20px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.02); display: flex; align-items: center; gap: 15px; }
        .stat-icon { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .icon-blue { background: #eff6ff; color: #3b82f6; }
        .icon-green { background: #f0fdf4; color: #22c55e; }
        .icon-purple { background: #f5f3ff; color: #8b5cf6; }
        .stat-content { display: flex; flex-direction: column; }
        .stat-label { font-size: 12px; color: var(--text-sub); font-weight: 600; }
        .stat-value { font-size: 18px; font-weight: 800; color: var(--text-main); }

        /* 최애 음료 섹션 */
        .favorites-section { background: white; border-radius: 24px; padding: 25px; border: 1px solid var(--border); margin-bottom: 30px; }
        .favorites-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .favorites-list { display: flex; gap: 15px; flex-wrap: wrap; }
        .favorite-item { flex: 1; min-width: 150px; background: #f8fafc; border-radius: 16px; padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 8px; border: 1px solid transparent; transition: all 0.2s; }
        .favorite-item:hover { border-color: var(--primary); background: white; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .fav-rank { width: 24px; height: 24px; border-radius: 50%; background: var(--primary); color: white; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
        .fav-name { font-size: 14px; font-weight: 700; text-align: center; color: var(--text-main); }
        .fav-count { font-size: 12px; font-weight: 600; color: var(--text-sub); background: white; padding: 2px 8px; border-radius: 6px; }

        /* 주문 내역 리스트 */
        .history-section { background: white; border-radius: 24px; padding: 25px; border: 1px solid var(--border); }
        .history-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; }
        .order-list { display: flex; flex-direction: column; gap: 15px; }
        .order-group { display: flex; flex-direction: column; gap: 8px; }
        .order-item { background: #fff; border-radius: 16px; padding: 18px; border: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
        .order-info { display: flex; align-items: center; gap: 15px; }
        .order-icon { width: 44px; height: 44px; background: #f8fafc; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .order-details { display: flex; flex-direction: column; }
        .order-name { font-size: 15px; font-weight: 700; }
        .order-date { font-size: 12px; color: var(--text-sub); }
        .order-meta { text-align: right; }
        .order-price { font-size: 16px; font-weight: 800; }
        .order-points { font-size: 11px; color: var(--primary); font-weight: 700; }

        /* PIN 박스 */
        .order-pin-box { padding: 10px 15px; background: #f1f5f9; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-left: 20px; border: 1px dashed #cbd5e1; }
        .pin-text { font-family: 'Monaco', monospace; font-weight: 700; font-size: 13px; color: var(--text-main); }
        .pin-status { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        .status-valid { background: #dcfce7; color: #15803d; }
        .status-expired { background: #fee2e2; color: #b91c1c; }
        .status-used { background: #e2e8f0; color: #64748b; }
        .copy-btn { background: var(--text-main); color: white; border: none; font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 6px; cursor: pointer; }

        /* 등급 뱃지 */
        .grade-badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; }
        .grade-badge.diamond { background: #e0f2fe; color: var(--diamond); }
        .grade-badge.gold { background: #fef3c7; color: var(--gold); }
        .grade-badge.silver { background: #f1f5f9; color: var(--silver); }
        .grade-badge.bronze { background: #ffedd5; color: var(--bronze); }

        .empty-state { text-align: center; padding: 50px 0; color: var(--text-sub); }

        #toast { visibility: hidden; min-width: 200px; background-color: #333; color: #fff; text-align: center; border-radius: 10px; padding: 12px; position: fixed; z-index: 1000; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 13px; }
        #toast.show { visibility: visible; animation: fadeInOut 2s; }
        @keyframes fadeInOut { 0% { opacity: 0; bottom: 0; } 20% { opacity: 1; bottom: 30px; } 80% { opacity: 1; bottom: 30px; } 100% { opacity: 0; bottom: 20px; } }

        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .favorite-item { min-width: 100%; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">
        <a href="/"><img th:src="@{/images/vending-logo.png}" alt="PIMTO"></a>
    </div>
    <div class="nav">
        <a href="/">홈으로</a>
        <a href="/logout" style="color: #ef4444;">로그아웃</a>
    </div>
</div>

<div class="container">
    <a href="/" class="back-btn">← 메뉴판으로 돌아가기</a>
    
    <h1 class="page-title">✨ 내 주문 & 혜택 정보</h1>

    <div class="dashboard-grid">
        <!-- 등급 현황 카드 -->
        <div class="grade-card">
            <div class="grade-info">
                <span class="grade-label">현재 멤버십 등급</span>
                <div class="grade-name-big">
                    <span th:text="${progress.currentGrade == 'DIAMOND' ? '다이아몬드' : (progress.currentGrade == 'GOLD' ? '골드' : (progress.currentGrade == 'SILVER' ? '실버' : '브론즈'))}">등급</span>
                </div>
            </div>
            
            <div class="progress-container">
                <div class="progress-labels">
                    <span th:text="${progress.currentGrade}">BRONZE</span>
                    <span th:text="${progress.nextGrade}">SILVER</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" th:id="progressBar" th:data-width="${progress.progressPercentage}"></div>
                </div>
                <div class="progress-hint" th:if="${progress.currentGrade != 'DIAMOND'}">
                    다음 등급까지 <span class="points-needed" th:text="${progress.pointsToNext}">0</span>점이 더 필요해요!
                </div>
                <div class="progress-hint" th:if="${progress.currentGrade == 'DIAMOND'}">
                    축하합니다! 최고 등급인 <span class="points-needed">DIAMOND</span> 등급입니다.
                </div>
            </div>
        </div>

        <!-- 간편 통계 카드 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon icon-blue">🛒</div>
                <div class="stat-content">
                    <span class="stat-label">총 주문 횟수</span>
                    <span class="stat-value" th:text="${orderCount} + '회'">0회</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-green">💰</div>
                <div class="stat-content">
                    <span class="stat-label">누적 결제 금액</span>
                    <span class="stat-value" th:text="${#numbers.formatInteger(totalSpent, 0, 'COMMA')} + '원'">0원</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-purple">🎁</div>
                <div class="stat-content">
                    <span class="stat-label">누적 적립 포인트</span>
                    <span class="stat-value" th:text="${#numbers.formatInteger(totalEarnedPoints, 0, 'COMMA')} + 'P'">0P</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 최애 음료 분석 섹션 -->
    <div class="favorites-section" th:if="${not #lists.isEmpty(topProducts)}">
        <h2 class="favorites-title">🥤 나의 최애 음료 TOP 3</h2>
        <div class="favorites-list">
            <div class="favorite-item" th:each="prod, iter : ${topProducts}">
                <div class="fav-rank" th:text="${iter.count}">1</div>
                <div class="fav-name" th:text="${prod.name}">음료명</div>
                <div class="fav-count" th:text="${prod.count} + '회 구매'">0회</div>
            </div>
        </div>
    </div>

    <!-- 최근 주문 내역 섹션 -->
    <div class="history-section">
        <h2 class="history-title">📋 최근 주문 내역</h2>
        
        <div class="order-list" th:if="${not #lists.isEmpty(orders)}">
            <div class="order-group" th:each="order : ${orders}">
                <div class="order-item">
                    <div class="order-info">
                        <div class="order-icon" th:text="${order.productName.contains('커피') ? '☕' : '🥤'}">🥤</div>
                        <div class="order-details">
                            <div class="order-name" th:text="${order.productName}">상품명</div>
                            <div class="order-date" th:text="${#temporals.format(order.purchaseTime, 'yyyy.MM.dd HH:mm')}">2026.06.16 12:00</div>
                        </div>
                    </div>
                    <div class="order-meta">
                        <div class="order-price" th:text="${#numbers.formatInteger(order.paidPrice ?: 0, 0, 'COMMA')} + '원'">0원</div>
                        <div class="order-points" th:if="${order.earnedPoints > 0}" th:text="'+' + ${order.earnedPoints} + 'P'">+0P</div>
                    </div>
                </div>
                
                <!-- PIN 번호 연동 -->
                <div class="order-pin-box" th:if="${order.pinCode != null}">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="pin-text" th:id="'pin-' + ${order.id}" th:text="${order.pinCode}">A4B9-8K2L</span>
                        <th:block th:if="${order.used}">
                            <span class="pin-status status-used">사용됨</span>
                        </th:block>
                        <th:block th:if="${!order.used}">
                            <span th:if="${now.isBefore(order.expiryDate)}" class="pin-status status-valid">유효</span>
                            <span th:if="${now.isAfter(order.expiryDate)}" class="pin-status status-expired">만료</span>
                        </th:block>
                    </div>
                    <button class="copy-btn" th:onclick="|copyPin('${order.id}')|">복사</button>
                </div>
            </div>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(orders)}">
            <p>아직 주문한 내역이 없습니다. 첫 주문을 시작해 보세요!</p>
        </div>
    </div>
</div>

<div id="toast">PIN 번호가 복사되었습니다!</div>

<th:block th:replace="~{fragments/delivery-widget :: deliveryWidget}"></th:block>

<script th:inline="javascript">
    // 프로그레스 바 애니메이션
    window.onload = () => {
        const bar = document.getElementById('progressBar');
        if (bar) {
            const width = bar.getAttribute('data-width');
            setTimeout(() => {
                bar.style.width = width + '%';
            }, 100);
        }
    };

    function copyPin(id) {
        const pinText = document.getElementById('pin-' + id).innerText;
        navigator.clipboard.writeText(pinText).then(() => {
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(() => { toast.className = ""; }, 2000);
        });
    }
</script>

</body>
</html>

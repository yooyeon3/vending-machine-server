<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 - PIMTO</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root {
            --primary: #6e8efb;
            --secondary: #a777e3;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text-main); padding-bottom: 80px; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .logo img { height: 40px; }
        .nav { display: flex; align-items: center; gap: 16px; }
        .nav a { text-decoration: none; color: var(--text-sub); font-weight: 600; font-size: 15px; }
        .nav a:hover { color: var(--primary); }

        .container { max-width: 720px; margin: 36px auto; padding: 0 20px; }
        .page-title { font-size: 24px; font-weight: 800; margin-bottom: 28px; display: flex; align-items: center; gap: 10px; }

        .card { background: white; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.04); margin-bottom: 20px; overflow: hidden; }
        .card-header { padding: 18px 24px 14px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        .card-body { padding: 22px 24px; }

        /* 등급 카드 */
        .grade-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        .grade-badge-lg { padding: 6px 14px; border-radius: 10px; font-size: 14px; font-weight: 800; }
        .grade-badge-lg.diamond { background: #e0f2fe; color: #0369a1; }
        .grade-badge-lg.gold { background: #fef3c7; color: #92400e; }
        .grade-badge-lg.silver { background: #f1f5f9; color: #475569; }
        .grade-badge-lg.bronze { background: #ffedd5; color: #9a3412; }
        .points-display { font-size: 22px; font-weight: 900; color: var(--primary); }
        .points-label { font-size: 12px; color: var(--text-sub); font-weight: 600; margin-top: 2px; }
        .progress-bar-bg { height: 10px; background: #f1f5f9; border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 10px; transition: width 1.2s ease; }
        .progress-hint { font-size: 13px; color: var(--text-sub); font-weight: 500; }
        .progress-hint span { color: var(--primary); font-weight: 700; }

        /* 폼 */
        .form-group { margin-bottom: 16px; }
        .form-label { font-size: 13px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; display: block; }
        .form-input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 14px; font-family: 'Pretendard', sans-serif; outline: none; transition: border-color 0.2s; }
        .form-input:focus { border-color: var(--primary); }
        .form-input:disabled { background: #f8fafc; color: var(--text-sub); cursor: not-allowed; }

        .btn { padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; font-family: 'Pretendard', sans-serif; }
        .btn-primary { background: var(--text-main); color: white; }
        .btn-primary:hover { background: #334155; transform: translateY(-1px); }
        .btn-danger { background: #fee2e2; color: #b91c1c; }
        .btn-danger:hover { background: #fecaca; }
        .btn-sm { padding: 8px 16px; font-size: 13px; }

        .alert { padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; margin-bottom: 16px; }
        .alert-success { background: #dcfce7; color: #15803d; }
        .alert-error { background: #fee2e2; color: #b91c1c; }

        .withdraw-section { display: flex; justify-content: space-between; align-items: center; }
        .withdraw-desc { font-size: 13px; color: var(--text-sub); }

        @media (max-width: 600px) {
            .header { padding: 12px 20px; }
            .container { padding: 0 16px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">
        <a href="/"><img th:src="@{/images/vending-logo.png}" alt="PIMTO"></a>
    </div>
    <div class="nav">
        <a href="/">홈으로</a>
        <a href="/orders/my">주문내역</a>
        <div onclick="toggleChatPanel()" style="position:relative; display:flex; align-items:center; cursor:pointer;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span id="chatBadge"
                  th:text="${unreadCount}"
                  th:style="${unreadCount != null and unreadCount > 0} ? 'position:absolute;top:-6px;right:-6px;background:#ef4444;color:white;border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;' : 'display:none'">
            </span>
        </div>
        <a href="/logout" style="color: #ef4444;">로그아웃</a>
    </div>
</div>

<div class="container">
    <h1 class="page-title">👤 마이페이지</h1>

    <!-- 알림 메시지 -->
    <div class="alert alert-success" th:if="${param.updateSuccess}">프로필이 업데이트되었습니다.</div>
    <div class="alert alert-success" th:if="${param.pwSuccess}">비밀번호가 변경되었습니다.</div>
    <div class="alert alert-error" th:if="${param.pwError}">현재 비밀번호가 올바르지 않습니다.</div>

    <!-- 등급 & 포인트 -->
    <div class="card">
        <div class="card-header">🏅 등급 & 포인트</div>
        <div class="card-body">
            <div class="grade-row">
                <div>
                    <div class="points-display" th:text="${#numbers.formatInteger(member.points ?: 0, 0, 'COMMA')} + 'P'">0P</div>
                    <div class="points-label">보유 포인트</div>
                </div>
                <span class="grade-badge-lg"
                      th:text="${progress.currentGrade == 'DIAMOND' ? '다이아몬드' : (progress.currentGrade == 'GOLD' ? '골드' : (progress.currentGrade == 'SILVER' ? '실버' : '브론즈'))}"
                      th:class="'grade-badge-lg ' + ${progress.currentGrade.toLowerCase()}">등급</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" th:style="'width:' + ${progress.progressPercentage} + '%'"></div>
            </div>
            <div class="progress-hint" th:if="${progress.currentGrade != 'DIAMOND'}">
                다음 등급까지 <span th:text="${progress.pointsToNext}">0</span>점 더 필요해요!
            </div>
            <div class="progress-hint" th:if="${progress.currentGrade == 'DIAMOND'}">
                최고 등급 <span>DIAMOND</span> 달성!
            </div>
        </div>
    </div>

    <!-- 프로필 수정 -->
    <div class="card">
        <div class="card-header">✏️ 프로필 수정</div>
        <div class="card-body">
            <form th:action="@{/mypage/update}" method="post">
                <div class="form-group">
                    <label class="form-label">아이디</label>
                    <input class="form-input" type="text" th:value="${member.username}" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">이름</label>
                    <input class="form-input" type="text" name="name" th:value="${member.name}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">전화번호</label>
                    <input class="form-input" type="text" name="phoneNumber" th:value="${member.phoneNumber}" placeholder="010-0000-0000">
                </div>
                <button type="submit" class="btn btn-primary">저장하기</button>
            </form>
        </div>
    </div>

    <!-- 비밀번호 변경 -->
    <div class="card">
        <div class="card-header">🔒 비밀번호 변경</div>
        <div class="card-body">
            <form th:action="@{/mypage/password}" method="post">
                <div class="form-group">
                    <label class="form-label">현재 비밀번호</label>
                    <input class="form-input" type="password" name="oldPassword" required>
                </div>
                <div class="form-group">
                    <label class="form-label">새 비밀번호</label>
                    <input class="form-input" type="password" name="newPassword" required>
                </div>
                <button type="submit" class="btn btn-primary">변경하기</button>
            </form>
        </div>
    </div>

    <!-- 회원 탈퇴 -->
    <div class="card">
        <div class="card-header">⚠️ 회원 탈퇴</div>
        <div class="card-body">
            <div class="withdraw-section">
                <div class="withdraw-desc">탈퇴 시 모든 데이터가 삭제되며 복구할 수 없습니다.</div>
                <form th:action="@{/mypage/withdraw}" method="post" onsubmit="return confirm('정말 탈퇴하시겠습니까?')">
                        <button type="submit" class="btn btn-danger btn-sm">회원 탈퇴</button>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/chat-panel :: chatPanel}"></th:block>
<th:block th:replace="~{fragments/delivery-widget :: deliveryWidget}"></th:block>

</body>
</html>

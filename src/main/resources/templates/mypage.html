<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIMTO - 마이페이지</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root {
            --primary: #c47d4a;
            --primary-light: #f2ede4;
            --secondary: #3d2c1e;
            --bg: #faf8f4;
            --card-bg: #ffffff;
            --text-main: #3d2c1e;
            --text-sub: #9e8c7a;
            --border: #e8dfd4;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text-main); line-height: 1.6; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: #f2ede4; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .logo img { height: 40px; }
        .nav a { margin-left: 20px; text-decoration: none; color: var(--text-sub); font-weight: 600; font-size: 15px; }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; animation: fadeIn 0.6s ease-out; display: grid; grid-template-columns: 280px 1fr; gap: 30px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 사이드 메뉴 */
        .side-nav { display: flex; flex-direction: column; gap: 10px; }
        .side-nav-card { background: white; border-radius: 24px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(61,44,30,0.02); }
        .user-summary { text-align: center; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .user-avatar { width: 80px; height: 80px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; margin: 0 auto 15px; border: 1px solid var(--border); }
        .user-name { font-size: 18px; font-weight: 800; margin-bottom: 5px; }
        .user-grade-badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; background: var(--primary); color: white; }

        .menu-list { list-style: none; }
        .menu-item { margin-bottom: 5px; }
        .menu-link { display: flex; align-items: center; gap: 10px; padding: 12px 15px; border-radius: 12px; text-decoration: none; color: var(--text-sub); font-weight: 600; transition: all 0.2s; }
        .menu-link:hover, .menu-link.active { background: var(--primary-light); color: var(--primary); }

        /* 메인 콘텐츠 */
        .content-area { display: flex; flex-direction: column; gap: 25px; }
        .section-card { background: white; border-radius: 24px; padding: 35px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(61,44,30,0.02); }
        .section-title { font-size: 20px; font-weight: 800; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }

        /* 등급 정보 박스 */
        .grade-box { border-radius: 20px; padding: 25px; color: white; margin-bottom: 10px; }
        .grade-box.diamond { background: #3498db; }
        .grade-box.gold { background: #f1c40f; }
        .grade-box.silver { background: #bdc3c7; }
        .grade-box.bronze { background: #e67e22; }

        .grade-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .grade-title { font-size: 14px; font-weight: 600; opacity: 0.9; }
        .grade-value { font-size: 28px; font-weight: 900; }
        .point-value { font-size: 18px; font-weight: 700; margin-top: 5px; }
        .progress-bar-bg { height: 8px; background: rgba(255,255,255,0.2); border-radius: 10px; margin: 15px 0 10px; overflow: hidden; }    
        .progress-bar-fill { height: 100%; background: white; border-radius: 10px; transition: width 1s ease; }
        .progress-text { font-size: 13px; font-weight: 500; opacity: 0.9; }

        /* 폼 스타일 */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 700; color: var(--text-sub); margin-bottom: 8px; }
        .form-control { width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 15px; font-family: inherit; transition: all 0.2s; background: var(--bg); color: var(--text-main); }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(196, 125, 74, 0.1); }
        .form-control:disabled { background: #f2ede4; cursor: not-allowed; }

        .btn { padding: 12px 24px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; border: none; font-family: inherit; }
        .btn-primary { background: var(--secondary); color: white; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-outline { background: white; border: 1.5px solid var(--border); color: var(--text-sub); }
        .btn-outline:hover { background: var(--bg); color: var(--text-main); }
        .btn-danger { background: #fff1f2; color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }

        .alert { padding: 15px; border-radius: 12px; margin-bottom: 20px; font-size: 14px; font-weight: 600; display: none; }
        .alert-success { display: block; background: #ecfdf5; color: var(--success); border: 1px solid #d1fae5; }
        .alert-error { display: block; background: #fef2f2; color: var(--danger); border: 1px solid #fee2e2; }

        /* 위험 구역 */
        .danger-zone { border: 1.5px solid #fee2e2; background: #fffafb; }
        .danger-title { color: var(--danger); }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; gap: 20px; }
            .side-nav { display: block; margin-bottom: 10px; }
            .user-summary { display: flex; align-items: center; gap: 15px; text-align: left; padding-bottom: 15px; }
            .user-avatar { margin: 0; width: 60px; height: 60px; font-size: 24px; }
            .menu-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; white-space: nowrap; }
            .menu-item { margin: 0; flex: 0 0 auto; }
            .menu-link { padding: 10px 15px; font-size: 13px; }
        }

        @media (max-width: 600px) {
            .header { padding: 15px 20px; flex-direction: column; gap: 15px; }
            .nav { justify-content: center; flex-wrap: wrap; gap: 10px; }
            .nav a { margin-left: 10px; font-size: 14px; }
            .container { margin: 20px auto; }
            .section-card { padding: 20px; }
            .grade-box { padding: 20px; }
            .grade-header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .grade-header > div { text-align: left !important; }
            .grade-value { font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">
        <a href="/"><img th:src="@{/images/vending-logo.png}" alt="PIMTO"></a>
    </div>
    <div class="nav" style="display: flex; align-items: center;">
        <a href="/">홈으로</a>
        <!-- 채팅 알림 아이콘 -->
        <div onclick="toggleChatPanel()" style="position:relative; display:flex; align-items:center; cursor:pointer; margin-left: 20px;">   
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3d2c1e" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span id="chatBadge"
                  th:text="${unreadCount}"
                  th:style="${unreadCount > 0} ? 'position:absolute;top:-6px;right:-6px;background:#ef4444;color:white;border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;' : 'display:none'">
            </span>
        </div>
        <a href="/logout" style="color: #ef4444; margin-left: 20px;">로그아웃</a>
    </div>
</div>

<div class="container">
    <!-- 사이드 메뉴 -->
    <div class="side-nav">
        <div class="side-nav-card">
            <div class="user-summary">
                <div class="user-avatar" th:text="${member.name != null && !member.name.isEmpty() ? #strings.substring(member.name,0,1) : 'U'}">U</div>
                <div class="user-name" th:text="${member.name ?: '익명 사용자'}">사용자</div>
                <div class="user-grade-badge" th:text="${progress.currentGrade}">BRONZE</div>
            </div>
            <ul class="menu-list">
                <li class="menu-item"><a href="#profile" class="menu-link active">👤 내 프로필</a></li>
                <li class="menu-item"><a href="/orders/my" class="menu-link">📋 주문 내역</a></li>
                <li class="menu-item"><a href="#password" class="menu-link">🔒 비밀번호 변경</a></li>
                <li class="menu-item"><a href="#withdraw" class="menu-link" style="color: #94a3b8;">🚪 회원 탈퇴</a></li>
            </ul>
        </div>
    </div>

    <!-- 메인 콘텐츠 -->
    <div class="content-area">
        <!-- 메시지 알림 -->
        <div th:if="${param.updateSuccess}" class="alert alert-success">프로필 정보가 성공적으로 변경되었습니다.</div>
        <div th:if="${param.pwSuccess}" class="alert alert-success">비밀번호가 성공적으로 변경되었습니다.</div>
        <div th:if="${param.pwError}" class="alert alert-error">기존 비밀번호가 일치하지 않습니다.</div>

        <!-- 1. 등급 및 포인트 카드 -->
        <div class="section-card" style="padding: 0; overflow: hidden; border: none;">
            <div th:class="'grade-box ' + ${progress.currentGrade.toLowerCase()}">
                <div class="grade-header">
                    <div>
                        <div class="grade-title">멤버십 등급</div>
                        <div class="grade-value">
                            <span th:text="${progress.currentGrade == 'DIAMOND' ? '다이아몬드' : (progress.currentGrade == 'GOLD' ? '골드' : (progress.currentGrade == 'SILVER' ? '실버' : '브론즈'))}">등급</span>
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <div class="grade-title">보유 포인트</div>
                        <div class="point-value"><span th:text="${#numbers.formatInteger(member.points ?: 0, 0, 'COMMA')}">0</span> P</div> 
                    </div>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" th:style="'width: ' + ${progress.progressPercentage} + '%'"></div>
                </div>
                <div class="progress-text" th:if="${progress.currentGrade != 'DIAMOND'}">
                    다음 등급까지 <strong th:text="${progress.pointsToNext}">0</strong>점 남았습니다. (활동점수 기준)
                </div>
                <div class="progress-text" th:if="${progress.currentGrade == 'DIAMOND'}">
                    최고 등급인 DIAMOND 회원님, 항상 감사합니다!
                </div>
            </div>
        </div>

        <!-- 2. 내 정보 수정 -->
        <div class="section-card" id="profile">
            <h2 class="section-title">👤 내 프로필 수정</h2>
            <form th:action="@{/mypage/update}" method="post">
                <div class="form-group">
                    <label>아이디</label>
                    <input type="text" class="form-control" th:value="${member.username}" disabled>
                </div>
                <div class="form-group">
                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" class="form-control" th:value="${member.name}" required>
                </div>
                <div class="form-group">
                    <label for="phoneNumber">전화번호</label>
                    <input type="text" id="phoneNumber" name="phoneNumber" class="form-control" th:value="${member.phoneNumber}" required>  
                </div>
                <button type="submit" class="btn btn-primary">변경사항 저장</button>
            </form>
        </div>

        <!-- 3. 비밀번호 변경 -->
        <div class="section-card" id="password">
            <h2 class="section-title">🔒 비밀번호 변경</h2>
            <form th:action="@{/mypage/password}" method="post" id="pwForm">
                <div class="form-group">
                    <label for="oldPassword">현재 비밀번호</label>
                    <input type="password" id="oldPassword" name="oldPassword" class="form-control" placeholder="현재 비밀번호 입력" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">새 비밀번호</label>
                    <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="새 비밀번호 입력 (8~20자)" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">새 비밀번호 확인</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="새 비밀번호 다시 입력" required>
                </div>
                <button type="submit" class="btn btn-outline">비밀번호 변경하기</button>
            </form>
        </div>

        <!-- 4. 위험 구역 (탈퇴) -->
        <div class="section-card danger-zone" id="withdraw">
            <h2 class="section-title danger-title">🚪 회원 탈퇴</h2>
            <p style="font-size: 14px; color: #ef4444; margin-bottom: 20px;">탈퇴 시 회원님의 모든 주문 내역 및 포인트 정보가 삭제되며 복구할 수 없습니다.</p>
            <form th:action="@{/mypage/withdraw}" method="post" onsubmit="return confirm('정말로 탈퇴하시겠습니까? 모든 데이터가 삭제됩니다.');">
                <button type="submit" class="btn btn-danger">탈퇴하기</button>
            </form>
        </div>
    </div>
</div>

<script>
    // 전화번호 하이픈 자동 삽입
    const phoneInput = document.getElementById('phoneNumber');
    phoneInput.addEventListener('input', (e) => {
        let val = e.target.value.replace(/[^0-9]/g, '');
        if (val.length > 3 && val.length <= 7) {
            val = val.slice(0, 3) + '-' + val.slice(3);
        } else if (val.length > 7) {
            val = val.slice(0, 3) + '-' + val.slice(3, 7) + '-' + val.slice(7, 11);
        }
        e.target.value = val;
    });

    // 비밀번호 일치 확인
    const pwForm = document.getElementById('pwForm');
    pwForm.addEventListener('submit', (e) => {
        const newPw = document.getElementById('newPassword').value;
        const confirmPw = document.getElementById('confirmPassword').value;
        if (newPw !== confirmPw) {
            e.preventDefault();
            alert('새 비밀번호가 일치하지 않습니다.');
        }
    });
</script>

<!-- 배달 위젯 -->
<th:block th:replace="~{fragments/delivery-widget :: deliveryWidget}"></th:block>
<!-- 채팅 위젯 통합 -->
<th:block th:replace="~{fragments/chat-widget :: chatWidget}"></th:block>

</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PIMTO - 문의 수정</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background: #f8fafc; min-height: 100vh; }
        .header { background: white; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e2e8f0; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-left img { height: 34px; object-fit: contain; }
        .back-btn { padding: 8px 16px; background: #f1f5f9; color: #64748b; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }
        .container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; border-radius: 16px; padding: 32px; border: 1px solid #e2e8f0; }
        .card-title { font-size: 20px; font-weight: 700; color: #1e293b; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #1e293b; margin-bottom: 8px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px 14px; border: 1px solid #e2e8f0;
            border-radius: 8px; font-size: 14px; font-family: 'Pretendard', sans-serif;
            outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: #6e8efb; }
        .form-group textarea { height: 200px; resize: none; }
        .secret-group { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
        .secret-group input { width: auto; }
        .secret-group label { font-size: 14px; font-weight: 500; color: #64748b; margin: 0; }
        .btn-group { display: flex; gap: 12px; }
        .submit-btn { flex: 1; padding: 14px; background: #1e293b; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
        .submit-btn:hover { background: #334155; }
        .cancel-btn { flex: 1; padding: 14px; background: white; color: #64748b; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        .cancel-btn:hover { background: #f8fafc; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <a href="/"><img th:src="@{/images/vending-logo.png}" alt="PIMTO 로고"></a>
    </div>
    <a th:href="@{/inquiry/detail/{id}(id=${inquiry.id})}" class="back-btn">← 돌아가기</a>
</div>

<div class="container">
    <div class="card">
        <div class="card-title">✏️ 문의 수정</div>
        <form th:action="@{/inquiry/edit/{id}(id=${inquiry.id})}" method="post">
            <div class="form-group">
                <label>제목</label>
                <input type="text" name="title" th:value="${inquiry.title}" required>
            </div>
            <div class="form-group">
                <label>내용</label>
                <textarea name="content" th:text="${inquiry.content}" required></textarea>
            </div>
            <div class="secret-group">
                <input type="checkbox" name="secret" id="secret" th:checked="${inquiry.secret}">
                <label for="secret">🔒 비밀글로 등록</label>
            </div>
            <div class="btn-group">
                <button type="submit" class="submit-btn">수정 완료</button>
                <a th:href="@{/inquiry/detail/{id}(id=${inquiry.id})}" class="cancel-btn">취소</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
